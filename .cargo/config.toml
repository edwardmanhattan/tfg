# The maplibre-native checkout the build script uses.
#
# The vendored crate keeps its checkout beside the crate, at
# `vendor/maplibre_native/target/maplibre-native`, which is a build
# artefact and therefore absent from a git worktree. A worktree build
# would otherwise try to clone all 39 submodules again, and two builds
# would race for the checkout lock.
#
# This value is the MAIN checkout's own path, so the main checkout's
# build is unchanged by it; a worktree now uses the same tree, and the
# same C++ build, as everything else.
#
# Not `force = true`: an explicit MLN_LOCAL_REPOSITORY in the
# environment still wins.
[env]
MLN_LOCAL_REPOSITORY = "/home/edward/Work/Crossnet/tfg/vendor/maplibre_native/target/maplibre-native"

# THIS checkout's own build tree.
#
# Cargo's final `target/debug/tfg` is whichever build ran LAST, so two
# checkouts sharing one target dir overwrite each other's binary — and a
# capture then photographs the OTHER agent's console, which looks exactly
# like your own edits having vanished. A checkout with its own target
# cannot be overwritten by another checkout, and the vendored MapLibre
# C++ checkout above is still shared, so the expensive part is built once.
#
# The path is RELATIVE to this file, so every checkout gets a target
# beside itself and a hard-coded absolute path here would send the MAIN
# checkout's builds into a worktree's tree — the same collision, wearing
# the other hat. Cargo resolves a relative `target-dir` against the
# directory holding this file's parent, which is the checkout root.
[build]
target-dir = "target"

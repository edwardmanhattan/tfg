[package]
name = "tfg"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
maplibre_native = "0.9"
image = "0.25"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Typed backend errors (already in the tree via the socket SDK).
thiserror = "2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
# Machine graphics-capability probe (`tfg::gpuprobe`), shared by both
# consoles' `--probe-gpu`. Names wgpu directly since U8 prep A (it used to
# ride eframe's re-export); version pinned to the lockfile's 30.0.1.
wgpu = "30"
tiny_http = "0.12.0"
# Live socket (transport resolution): pinned exact, own thread + own
# runtime in the actor; the UI thread never touches async.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync", "macros"] }
# The control plane's transport (`control::server`): HTTP JSON and one
# WebSocket route on the same port, on its own thread with its own runtime.
# hyper/tungstenite are already in the lockfile through the socket SDK, so
# this adds no new crate to the tree.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# `tfgctl watch`: the reference client's blocking WebSocket reader.
tungstenite = "0.28"
# Device tokens are stored as a hash (`control::devices`), so a copy of the
# devices file is not a copy of the credentials. Already in the tree.
sha2 = "0.10"
tokio-centrifuge = "=0.2.6"
# Local-first store (master-data ticket): sqlite with the amalgamation
# compiled in, so air-gapped delivery machines need no system library.
rusqlite = { version = "0.32", features = ["bundled"] }
# Refresh-token store (keyring resolution): OS keyring via the sync API,
# no async runtime needed. Secret Service on Linux (this host has a daemon;
# daemon-less machines degrade to a visible memory fallback, never silently).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Token-shape diagnosis (transport ticket): payload inspection for the
# no-expiry refusal rule (§3). Already in the tree transitively.
base64 = "0.22"
# UI sounds (sfx module): synthesized clicks/dings/buzzes through rodio on
# a background thread, no audio assets. Needs the ALSA dev headers at
# build time on Linux (this host has them); a machine with no audio
# device at RUNTIME stays silent, never broken.
rodio = "0.22"

# The console toolkit (ADR-0020, cut over at U8 step 5) — the dependency
# and its patches, resolved against the shipped crate rather than against
# a proto.
#
# Pinned EXACT, as every proto pins it: 0.2.x is what U1–U8 measured, and a
# minor bump is a new blade-graphics with a new shader and surface model.
#
# The cost is the standing one ADR-0020 accepted: ~520 more crates in the
# lockfile and ~3 GB more target, and Vulkan becomes mandatory at runtime
# through `blade`. The Linux package already carries `libvulkan1`, so
# packaging costs nothing new.
gpui = "=0.2.2"

# Vendored socket SDK (see vendor/tokio-centrifuge): upstream 0.2.6 cannot
# set the connect command's `data`, which is where Minos reads our token
# (§2, literal), and drops handshake refusal codes (H5: surfaced through
# on_disconnected by patch). Pinned version must match the dependency below.

[dev-dependencies]
# GPUI's headless test harness (VisualTestContext, `#[gpui::test]`) lives
# behind this feature. Enabled for tests only, so the shipped binary does
# not carry the extra input backends.
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
# 0.9.3 does not export Visual Studio's Release/Debug or vcpkg library
# directories to rustc; keep the Windows build fix local until upstream ships it.
#
# Also local: `mln_checkout.rs`, which fixes two upstream bugs in how this
# crate manages its own cached source checkout.
#
# 1. Upstream judges a cached checkout stale by looking for `CMakeLists.txt`,
#    deletes it, and clones again. Two builds overlapping — an editor's
#    `cargo check` and a terminal's `cargo run`, normal here — means one
#    deletes the tree the other is mid-clone into, restarting a 39-submodule
#    fetch. `ensure` only removes while holding a lock file, and waits for a
#    concurrent build instead of racing it.
# 2. Upstream's revision check could never pass. It resolves MLN_COMMIT as a
#    ref, but `clone_repository` fetches it with `--depth 1`, which leaves no
#    local ref — so every build saw a "wrong revision" and re-cloned 2 GB.
#    `expected_sha` reads the commit out of the tag's own name instead.
#
# Re-apply on the next version bump; no upstream issue filed.
maplibre_native = { path = "vendor/maplibre_native" }
tokio-centrifuge = { path = "vendor/tokio-centrifuge" }

# `xattr` 0.2.3, with `ENOATTR` rebound to `ENODATA` (61) rather than the
# `ENOSTR` (60) it ships. glibc defines `ENOATTR` AS `ENODATA`, so the upstream
# constant asks for an errno Linux never returns and every extended-attribute
# read fails as "no such attribute". The protos carry the same patch in their
# own `[patch.crates-io]`; it has to be here too, and that is the U4e lesson:
# CARGO IGNORES A PATH DEPENDENCY'S `[patch]`. `gpui-shell` resolved upstream
# `tokio-centrifuge` — no `with_connect_data`, no handshake refusal codes — for
# exactly as long as its patch lived only in the proto. U8 meets the same class
# of issue in reverse, so both patches now live at the root and the protos keep
# theirs for their own lockfiles.
xattr = { path = "proto/gpui-spike/patches/xattr" }

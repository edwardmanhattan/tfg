[package]
name = "tfg"
version = "0.1.0"
edition = "2024"

[dependencies]
maplibre_native = "0.9"
image = "0.25"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
egui = "0.36.2"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tiny_http = "0.12.0"

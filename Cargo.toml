[package]
name = "tfg"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
maplibre_native = "0.9"
image = "0.25"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Typed backend errors (already in the tree via the socket SDK).
thiserror = "2"
egui = "0.36.2"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "http"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tiny_http = "0.12.0"
# Live socket (transport resolution): pinned exact, own thread + own
# runtime in the actor; the UI thread never touches async.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tokio-centrifuge = "=0.2.6"
# Local-first store (master-data ticket): sqlite with the amalgamation
# compiled in, so air-gapped delivery machines need no system library.
rusqlite = { version = "0.32", features = ["bundled"] }
# Refresh-token store (keyring resolution): OS keyring via the sync API,
# no async runtime needed. Secret Service on Linux (this host has a daemon;
# daemon-less machines degrade to a visible memory fallback, never silently).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Token-shape diagnosis (transport ticket): payload inspection for the
# no-expiry refusal rule (§3). Already in the tree transitively.
base64 = "0.22"
# UI sounds (sfx module): synthesized clicks/dings/buzzes through rodio on
# a background thread, no audio assets. Needs the ALSA dev headers at
# build time on Linux (this host has them); a machine with no audio
# device at RUNTIME stays silent, never broken.
rodio = "0.22"

# Vendored socket SDK (see vendor/tokio-centrifuge): upstream 0.2.6 cannot
# set the connect command's `data`, which is where Minos reads our token
# (§2, literal), and drops handshake refusal codes (H5: surfaced through
# on_disconnected by patch). Pinned version must match the dependency below.
[patch.crates-io]
# 0.9.3 does not export Visual Studio's Release/Debug or vcpkg library
# directories to rustc; keep the Windows build fix local until upstream ships it.
#
# Also local: `mln_checkout.rs`, which fixes two upstream bugs in how this
# crate manages its own cached source checkout.
#
# 1. Upstream judges a cached checkout stale by looking for `CMakeLists.txt`,
#    deletes it, and clones again. Two builds overlapping — an editor's
#    `cargo check` and a terminal's `cargo run`, normal here — means one
#    deletes the tree the other is mid-clone into, restarting a 39-submodule
#    fetch. `ensure` only removes while holding a lock file, and waits for a
#    concurrent build instead of racing it.
# 2. Upstream's revision check could never pass. It resolves MLN_COMMIT as a
#    ref, but `clone_repository` fetches it with `--depth 1`, which leaves no
#    local ref — so every build saw a "wrong revision" and re-cloned 2 GB.
#    `expected_sha` reads the commit out of the tag's own name instead.
#
# Re-apply on the next version bump; no upstream issue filed.
maplibre_native = { path = "vendor/maplibre_native" }
tokio-centrifuge = { path = "vendor/tokio-centrifuge" }

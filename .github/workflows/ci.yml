name: Cross-platform build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MLN_PRECOMPILE: "0"
  MLN_CORE_LIBRARY_USE_AMALGAM: "0"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: tfg
            maplibre_feature: maplibre_native/vulkan
            timeout: 60
          - os: macos-15
            platform: macos
            binary: tfg
            maplibre_feature: maplibre_native/metal
            timeout: 90
          - os: windows-2022
            platform: windows
            binary: tfg.exe
            maplibre_feature: maplibre_native/opengl
            timeout: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libfontconfig-dev \
            libicu-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libuv1-dev \
            libwebp-dev \
            libz-dev \
            ninja-build \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            curl \
            jpeg-turbo \
            libpng \
            libuv \
            ninja \
            webp \
            zlib

      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out MapLibre Native source
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maplibre/maplibre-native
          ref: core-a33d3f00fb9dbf9117ce18edd799aa0ca5bcce5b
          path: target/maplibre-native
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install Windows MapLibre dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\target\maplibre-native\platform\windows\Get-VendorPackages.ps1" -Triplet x64-windows -Renderer OpenGL -With-ICU
          "MLN_LOCAL_REPOSITORY=${{ github.workspace }}\target\maplibre-native" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --locked --features ${{ matrix.maplibre_feature }}

      - name: Verify embedded runtime
        shell: bash
        env:
          TFG_DATA_DIR: ${{ runner.temp }}/tfg-runtime-check
        run: |
          target/release/${{ matrix.binary }} --check-runtime
          target/release/${{ matrix.binary }} --version

      - name: Package Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/package
          mkdir -p dist/package
          cp target/release/${{ matrix.binary }} dist/package/
          cp licenses/maplibre-native-LICENSE.md dist/package/THIRD-PARTY-NOTICES.md
          cp docs/runtime-paths.md dist/package/README.md
          tar -C dist/package -czf dist/tfg-linux-x86_64.tar.gz .
          rm -rf "$RUNNER_TEMP/tfg-bundle"
          mkdir -p "$RUNNER_TEMP/tfg-bundle"
          tar -C "$RUNNER_TEMP/tfg-bundle" -xzf dist/tfg-linux-x86_64.tar.gz
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_DATA_DIR="$RUNNER_TEMP/tfg-bundle/data" ./tfg --check-runtime)
          rm -rf "$RUNNER_TEMP/tfg-bundle/data"
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_PORTABLE=1 ./tfg --check-runtime)

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/ARCONS.app
          mkdir -p dist/ARCONS.app/Contents/MacOS dist/ARCONS.app/Contents/Resources
          cp target/release/${{ matrix.binary }} dist/ARCONS.app/Contents/MacOS/tfg
          cp packaging/macos/Info.plist dist/ARCONS.app/Contents/Info.plist
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ || "$version" != "$package_version" ]]; then
              echo "release tag must match Cargo.toml version v$package_version; got $GITHUB_REF_NAME" >&2
              exit 1
            fi
            sed -i '' "s/0.1.0/$version/g" dist/ARCONS.app/Contents/Info.plist
          fi
          cp licenses/maplibre-native-LICENSE.md dist/ARCONS.app/Contents/Resources/THIRD-PARTY-NOTICES.md
          cp docs/runtime-paths.md dist/ARCONS.app/Contents/Resources/README.md
          (cd dist && zip -qry tfg-macos-${{ runner.arch }}.zip ARCONS.app)
          rm -rf "$RUNNER_TEMP/tfg-bundle"
          mkdir -p "$RUNNER_TEMP/tfg-bundle"
          unzip -q dist/tfg-macos-${{ runner.arch }}.zip -d "$RUNNER_TEMP/tfg-bundle"
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_DATA_DIR="$RUNNER_TEMP/tfg-bundle/data" ./ARCONS.app/Contents/MacOS/tfg --check-runtime)

      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "dist/tfg-windows-x64"
          Remove-Item -Recurse -Force $package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "$package/tfg.exe"
          Copy-Item "licenses/maplibre-native-LICENSE.md" "$package/THIRD-PARTY-NOTICES.md"
          Copy-Item "docs/runtime-paths.md" "$package/README.md"
          Compress-Archive -Path $package -DestinationPath "dist/tfg-windows-x64.zip"
          $testRoot = Join-Path $env:RUNNER_TEMP "tfg-bundle"
          Remove-Item -Recurse -Force $testRoot -ErrorAction SilentlyContinue
          Expand-Archive -Path "dist/tfg-windows-x64.zip" -DestinationPath $testRoot
          $env:TFG_DATA_DIR = Join-Path $testRoot "data"
          Push-Location $testRoot
          & "tfg-windows-x64/tfg.exe" --check-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Upload distribution bundle
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfg-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/tfg-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux distribution bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfg-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/tfg-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" == "$package_version" ]] || {
            echo "release tag must match Cargo.toml version v$package_version; got $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Download distribution bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: tfg-*
          path: release-artifacts
          merge-multiple: true

      - name: Attach bundles to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          test "${#bundles[@]}" -eq 3
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "tfg $GITHUB_REF_NAME"
          fi

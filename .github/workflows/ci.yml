name: Cross-platform build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MLN_PRECOMPILE: "0"
  MLN_CORE_LIBRARY_USE_AMALGAM: "0"
  MAPLIBRE_NATIVE_REF: core-a33d3f00fb9dbf9117ce18edd799aa0ca5bcce5b

jobs:
  check:
    name: Fast Linux check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libicu-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libuv1-dev \
            libwebp-dev \
            libz-dev \
            ninja-build \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Linux build
        run: cargo check --locked --features maplibre_native/vulkan

  notices:
    name: Generate dependency notices
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate dependency license notices
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-about >/dev/null 2>&1; then
            cargo install --locked --features cli cargo-about --version 0.9.2
          fi
          mkdir -p dist
          cargo about generate --locked --fail --output-file dist/THIRD-PARTY-NOTICES.html packaging/about.hbs

      - name: Upload dependency notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: dist/THIRD-PARTY-NOTICES.html
          if-no-files-found: error
          retention-days: 1

  build:
    needs: notices
    if: github.event_name != 'pull_request'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: tfg
            maplibre_feature: maplibre_native/vulkan
            native_cxxflags: ""
            timeout: 60
          - os: macos-15
            platform: macos
            binary: tfg
            maplibre_feature: maplibre_native/metal
            native_cxxflags: ""
            timeout: 90
          - os: windows-2022
            platform: windows
            binary: tfg.exe
            maplibre_feature: maplibre_native/opengl
            native_cxxflags: "/std:c++20 /EHsc /wd4068"
            timeout: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dependency notices
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: third-party-notices
          path: dist

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libicu-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libuv1-dev \
            libwebp-dev \
            libz-dev \
            ninja-build \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            curl \
            jpeg-turbo \
            libpng \
            libuv \
            ninja \
            webp \
            zlib

      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Check out MapLibre Native source
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maplibre/maplibre-native
          ref: ${{ env.MAPLIBRE_NATIVE_REF }}
          path: .ci/maplibre-native
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Restore Windows MapLibre vendor cache
        if: runner.os == 'Windows'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: .ci/maplibre-native/platform/windows/vendor
          key: windows-maplibre-${{ env.MAPLIBRE_NATIVE_REF }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-maplibre-${{ env.MAPLIBRE_NATIVE_REF }}-

      - name: Install Windows MapLibre dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $vendorScript = "${{ github.workspace }}\.ci\maplibre-native\platform\windows\Get-VendorPackages.ps1"
          $vendorArgs = @{
            Triplet = "x64-windows"
            Renderer = "OpenGL"
            "With-ICU" = $true
          }
          & $vendorScript @vendorArgs
          if ($LASTEXITCODE -ne 0) { throw "MapLibre vendor setup failed with exit code $LASTEXITCODE" }
          $vendorRoot = "${{ github.workspace }}\.ci\maplibre-native\platform\windows\vendor\vcpkg"
          if (-not (Test-Path "$vendorRoot\installed\x64-windows\include\curl\curl.h")) {
            throw "MapLibre vendor setup did not install the expected x64-windows packages"
          }
          "MLN_LOCAL_REPOSITORY=${{ github.workspace }}\.ci\maplibre-native" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        env:
          CXXFLAGS: ${{ matrix.native_cxxflags }}
        run: cargo build --release --locked --features ${{ matrix.maplibre_feature }} --timings

      - name: Upload Cargo timings on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ matrix.platform }}-${{ runner.arch }}
          path: target/cargo-timings
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify embedded runtime
        shell: bash
        env:
          TFG_DATA_DIR: ${{ runner.temp }}/tfg-runtime-check
        run: |
          target/release/${{ matrix.binary }} --check-runtime
          target/release/${{ matrix.binary }} --version

      - name: Package Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/package
          mkdir -p dist/package
          cp target/release/${{ matrix.binary }} dist/package/
          cp dist/THIRD-PARTY-NOTICES.html dist/package/
          cp licenses/maplibre-native-LICENSE.md dist/package/MAPLIBRE-NATIVE-LICENSE.md
          cp docs/runtime-paths.md dist/package/README.md
          tar -C dist/package -czf dist/tfg-linux-x86_64.tar.gz .

          rm -rf "$RUNNER_TEMP/tfg-bundle"
          mkdir -p "$RUNNER_TEMP/tfg-bundle"
          tar -C "$RUNNER_TEMP/tfg-bundle" -xzf dist/tfg-linux-x86_64.tar.gz
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_DATA_DIR="$RUNNER_TEMP/tfg-bundle/data" ./tfg --check-runtime)
          rm -rf "$RUNNER_TEMP/tfg-bundle/data"
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_PORTABLE=1 ./tfg --check-runtime)

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/ARCONS.app dist/data
          mkdir -p dist/ARCONS.app/Contents/MacOS dist/ARCONS.app/Contents/Resources dist/data
          touch dist/data/.keep
          mkdir -p dist/ARCONS.app/Contents/Frameworks
          cp target/release/${{ matrix.binary }} dist/ARCONS.app/Contents/MacOS/tfg
          chmod 755 dist/ARCONS.app/Contents/MacOS/tfg
          cp packaging/macos/Info.plist dist/ARCONS.app/Contents/Info.plist
          resolve_dependency() {
            local source_binary="$1"
            local reference="$2"
            local name rpath candidate
            case "$reference" in
              @rpath/*)
                name="${reference#@rpath/}"
                while read -r rpath; do
                  case "$rpath" in
                    @loader_path/*)
                      candidate="$(dirname "$source_binary")/${rpath#@loader_path/}/$name"
                      ;;
                    @executable_path/*)
                      candidate="$(dirname "$source_binary")/${rpath#@executable_path/}/$name"
                      ;;
                    *)
                      candidate="$rpath/$name"
                      ;;
                  esac
                  if [[ -f "$candidate" ]]; then
                    printf '%s' "$candidate"
                    return 0
                  fi
                done < <(otool -l "$source_binary" | awk '$1 == "path" { print $2 }')
                ;;
              @loader_path/*)
                candidate="$(dirname "$source_binary")/${reference#@loader_path/}"
                if [[ -f "$candidate" ]]; then
                  printf '%s' "$candidate"
                  return 0
                fi
                ;;
              @executable_path/*)
                candidate="$(dirname "$source_binary")/${reference#@executable_path/}"
                if [[ -f "$candidate" ]]; then
                  printf '%s' "$candidate"
                  return 0
                fi
                ;;
              *)
                printf '%s' "$reference"
                return 0
                ;;
            esac
            return 1
          }
          bundle_dylibs() {
            local binary="$1"
            local frameworks="$2"
            local source_binary="${3:-$binary}"
            local raw_dependency dependency name destination newly_copied
            local source_id binary_id
            source_id="$(otool -D "$source_binary" 2>/dev/null | awk 'NR == 2 { print $1 }')"
            binary_id="$(otool -D "$binary" 2>/dev/null | awk 'NR == 2 { print $1 }')"
            while read -r raw_dependency; do
              if [[ ( -n "$source_id" && "$raw_dependency" == "$source_id" ) || ( -n "$binary_id" && "$raw_dependency" == "$binary_id" ) ]]; then
                continue
              fi
              if ! dependency="$(resolve_dependency "$source_binary" "$raw_dependency")"; then
                echo "unresolved macOS dependency: $raw_dependency (from $source_binary)" >&2
                return 1
              fi
              [[ "$dependency" == /* ]] || continue
              case "$dependency" in
                /System/*|/usr/lib/*) continue ;;
              esac
              if [[ ! -f "$dependency" ]]; then
                echo "missing macOS dependency: $dependency" >&2
                return 1
              fi
              name="$(basename "$dependency")"
              destination="$frameworks/$name"
              newly_copied=0
              if [[ ! -f "$destination" ]]; then
                cp "$dependency" "$destination"
                install_name_tool -id "@loader_path/../Frameworks/$name" "$destination"
                newly_copied=1
              fi
              install_name_tool -add_rpath "@loader_path/../Frameworks" "$destination" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../Frameworks" "$binary" 2>/dev/null || true
              install_name_tool -change "$raw_dependency" "@loader_path/../Frameworks/$name" "$binary"
              if [[ "$newly_copied" == 1 ]]; then
                bundle_dylibs "$destination" "$frameworks" "$dependency"
              fi
            done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')
          }
          bundle_dylibs dist/ARCONS.app/Contents/MacOS/tfg dist/ARCONS.app/Contents/Frameworks dist/ARCONS.app/Contents/MacOS/tfg
          install_name_tool -add_rpath "@loader_path/../Frameworks" dist/ARCONS.app/Contents/MacOS/tfg 2>/dev/null || true
          for binary in dist/ARCONS.app/Contents/MacOS/tfg dist/ARCONS.app/Contents/Frameworks/*; do
            [[ -f "$binary" ]] || continue
            while read -r dependency; do
              case "$dependency" in
                /System/*|/usr/lib/*|@*) ;;
                *)
                  echo "unbundled macOS dependency: $dependency ($binary)" >&2
                  exit 1
                  ;;
              esac
            done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')
          done
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          sed -i '' "s/0.0.0/$package_version/g" dist/ARCONS.app/Contents/Info.plist
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ || "$version" != "$package_version" ]]; then
              echo "release tag must match Cargo.toml version v$package_version; got $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          cp dist/THIRD-PARTY-NOTICES.html dist/ARCONS.app/Contents/Resources/
          cp licenses/maplibre-native-LICENSE.md dist/ARCONS.app/Contents/Resources/MAPLIBRE-NATIVE-LICENSE.md
          cp docs/runtime-paths.md dist/ARCONS.app/Contents/Resources/README.md
          find dist/ARCONS.app/Contents/Frameworks -type f -exec chmod 755 {} +
          codesign --force --deep --sign - dist/ARCONS.app
          codesign --verify --deep --strict --verbose=2 dist/ARCONS.app
          (cd dist && zip -qry tfg-macos-${{ runner.arch }}.zip ARCONS.app data)
          rm -rf "$RUNNER_TEMP/tfg-bundle"
          mkdir -p "$RUNNER_TEMP/tfg-bundle"
          unzip -q dist/tfg-macos-${{ runner.arch }}.zip -d "$RUNNER_TEMP/tfg-bundle"
          test -x "$RUNNER_TEMP/tfg-bundle/ARCONS.app/Contents/MacOS/tfg"
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_DATA_DIR="$RUNNER_TEMP/tfg-bundle/data" ./ARCONS.app/Contents/MacOS/tfg --check-runtime)
          rm -rf "$RUNNER_TEMP/tfg-bundle/data"
          (cd "$RUNNER_TEMP/tfg-bundle" && TFG_PORTABLE=1 ./ARCONS.app/Contents/MacOS/tfg --check-runtime)

      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "dist/tfg-windows-x64"
          Remove-Item -Recurse -Force $package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "$package/tfg.exe"
          Copy-Item "dist/THIRD-PARTY-NOTICES.html" "$package/THIRD-PARTY-NOTICES.html"
          Copy-Item "licenses/maplibre-native-LICENSE.md" "$package/MAPLIBRE-NATIVE-LICENSE.md"
          Copy-Item "docs/runtime-paths.md" "$package/README.md"
          Compress-Archive -Path $package -DestinationPath "dist/tfg-windows-x64.zip"
          $testRoot = Join-Path $env:RUNNER_TEMP "tfg-bundle"
          Remove-Item -Recurse -Force $testRoot -ErrorAction SilentlyContinue
          Expand-Archive -Path "dist/tfg-windows-x64.zip" -DestinationPath $testRoot
          $env:TFG_DATA_DIR = Join-Path $testRoot "data"
          Push-Location $testRoot
          & "tfg-windows-x64/tfg.exe" --check-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Upload distribution bundle
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfg-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/tfg-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux distribution bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfg-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/tfg-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  debian_package:
    name: Build Debian 13 package
    needs: notices
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            dpkg-dev \
            git \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libicu-dev \
            libjpeg62-turbo-dev \
            libpng-dev \
            libssl-dev \
            libuv1-dev \
            libwebp-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dependency notices
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: third-party-notices
          path: dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Debian binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --features maplibre_native/vulkan --timings

      - name: Upload Debian Cargo timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-debian13-amd64
          path: target/cargo-timings
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          shlib_root="$RUNNER_TEMP/tfg-dpkg"
          deb_dir="dist/debian-package/tfg"
          rm -rf "$shlib_root" dist/debian-package
          mkdir -p "$shlib_root/debian" "$deb_dir/DEBIAN" "$deb_dir/usr/bin" "$deb_dir/usr/share/doc/tfg"
          cat > "$shlib_root/debian/control" <<EOF
          Source: tfg
          Section: utils
          Priority: optional
          Maintainer: Crossnet
          Standards-Version: 4.6.2
          EOF
          depends="$(cd "$shlib_root" && dpkg-shlibdeps --ignore-missing-info -O "$GITHUB_WORKSPACE/target/release/tfg" | sed -n 's/^shlibs:Depends=//p')"
          depends="${depends:+$depends,}ca-certificates,libgl1,libsharpyuv0,libvulkan1,libwayland-client0,libx11-6,libxkbcommon0"
          cp target/release/tfg "$deb_dir/usr/bin/tfg"
          cp dist/THIRD-PARTY-NOTICES.html "$deb_dir/usr/share/doc/tfg/"
          cp licenses/maplibre-native-LICENSE.md "$deb_dir/usr/share/doc/tfg/MAPLIBRE-NATIVE-LICENSE.md"
          cp docs/runtime-paths.md "$deb_dir/usr/share/doc/tfg/README.md"
          installed_size="$(du -sk "$deb_dir/usr" | cut -f1)"
          cat > "$deb_dir/DEBIAN/control" <<EOF
          Package: tfg
          Version: $package_version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Crossnet
          Installed-Size: $installed_size
          Description: ARCONS tactical command center
           egui desktop application for live and simulation workflows.
          Depends: $depends
          EOF
          dpkg-deb --build --root-owner-group "$deb_dir" "dist/tfg_${package_version}_amd64.deb"
          dpkg-deb --info "dist/tfg_${package_version}_amd64.deb"
          rm -rf "$RUNNER_TEMP/tfg-deb"
          dpkg-deb --extract "dist/tfg_${package_version}_amd64.deb" "$RUNNER_TEMP/tfg-deb"
          (cd "$RUNNER_TEMP/tfg-deb" && TFG_DATA_DIR="$RUNNER_TEMP/tfg-deb/data" ./usr/bin/tfg --check-runtime)

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfg-debian13-amd64
          path: dist/tfg_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [notices, build, debian_package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" == "$package_version" ]] || {
            echo "release tag must match Cargo.toml version v$package_version; got $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Download distribution bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: tfg-*
          path: release-artifacts
          merge-multiple: true

      - name: Attach bundles to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          test "${#bundles[@]}" -eq 4
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${bundles[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \

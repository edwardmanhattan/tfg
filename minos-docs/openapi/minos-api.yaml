openapi: 3.0.3

# Minos — Tactical Floor Game API
#
# THE LIFECYCLE, THE SETUP AND EXECUTION ARE BUILT, AND ALL OF IT IS IN THIS DOCUMENT.
#
#   slice 1    auth, users, lookup tables, unit and unit-class reads         BUILT, FROZEN
#   slice 1b   unit and unit-class writes, specification versioning          BUILT, FROZEN
#   slice 2    game lifecycle: games, participants, hierarchy, unit tasking  BUILT
#   slice 3    execution: orders, position reports, factor, messages, judgements
#              BUILT:  orders, the assumed clock (pause, resume, rate), map placement,
#                      the position read, the distance and bearing queries, and MESSAGING
#              LEFT:   judgements, simulated events and warnings — NOT IN THIS DOCUMENT
#
# A client generated from this document today sees the whole of the lifecycle, the MOVEMENT MODEL of
# Execution, and its MESSAGING — and nothing else of it. Concept §3 defines Execution as eight things,
# so items 6, 7 and 8 (judgements, simulated events, warnings) have no path here at all, and the
# closure phase has none either. That is why the gap is stated rather than left to be discovered.
#
# THIS HEADER SAID "slice 3 NOT STARTED" AND "the hierarchy has not [landed]" UNTIL 2026-09-22, long
# after both were false. It is the first thing every reader and every code generator sees, so a
# stale header here is worse than a stale paragraph anywhere else in the repository — it is the one
# place where being wrong is invisible to whoever acts on it.
#
# The whole of Execution has been exercised end to end over HTTP by `scripts/rehearse_game.py`,
# which drives this contract and nothing else.
#
# The unit-class image bundle is NOT part of a slice. It is a request from the Rust desktop team,
# which needed every vessel picture in ONE round trip rather than one per class, and it landed
# beside the taxonomy it belongs to.
#
# `maneuver` is the only game mode in this release. `static` is deferred and is deliberately absent
# from the GameMode enum rather than present and unimplemented. `operational` was REMOVED rather than
# deferred: it was never a mode, because real vessels reporting their own positions is a live feed
# with no game attached. It will land as its own resource, not as a value here.
#
# A note on PATCH and nullable fields. OpenAPI 3.0 cannot distinguish "field absent"
#   from "field explicitly null" in a schema — `nullable: true` permits both, and a
#   generated client renders both as a nil pointer with `omitempty`, so it will send
#   neither. "Clear this field" is therefore expressed as an EMPTY STRING for text
#   fields, which every generator can emit. The service stores it as NULL, never as an
#   empty string; the database CHECK constraint refuses a literal empty string in the
#   column, so a service that forgets to convert fails loudly rather than storing a
#   value that is neither a hull number nor its absence.
#
# Two frontend teams generate clients from this document, so it is the contract, not
# a description of the code. Where they disagree the code is wrong.
#
# ---------------------------------------------------------------------------
# DELIBERATE CHOICES, and why
# ---------------------------------------------------------------------------
# OpenAPI 3.0.3, NOT 3.1.  3.1 is closer to JSON Schema and is the better spec, but
#   generator support is uneven — oapi-codegen is complete on 3.0 and partial on 3.1,
#   and the Rust and Dart generators are less consistent still. Three consumers is
#   enough that the safer dialect wins.
#
# NO allOf ANYWHERE.  Typing the envelope's `data` per endpoint is the textbook use of
#   allOf, but generators disagree about intersecting two branches that both declare
#   `data` — some emit a union, some a nested struct, some fail. Every success
#   response therefore has an explicit, self-contained `<Thing>Envelope` schema. It is
#   more verbose to author and far less likely to generate something wrong.
#
# snake_case THROUGHOUT, matching the Go json tags. Mixing conventions across a
#   15-endpoint surface is how a generated client ends up with `pageSize` on one route
#   and `page_size` on another.
#
# `data` is an ARRAY and `metadata` carries pagination for list endpoints, matching
#   response.Response and pagination.PaginationMetadata in the code.

info:
  title: Minos Tactical Floor Game API
  version: 0.1.0
  description: |
    Backend for the Indonesian Navy (TNI AL) Tactical Floor Game.

    ## Response envelope

    Every response, success or failure, is the same envelope. A client therefore has
    exactly one shape to unwrap and one place to read an error from.

    ```json
    { "status_code": 200, "message": "Successfull", "data": { }, "metadata": { } }
    ```

    * `data` is `null` on a 5xx, and on a 4xx when the failure is not attributable to a
      named input.
    * `metadata` is present only on paginated list endpoints.

    **One response in this document is NOT the envelope:**
    `GET /assets/unit-class-images` returns a binary zip. A client either saves it or
    unzips it, and neither can do anything with a `data` wrapper around a zip. Its 304
    is likewise bodyless, as a 304 must be.

    ## Errors

    Every 4xx and 5xx body is `ErrorResponse`. Field-level failures carry a map from
    the **request field name** to a human-readable reason, keyed exactly as the client
    sent it — so `{"errors": {"name": "This field is required."}}` refers to the `name`
    field of the request body, not to any internal name.

    | Status | Meaning                                                              |
    |--------|----------------------------------------------------------------------|
    | 400    | The request parsed but a field failed validation — see `data.errors`. |
    | 401    | No token, or a token that is expired or invalid.                      |
    | 403    | Authenticated, but not permitted. Also: the account is not Active.     |
    | 404    | The resource does not exist, or is soft-deleted.                       |
    | 409    | A uniqueness constraint was violated (username, email, hull number).   |
    | 422    | The body could not be parsed at all.                                  |
    | 429    | Rate limited. `Retry-After` says how long to wait.                     |
    | 500    | A defect on our side. The body never contains internal detail.         |

    ## Authentication

    `Authorization: Bearer <access_token>` on everything except `/auth/login` and
    `/auth/refresh`.

    Refresh tokens are returned **both** as an `HttpOnly` cookie and, when the request
    asks for it, in the response body. Browser clients should rely on the cookie;
    mobile and desktop clients have no cookie jar and must use the body. See
    `TokenPair.refresh_token`.

  contact:
    name: Minos backend
  license:
    # Not an open-source licence. Stated explicitly because the delivered bundle is
    # proprietary to the client, and an absent licence field reads as "unresolved".
    #
    # There is deliberately no `url`: any URL here would point at terms that do not
    # exist. OpenAPI 3.1 added a `identifier` field for exactly this case, but this
    # document is 3.0.3 (see the header for why), so the strict licence rule is
    # switched off in redocly.yaml instead.
    name: Proprietary — not for redistribution

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://{host}/api/v1
    description: Dev VPS and the air-gapped delivery host
    variables:
      host:
        default: minos.local
        description: Replaced with the deployment address at generation time.

tags:
  - name: auth
    description: Sign in, refresh, sign out. No token required.
  - name: users
    description: The caller's own account, and account administration.
  - name: games
    description: |
      Exercises: their lifecycle, their roster, the force in them, and the task organisation they
      are run from.

      ## How the in-game routes are gated

      Every route under `/games/{id}/...` admits **two kinds of caller**, and they hold their
      authority in different places:

      1. **An application administrator**, holding the action on `/system/games` in the `system`
         domain. This is how the CMS builds an exercise — the operator setting one up is usually
         not a participant in it, and requiring them to be would make the CMS unusable for its
         main job.
      2. **A participant whose GAME ROLE holds the action**, evaluated in that game's own domain.
         This is what `PUT /game-roles/{id}/permissions` controls.

      Either is sufficient — a caller who satisfies one may proceed, and need not satisfy both. The
      administrator path is asked **first**, so an operator who also holds a narrow role in a game
      they are running is not judged by the narrower one.

      **Grants do not cross games.** A role granted `/games/units` `read` in one exercise holds it
      in that exercise only: the role is held per game, so calling the same route with another
      game's id is refused with `403`.

      ## Routes that are NOT gated this way

      `POST /games/join`, the readiness pair (`PUT`/`DELETE /games/{id}/readiness`), and
      `POST /games/{id}/transitions` are **authentication-only**. What authorises them is holding a
      **place** in the game — a fact about a row — and the check is an instance comparison in the
      service rather than a policy, because a Casbin object names a resource family and carries no
      instance id. Each of those operations says so where it appears.

      `GET /games` and `POST`/`PATCH`/`DELETE /games/{id}` remain **application** capabilities:
      creating, editing and withdrawing an exercise is a CMS operation, and the in-game roles
      govern what happens *inside* one rather than who may set it up.

      ## A role with no permissions can do nothing

      A game role holds exactly what the permission matrix grants it and nothing more. Only
      `/games/transitions` `transition` is seeded, for the Game Master, so on a fresh deployment
      the practical effect of the two-path gating is confined to the state machine until an
      operator authors the rest.
  - name: master-data
    description: Lookup tables and the unit taxonomy. Mostly operator-owned reference data.
  - name: live-feed
    description: |
      Where the fleet currently is, and who is reporting for each vessel.

      A **live feed**, not a game mode. A real vessel reporting its own position has no game, no
      closure, and no judges — it is continuous, and it outlives every exercise. The standing
      position picture is therefore a resource of its own rather than a variation on `/games`.

      **The fleet is also pushed over a live socket**, which is not an HTTP resource and so has no
      path in this document — see `docs/realtime-protocol.md`. A subscriber to the `live-feed`
      channel receives one message per vessel per beacon batch, and does not poll these endpoints.
      The two are different paths to the same data and neither is deprecated: read here for the
      initial picture, listen on the socket for updates.

security:
  - bearerAuth: []

paths:
  # =========================================================================
  # auth
  # =========================================================================
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: |
        Exchanges credentials for a token pair.

        **Unknown user and wrong password return an identical 401.** Distinguishing
        them would turn this endpoint into a username oracle.

        403 is returned only *after* the credentials are verified, when the account is
        not `Active`. Requiring a valid password to learn that an account exists keeps
        enumeration closed while still giving a disabled user a truthful message
        instead of "wrong password". The `System` account can never satisfy either
        check: its stored hash is not a valid PHC string, so no password verifies.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. A refresh cookie is also set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: minos_refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth
              description: Present for browser clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access token
      description: |
        The refresh token is read from the `HttpOnly` cookie if present, otherwise from
        the request body. Native clients use the body; browsers use the cookie.

        Refresh tokens are rotated: the response carries a new one and the presented one
        is invalidated. A client that replays an old refresh token is rejected, which is
        what makes theft detectable.
      security: []
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Issued a new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: |
        Invalidates the presented refresh token and clears the cookie. The access token
        remains valid until it expires, which is why `JWT_DURATION_SECONDS` should stay
        short — revocation of a stateless token is not possible.
      operationId: logout
      responses:
        '204':
          description: Signed out. Always 204, whether or not a session existed, so that calling it twice is not an error.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # =========================================================================
  # users — the caller's own account
  # =========================================================================
  /users/me:
    get:
      tags: [users]
      summary: The authenticated account
      description: |
        Authorized by authentication alone — every role may read its own account. No
        Casbin policy is involved, because a policy object cannot be scoped to "the
        caller's own row".
      operationId: getOwnUser
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [users]
      summary: Update the authenticated account
      description: |
        **Cannot change `id_user_status` or `roles`.** Those are administrative fields and
        appear only in `UserAdminUpdateRequest`. The two request schemas are separate
        types on purpose: a single shared schema would drift into carrying an
        administrative field, and that would be a privilege escalation reachable from a
        self-service route.
      operationId: updateOwnUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSelfUpdateRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/password:
    put:
      tags: [users]
      summary: Change the authenticated account's password
      description: |
        Requires the current password. On success every other refresh token for this
        account is invalidated.

        The password is passed to Argon2id **byte for byte**. It is never trimmed,
        whitespace-collapsed or otherwise normalised — a value that is altered between
        being set and being verified means the user can never sign in again, and it is
        not reproducible from what they typed.
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # =========================================================================
  # users — administration
  # =========================================================================
  /users:
    get:
      tags: [users]
      summary: List accounts
      description: |
        Requires the `read` action on `/system/users`.

        Returns **every** account, with no row-level scope. G1 was answered on
        2026-09-14: administration is an out-of-game function, so a role holding `read`
        on `/system/users` may read any account. Inside a game a Commando cannot take
        administrative action at all, which is a separate concern carried by the
        game-scoped policies. See `docs/client-questions.md`.

        The Casbin check on the resource family is therefore the whole rule, and no
        service method compares the actor's unit against the target's.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Matches against name, username and email, case-insensitively.
        - name: id_user_status
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by status. Excludes soft-deleted rows regardless.
        - name: id_app_role
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter to accounts holding a role.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: name
          description: A leading `-` sorts descending.
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [users]
      summary: Create an account
      description: |
        Requires the `create` action on `/system/users`.

        The account is created with the password supplied here; there is no invitation
        email, because the delivery host is air-gapped.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [users]
      summary: Get an account
      operationId: getUser
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [users]
      summary: Update an account
      description: |
        Requires the `update` action on `/system/users`.

        **Any** account may be updated; there is no row-level ownership rule. G1 was
        answered on 2026-09-14: administration is an out-of-game function, so the Casbin
        check on the resource family is the whole rule. See `docs/client-questions.md`.

        Casbin still cannot answer "may this Operator update *this* account" — policy
        objects deliberately carry no instance ids. The question does not arise here,
        rather than being answered somewhere else.

        Only the fields present are changed; a field that is absent is left alone.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminUpdateRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [users]
      summary: Delete an account
      description: |
        Requires the `delete` action on `/system/users`.

        This is a **soft delete**: the row keeps its history and the account can no
        longer authenticate. Because the uniqueness indexes are partial on
        `deleted_at IS NULL`, the username and email are released and may be reused by a
        new account.
      operationId: deleteUser
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      tags: [users]
      summary: Reset an account's password
      description: |
        Requires the `update` action on `/system/users`. Administrative reset does not
        require the current password — the operator does not know it.

        Every refresh token for the target account is invalidated.
      operationId: resetUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password reset.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      tags: [users]
      summary: Replace which application roles an account holds
      description: |
        Requires the `update` action on **`/system/roles`** — NOT on `/system/users`.

        **That separation is the point of this operation.** Every other route under `/users/{id}`
        checks `/system/users`, so an Operator who may correct an account's details cannot promote
        anybody — themselves included — to Administrator. Bundling the two would mean one grant
        bought both, and "may fix a typo in a name" would silently carry "may hand out
        Administrators".

        **It is also the only thing that distinguishes the two seeded roles.** As of migration
        000025, `Administrator` and `Operator` hold the same 32 permissions; this grant is the one
        an Operator does not have. A client rendering the role picker should therefore expect a
        `403` for anyone but an Administrator — which is a working boundary, not a bug.

        The body is the **complete set**, not a delta, so sending the same set twice is a no-op and
        a retry is safe. A revoked grant is recorded as a tombstone rather than erased, so
        `user_roles` keeps who removed which role and when, and re-granting the same role later
        writes a fresh row rather than rewriting history.

        An unknown role id is refused **before anything is written**, so a request naming one bad id
        leaves the account's existing roles exactly as they were.
      operationId: replaceUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesUpdateRequest'
      responses:
        '200':
          description: The account with the roles it now holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [users]
      summary: Activate or deactivate an account
      description: |
        Requires the `update` action on `/system/users`.

        Separate from `PATCH /users/{id}` because deactivating an account is a security
        action with its own audit significance: "who was locked out, when, and by whom"
        should be answerable from the audit columns without diffing a general update.
      operationId: updateUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdateRequest'
      responses:
        '204':
          description: Status changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  # =========================================================================
  # master data
  # =========================================================================
  /helpers:
    get:
      tags: [master-data]
      summary: Every lookup table, in one payload
      description: |
        Every lookup table in a single response, keyed by table name rather than by a
        fixed set of fields. Adding a lookup therefore does not require a client
        release — each client reads the keys it knows about.

        A table that is legitimately empty is `[]`, never `null`.
      operationId: getHelpers
      responses:
        '200':
          description: The lookup tables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpersEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-types:
    get:
      tags: [master-data]
      summary: Unit types, each with the category it belongs to
      description: |
        **The only endpoint that carries the type -> category link.**

        `GET /unit-classes` returns each class with its `unit_type`, but that object is the shared
        lookup shape, which deliberately carries no parent — so a client holding a class can reach
        its **type** and stop there. `unit_types.id_unit_category` exists in the database and is
        invisible through `/helpers`, which excludes domain columns so that one column list and one
        scan can cover every lookup table.

        That made the taxonomy unreachable in one direction: **Kategori could not be resolved from
        Tipe or from Kelas by any endpoint.** This one closes the chain, so a breadcrumb
        Domain > Kategori > Tipe > Kelas > Aset can be rendered from API data instead of a mapping
        hardcoded in the client.

        Read-only. Unit types are seeded master data an operator picks from; no route authors them.

        ## Filtering by category

        `?id_unit_category=<id>` returns only the types in that category. Omit it for the whole
        taxonomy.

        A query parameter rather than a route of its own, for two reasons. These are the same rows
        under the same permission, so a second route would need another Casbin object and a new
        grant on every role in order to return a subset. And the response shape is unchanged either
        way — every entry still carries its `category` — so a client already reading this endpoint
        needs no new parsing to use it.

        **An id that names no category, and one that holds no types, both return `[]`.** The two
        are not distinguished, deliberately: the taxonomy screen draws a row for every category
        whether or not it holds anything, and it already has the category list, so an empty result
        renders correctly either way rather than being an error to reconcile.

        **`?id_unit_category=0` is NOT rejected: it returns the whole taxonomy.** The field is a
        plain integer, so zero is indistinguishable from the parameter being absent, and the
        `minimum: 1` below is therefore declarative rather than enforced for zero. A client sending
        zero sees every type, which reads in the UI as "this category contains everything". Send the
        parameter or leave it out; do not send zero.

        A NON-NUMERIC value is refused with **422**, not 400.
      operationId: listUnitTypes
      parameters:
        - name: id_unit_category
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: |
            Only the types belonging to this category. Resolve the id from `/helpers` under
            `unit_categories`. Omit for every type in the system.
      responses:
        '200':
          description: The unit types, ordered by name, each with the number of classes under it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitTypesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Create a unit type
      description: |
        Requires the `create` action on `/system/unit-types`.

        `id_unit_category` is required, and an unknown id is refused with `400` naming the field —
        before the foreign key would report it as an opaque constraint the client cannot act on.

        **The name is unique across the taxonomy**, refused with `409` naming `name`. The uniqueness
        belongs to the database, so it also holds against two writers racing.

        There are no fields for `is_system` or `is_judge_side`. The first records that a migration
        wrote a row, and a client able to set it could make its own row undeletable; the second is
        false on every lookup table except `game_roles`.
      operationId: createUnitType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitTypeCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitTypeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-types/{id}:
    patch:
      tags: [master-data]
      summary: Update a unit type
      description: |
        Requires the `update` action on `/system/unit-types`.

        Every field is optional; only the fields present are changed. `name` cannot be cleared.

        **`id_unit_category` is patchable, so a type can be MOVED between categories.** That is a
        real edit — the taxonomy is corrected, not only extended — and it is why the merge happens
        against the stored row rather than only against what the request named.

        **MOVING A TYPE MOVES EVERYTHING UNDER IT.** The category is reached THROUGH the type, so
        every class that belongs to this type — and therefore every hull of those classes — changes
        category with it. Existing hulls are NOT re-checked against the ownership rule, so a hull whose
        branch does not own the new category keeps existing and keeps working; only its next write is
        judged. That is deliberate: the rule governs writes, and the alternative is refusing a taxonomy
        correction because of hulls the operator never mentioned, with no way forward except editing
        those hulls one at a time.

        **`is_system` is not patchable.** It records how a row came to exist; a writable flag would let
        a seeded type be relabelled into an ordinary one and then deleted.
      operationId: updateUnitType
      parameters:
        - $ref: '#/components/parameters/UnitTypeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitTypeUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitTypeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Retire a unit type, and everything beneath it
      description: |
        Requires the `retire` action on `/system/unit-types`.

        Withdraws the type, every unit class under it, and every hull in those classes — in one
        transaction. See `RetirementBlocked` for the one case that refuses this, and `TaxonomyRetirement`
        for what comes back.

        **THIS REPLACES `DELETE /unit-types/{id}`, AND THAT IS A BEHAVIOUR CHANGE.** The delete was
        refused with `409` by the foreign key while any class belonged to the type, so an operator naming
        a type that was in use was told no and given no way forward. The retirement cascades instead,
        which is what the scope update asked for. A DELETE that withdrew a class's whole hull complement
        would also be the most surprising request in the API, which is why the verb changed with it.

        **`is_system` DOES NOT BLOCK THIS, and the client must not block it either.** All nineteen
        seeded types carry that flag, and it records who AUTHORED a row rather than whether the row may
        be withdrawn. A client that disables the affordance on `is_system` rows would make this endpoint
        unreachable for every type the fleet actually has. The DELETE this replaces told the frontend
        teams the opposite, and that instruction is now withdrawn.
      operationId: retireUnitType
      parameters:
        - $ref: '#/components/parameters/UnitTypeID'
      responses:
        '200':
          description: Retired, with everything that went with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyRetirementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetirementBlocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-categories:
    get:
      tags: [master-data]
      summary: Unit categories, each with the number of types it holds
      description: |
        The KATEGORI column of the taxonomy screen: every category, with how many types sit
        DIRECTLY beneath it.

        **THE COUNT IS OF THE LEVEL BELOW, NOT OF EVERYTHING BENEATH.** A category reports its
        types, a type its classes (`GET /unit-types`), and a class its hulls
        (`UnitClassSummary.hull_count`). That is what lets a drill-down add up: the numbers beside
        the rows of one column sum to the header count of the next.

        **Why this is not a flag on `/helpers`.** `unit_categories` IS served there — but through
        the shared lookup shape, which is deliberately one structure across every lookup table. A
        per-table `type_count` would make it eleven shapes and force every consumer to know which
        one it was holding. A count describes the TAXONOMY rather than the lookup row, so it
        belongs on a route that owns the taxonomy.

        **No paging.** Ten-odd rows are drawn in full, and a page of a picker is an incomplete
        picker.

        ## Filtering by service branch

        `?id_service_branch=<id>` returns only the categories that branch OWNS. Omit it for every
        category.

        **Ownership is declared, not derived.** Which categories a branch counts is a mapping the
        CMS authors, not a query over the hulls that happen to exist — so a branch shows its
        categories even while it holds no hulls of that kind. The taxonomy is a plan, and a plan an
        empty warehouse cannot express is not much of one.

        **A branch that owns nothing, and an id that names no branch, both return `[]`** — the same
        deliberately-unhelpful answer as `?id_unit_category` on `/unit-types`, for the same reason:
        the screen draws a row per category and an empty list renders correctly, whereas an error
        would have to be reconciled.

        **`?id_service_branch=0` is NOT rejected: it returns every category.** The field is a plain
        integer, so zero is indistinguishable from the parameter being absent, and the
        `minimum: 1` below is therefore declarative rather than enforced for zero. A client sending
        zero sees the whole taxonomy, which reads in the UI as "this branch owns everything". Send
        the parameter or leave it out; do not send zero.

        A NON-NUMERIC value is refused with **422**, not 400.

        ## Authoring

        Since migration 000024 the taxonomy is operator-authorable: `POST` here, plus `PATCH` on
        `/unit-categories/{id}`. This paragraph used to read "Read-only. Categories are seeded master
        data; no route authors them", which was true when it was written.

        **THERE IS NO DELETE ANY MORE — `POST /unit-categories/{id}/retirement` REPLACES IT.** Read that
        operation before offering the affordance anywhere. It cascades to every type, class and hull
        beneath the category, which makes it the widest single request in the API.

        **`is_system` IS NOT A RETIREMENT GUARD, and the client must not treat it as one.** Every
        category 000002 seeded carries the flag, and it records who AUTHORED a row rather than whether
        the row may be withdrawn. This paragraph used to instruct the opposite — "Disable the delete
        affordance on `is_system` rows" — and that instruction is WITHDRAWN: following it now would
        make the retirement unreachable for all ten categories the fleet actually has.

        **The foreign key stopped being a fallback at the same time.** It used to be what refused a
        category holding types, and every seeded category is covered by it. A retirement does not
        delete, so the constraint never fires — what limits the damage now is the client's own
        confirmation and the counts that come back in the response.

        **There IS a soft delete, as of migration 000029.** 000019's argument against a tombstone —
        that `is_system` already marks what a migration wrote, so a `deleted_at` beside it would be
        "a second, quieter way to hide a row" — is reversed there. The reason it no longer holds is that
        the VERB changed, not that the note was wrong: a hard delete cannot express a cascade, because
        every foreign key in this hierarchy is `NO ACTION` and a category with types under it could not
        be deleted at all. The tombstone is not a preference, it is the only mechanism in the schema
        that can carry one.
      operationId: listUnitCategories
      parameters:
        - name: id_service_branch
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: |
            Only the categories this service branch owns. Resolve the id from `/helpers` under
            `service_branches`. Omit for the whole taxonomy.
      responses:
        '200':
          description: Every category, each with the number of types directly under it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategoriesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Create a unit category
      description: |
        Requires the `create` action on `/system/unit-categories`.

        **The name is unique across the taxonomy**, and a duplicate is refused with `409` naming
        `name`. The uniqueness belongs to the database — a unique constraint on the column — rather
        than to a check here, so it also holds against two writers racing.

        The new row is never `is_system`, and there is no field for it: that flag records that a
        migration wrote a row, so a client able to set it could make its own row undeletable in the
        CMS, which is the only thing the flag decides.
      operationId: createUnitCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCategoryCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-categories/{id}:
    patch:
      tags: [master-data]
      summary: Update a unit category
      description: |
        Requires the `update` action on `/system/unit-categories`.

        Every field is optional; only the fields present are changed, so a PATCH naming one field
        cannot blank the others. `name` cannot be CLEARED — `min=1` refuses an empty value, and the
        column is NOT NULL for the same reason: a category with no name is a row the screen cannot
        draw.

        **`is_system` is not patchable, deliberately.** It records how a row came to exist, which does
        not change. That is now the WHOLE reason: it used to be justified by what a writable flag would
        let an operator do — relabel a seeded row and then delete it — and retirement does not care
        whether a row is system-owned, so the laundering argument has nothing left to protect. What
        remains is provenance, and a client that could rewrite it would be rewriting the record of
        where the fleet's vocabulary came from.

        This is the operation an operator uses to correct a seeded label such as
        `id_name: "Kapal Cepat Rudal"`. It is allowed, and it is the whole reason the server does not
        block writes to `is_system` rows — a seeded row is meant to be EDITABLE. This paragraph used to
        close by saying "only DELETE is worth withholding, and the client withholds it"; the delete is
        gone, its replacement cascades, and the client is expected to leave that affordance enabled.
      operationId: updateUnitCategory
      parameters:
        - $ref: '#/components/parameters/UnitCategoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCategoryUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Retire a unit category, and everything beneath it
      description: |
        Requires the `retire` action on `/system/unit-categories`.

        Withdraws the category, its types, their classes and every hull in them — in one transaction.
        See `RetirementBlocked` for the one case that refuses this, and `TaxonomyRetirement` for what
        comes back.

        **READ THE MAGNITUDE BEFORE CALLING THIS.** It is the widest operation in the API. On a register
        of 124 hulls it withdraws 25 for Amphibious, 22 for Patrol Craft and 21 for Fast Attack Craft;
        the counts come back in the response, but they arrive AFTER the act. The confirmation belongs
        in the client, which is why the response is counts rather than `204`.

        **THE BRANCH MAPPING GOES WITH IT, AND THAT HAS A CONSEQUENCE.** A branch's claim to a category
        that no longer exists is not worth keeping, so those mapping rows are removed. If the category
        was a branch's last one then that branch now operates nothing — and because a hull's branch must
        own its class's category, **every hull create and update for that branch starts failing**. Check
        `GET /unit-categories?id_service_branch=` first, and re-assign the branch afterwards.

        That mapping still cascades on a tombstone, which is a change from the hard delete this
        replaces: the branch rows are REMOVED rather than pointing at a retired category, so the
        ownership rule and the taxonomy cannot disagree about what a branch operates.

        **`is_system` DOES NOT BLOCK THIS** — see the note on the unit-type operation for why.
      operationId: retireUnitCategory
      parameters:
        - $ref: '#/components/parameters/UnitCategoryID'
      responses:
        '200':
          description: Retired, with everything that went with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyRetirementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetirementBlocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /game-roles:
    get:
      tags: [master-data]
      summary: The game-role vocabulary
      description: |
        Every role a participant can hold in an exercise — Commando, Game Master, Referee, and the
        rest of the judge side.

        **This is the same eight rows `/helpers` returns under `game_roles`.** The two routes share
        one query, which is why they cannot disagree about a column. They are not the same
        PERMISSION: `/helpers` asks "may this caller read every lookup table", and this asks "may
        this caller read the game-role vocabulary". A client that already reads `/helpers` needs
        nothing here for the list; this exists so that authoring has a surface that owns one table.

        **`is_judge_side` is the field that matters.** It decides whether a holder is EXCLUDED from
        the readiness gate at Preparation. Editing it changes whether an exercise can advance, so a
        role that is not judge-side must declare itself ready before the game may be executed.

        **No paging.** Eight-odd rows of master data are drawn in full, and a page of a picker is an
        incomplete picker.

        ## Renaming is safe; deleting a seeded row is not

        A rename is a normal edit and nothing needs to be re-synced: the policies that grant in-game
        authority are keyed on the role **id**, never its name, so renaming a role cannot revoke what
        it grants. See `casbin.GameRoleSubject`. (One name-keyed reader remains — staff visibility in
        `GameService` — and it is tracked as B13 in `docs/backlog.md`.)

        **A seeded row cannot be deleted, and the API enforces that with `409`.** This differs from
        the unit taxonomy, where `is_system` is a signal to the client only. The seeded game roles are
        named by the policies that grant in-game authority — deleting the one that grants the state
        transition would leave a policy pointing at a role that no longer exists, and no exercise
        could ever leave planning again.

        A role that any participant holds is refused separately by the foreign key, also with `409`.
      operationId: listGameRoles
      responses:
        '200':
          description: The whole vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRolesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Create a game role
      description: |
        Requires the `create` action on `/system/game-roles`.

        **The name is unique**, and a duplicate is refused with `409` naming `name`. The uniqueness
        belongs to the database — a unique constraint on the column — rather than to a check here, so
        it also holds against two writers racing.

        The new row is never `is_system`, and there is no field for it: the flag is now ENFORCED on
        delete, so a client able to set it could author a row it could never remove.

        **A new role grants nothing.** Authority comes from holding a role in a game, which the
        roster grants, and from the policy rows that decide what the role may do. A freshly created
        role has no policies at all, so its holders can do nothing in an exercise until those are
        authored — see `docs/backlog.md` B13.
      operationId: createGameRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRoleCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /game-roles/{id}:
    patch:
      tags: [master-data]
      summary: Rename a game role, or move it across the judge boundary
      description: |
        Requires the `update` action on `/system/game-roles`.

        Every field is optional. An absent field is left alone; an empty string clears it where the
        column allows it, and `name` is refused when empty because a role with no name is one the
        roster cannot draw.

        **`is_judge_side` is a nullable boolean on purpose.** For a bool, "not mentioned" and "set
        to false" are otherwise the same JSON value — so a role could be promoted across the judge
        boundary but never demoted, and the demotion is the direction that ADDS an obligation.

        **Renaming a seeded role is permitted and is safe.** The policies that grant in-game authority
        are keyed on the role id, so a rename cannot revoke them.

        `is_system` is not writable. It records how a row came to exist, which does not change, and a
        client able to clear it could launder a seeded role into a deletable one.
      operationId: updateGameRole
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
          description: The role id, from `/helpers` under `game_roles`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRoleUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [master-data]
      summary: Delete one of your own game roles
      description: |
        Requires the `delete` action on `/system/game-roles`.

        **Two refusals, both `409`, and both about the row rather than about the caller.**

        1. **A seeded role cannot be deleted.** Its `is_system` is true, and the API refuses — unlike
           the unit taxonomy, where that flag is only a hint. The seeded roles are named by the
           policies that grant in-game authority, so removing one would leave a policy pointing at a
           role that no longer exists. Rename it instead; a rename is safe.
        2. **A role any participant holds cannot be deleted.** `game_participants.id_game_role` is
           NO ACTION, so the database refuses rather than cascading — a cascade would silently remove
           people from a live exercise. Remove them from their games first.

        **There is no soft delete.** A delete is a delete and the row is gone.
      operationId: deleteGameRole
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
          description: The role id, from `/helpers` under `game_roles`.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /game-roles/{id}/permissions:
    get:
      tags: [master-data]
      summary: What a game role may do inside an exercise
      description: |
        The role's whole matrix: every `(object, action)` pair it holds.

        Requires the `read` action on `/system/game-roles` — the same one that reads the vocabulary,
        because the matrix is part of administering it and a separate object would be a second grant
        to keep in step with the first.

        **A role with no permissions is an ordinary state, not an error.** The role exists, the CMS
        draws an empty matrix, and its holders can do nothing in an exercise until rows are added. A
        role created through `POST /game-roles` starts exactly here.

        ## What a game role may hold

        `object` is a **game resource** and nothing else. The object is the only thing standing between
        a game role and the application surface, because a game role's policies carry the wildcard
        domain so that "a Referee may judge" is true in every exercise. Anything outside `/games/` is
        refused with `400`. The enum below is the complete set; a pair that is not in it is refused
        rather than silently stored.

        `action` is likewise narrower than the full action vocabulary. `create` and `delete` are
        absent on purpose: a participant is added to a game by UPDATING its roster, not by creating
        anything, so a `create` grant would be a checkbox that changes nothing.
      operationId: listGameRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
          description: The role id, from `/helpers` under `game_roles`.
      responses:
        '200':
          description: The role and its whole matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRolePermissionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [master-data]
      summary: Replace a game role's whole permission matrix
      description: |
        Requires the `update` action on `/system/game-roles`.

        **REPLACE, not merge** — the same shape `PUT /users/{id}/roles` uses, and the verb is the
        contract rather than a preference. An additive call would let a permission be granted through
        this endpoint but never withdrawn, so the matrix could only ever widen. The revocation is the
        security-relevant direction: a policy that outlives the row still passes every in-game check.

        **`permissions: []` is a valid request and revokes everything.** It says this role may do
        nothing, which is what an operator means when a role exists but should not yet be usable.
        OMITTING the field is refused with `400`: "I forgot" and "nothing" must not arrive as the
        same request, because reading the first as the second silently strips a role's authority.

        ## The change takes effect immediately, inside this process

        The matrix is written to `game_role_permissions` — the source of truth, with `created_by` and
        a tombstone per revoked row — and the authorization engine is then reconciled to it. A policy
        store that cannot be reached is **logged and not reported**: the database is the truth and
        reporting a failure would tell an operator their change did not happen when it did. The
        reconciliation runs again at startup and repairs any gap.

        ## Refusals

        | Condition | Status |
        |---|---|
        | `object` outside `/games/` | `400`, naming `permissions.<i>.object` |
        | `action` not in the vocabulary above | `400`, naming `permissions.<i>.action` |
        | the same pair listed twice | `400`, naming `permissions.<i>` |
        | `permissions` absent | `400`, naming `permissions` |
        | no such role | `404` |
      operationId: replaceGameRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
          description: The role id, from `/helpers` under `game_roles`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRolePermissionsUpdateRequest'
      responses:
        '200':
          description: The role and its new matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRolePermissionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-branches/{id}/unit-categories:
    put:
      tags: [master-data]
      summary: Replace the categories a service branch operates
      description: |
        Requires the `update` action on `/system/service-branches`.

        **The body is the COMPLETE set, not a delta**, and the response is the same payload
        `GET /unit-categories?id_service_branch=` returns — so a CMS that redraws the list after saving
        parses one shape, not two. Sending a set twice is a no-op, which makes a retry safe.

        **An empty array is meaningful and clears the set.** An ABSENT field is refused with `400`
        instead, because "this branch operates nothing" and "I forgot the field" must not arrive
        looking the same: silently clearing a branch's categories makes every subsequent hull write for
        it fail the ownership rule, with nothing in that error pointing back here.

        Unknown category ids are refused with `400` naming `id_unit_categories`, before anything is
        written. Repeated ids are collapsed rather than refused — the set they mean is unambiguous.

        The vocabulary is closed at three branches and there is no route to add one, so the branch id
        comes from `/helpers` under `service_branches`.
      operationId: setServiceBranchCategories
      parameters:
        - $ref: '#/components/parameters/ServiceBranchID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceBranchCategoriesRequest'
      responses:
        '200':
          description: The categories the branch owns now, each with its type count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategoriesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /units:
    get:
      tags: [master-data]
      summary: List hulls
      description: |
        Soft-deleted hulls are never returned.

        **On a fresh deployment this table is empty, and that is expected rather than a defect.**
        Hulls are created through this API with `POST /units`, which is built, or in bulk by the
        fleet-register importer, which is deferred. So `GET /units` returning `[]` means nobody has
        created anything yet.
      operationId: listUnits
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Matches against hull name and hull number, case-insensitively.
        - name: id_unit_class
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: id_unit_status
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: id_service_branch
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: id_movement_domain
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, hull_number, -hull_number, commissioned_year_from, -commissioned_year_from]
            default: name
      responses:
        '200':
          description: A page of hulls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Create a hull
      description: |
        Requires the `create` action on `/system/units`.

        `name` is unique among live hulls, case-insensitively, and `hull_number` is unique
        among live hulls when present. Both rules are **partial** — they apply only to rows
        with `deleted_at IS NULL`, so retiring a hull releases its name for a later
        generation. Two live hulls may not share a name; a live hull and a retired one may.

        This is what makes the source workbook's duplicate row fail loudly instead of
        loading a phantom ship: `KRI Lumba-Lumba` appears twice, both with hull `858`.

        ## The branch must own the class's category

        `id_service_branch` must name a service branch that owns the category `id_unit_class`
        belongs to. The chain is fixed by the schema — a class belongs to a type, the type to a
        category, and a branch owns categories through an operator-authored mapping — so the two
        fields in a create body are not independent.

        **Refused with `400` and `data.errors.id_service_branch`**, and the message names the CLASS
        rather than the category: the client chose the class and never sees a category, so a message
        about one would be unactionable.

        The mapping is DECLARED rather than derived from the fleet, so the rule holds for a branch
        that currently has no hulls. Today every seeded category belongs to `Navy`, which means a
        hull for `Army` or `Air Force` is refused until that branch is given a category of its own
        — see `GET /unit-categories?id_service_branch=`.

        The hull has **no specification** until one is published — see
        `POST /units/{id}/specifications`. An engine cannot move a hull with no known
        speed, and the API does not invent one.
      operationId: createUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The name or hull number is already used by a live hull. `data.errors` names the
            field, and includes the conflicting hull's id so the CMS can link to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /units/service-branches:
    get:
      tags: [master-data]
      summary: How many hulls each service branch holds
      description: |
        The CMS's top-level inventory tabs: one count per service branch.

        **THE COUNT IS OF LIVE HULLS**, which is what the drill-down eventually selects. The taxonomy
        counts one level down from each of its own rows — a category counts types, a type counts
        classes, a class counts hulls (`UnitClassSummary.hull_count`) — and this is the same idea
        applied to the axis across the top of the screen.

        **Every branch is returned, including one holding nothing**, so a tab with no hulls renders a
        zero rather than a missing number.

        **Every live hull is counted exactly once.** `units.id_service_branch` is `NOT NULL`, so the
        counts sum to the size of the inventory and there is no unassigned residue for a client to
        render as "other". A tab for anything beyond these branches has no data behind it.

        ## Why this sits under `/units`

        The numbers describe HULLS, so it is gated on the `read` action for `/system/units`: whoever
        may read the register may read how large it is. A `/service-branches` resource of its own
        would have needed a new policy object and a grant on every role, in order to serve rows that
        `/helpers` already hands out.

        A STATIC SEGMENT BESIDE `GET /units/{id}` IS DELIBERATE AND SAFE, and the routers package
        pins that routing property in a test — without it `service-branches` would be read as a hull
        id and the caller would get a 400 about a malformed path parameter instead of a count.
      operationId: listServiceBranchCounts
      responses:
        '200':
          description: Every service branch with the number of live hulls in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceBranchListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /units/{id}:
    # Declared at path-item level, not inside `get`, so that the patch and the retirement post
    # inherit it.
    parameters:
      - $ref: '#/components/parameters/UnitID'
    get:
      tags: [master-data]
      summary: Get a hull, with its current specification
      description: |
        Returns the hull together with its **current** specification version. A game
        references a specific `(unit, version)` pair rather than "the unit's spec", which
        is what allows a figure corrected in October to leave a game judged in September
        showing the numbers the judges actually saw.
      operationId: getUnit
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Return this specification version instead of the current one. Used by the
            review and closure screens to reproduce what was in force during a game.
      responses:
        '200':
          description: The hull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [master-data]
      summary: Update a hull
      description: |
        Requires the `update` action on `/system/units`.

        Every field is optional; only the fields present are changed.

        To **remove** a hull number, send an **empty string**, not `null`. An explicit
        `null` cannot be used to clear anything: OpenAPI 3.0 cannot distinguish a field
        absent from a field explicitly null, so a generated client renders both as a nil
        pointer with `omitempty` and sends neither. See the note on PATCH and nullable
        fields at the top of this document.

        `commissioned_year_from` and `commissioned_year_to` **cannot be cleared at all**
        in this version. They are nullable, but the empty-string convention is
        unavailable for an integer and `0` is below the permitted minimum, so a year
        entered wrongly can be corrected to another year but not back to unknown.
        Recorded rather than fixed because the fix changes the wire format and therefore
        both generated clients.

        Changing `id_unit_class` changes the hull's type, and therefore its category,
        because classification lives on the class. Existing specification versions are
        **not** re-validated against the new class: they record what was published at the
        time, and rewriting them to match a later taxonomy change is exactly what the
        append-only design exists to prevent.

        **Either field of the branch/class pair may be changed alone, and the ownership rule is
        re-checked against the MERGED pair.** Moving a hull to a class its branch does not operate,
        or to a branch that does not operate its class, is refused with `400` and
        `data.errors.id_service_branch` — the rule `POST /units` applies, evaluated after the merge
        rather than against whatever this request happened to name. A check of the request's own
        fields would let a single-field PATCH reach a combination the rule forbids.
      operationId: updateUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitUpdateRequest'
      responses:
        '200':
          description: Updated hull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Retire a hull
      description: |
        Requires the `retire` action on `/system/units`.

        The LEAF of the taxonomy hierarchy, so nothing descends from a hull and the cascade has nothing
        to reach: the response reports `units: 1` and the other three counts as zero. It is still a
        different operation from the other three only in depth, not in kind — one code path retires at
        all four levels.

        **A TOMBSTONE, AND THAT IS STILL THE POINT.** The row keeps its audit columns, its author and
        its specification versions, and stops appearing in `GET /units` and every list that embeds a
        hull. Because the uniqueness indexes are partial on `deleted_at IS NULL`, the name and hull
        number are released for reuse — the real sequence when a name is recommissioned in a later
        generation.

        Specification versions are deliberately retained. They are immutable history, and a game that
        referenced this hull's specification must remain reviewable.

        **A HULL ASSIGNED TO A RUNNING EXERCISE IS REFUSED** — see `RetirementBlocked`. Planning and
        closure are not.
      operationId: retireUnit
      responses:
        '200':
          description: Retired, with the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyRetirementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetirementBlocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /units/{id}/specifications:
    parameters:
      - $ref: '#/components/parameters/UnitID'
    get:
      tags: [master-data]
      summary: List a hull's specification versions
      description: |
        Newest first. Every version is retained permanently, so this is the full history of
        what was published and when — which is the evidence behind the claim that a judged
        game is reproducible.
      operationId: listUnitSpecifications
      responses:
        '200':
          description: Every version of this hull's specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSpecificationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Publish a new specification version
      description: |
        Requires the `create` action on `/system/units`.

        **This is not an update.** A new version is appended, the previous one is kept
        untouched with `is_current` set false, and games that referenced it continue to see
        the numbers the judges actually saw. That is the point of the whole design: a figure
        corrected in October must not rewrite a game judged in September.

        `version` is **not accepted from the client.** It is assigned by the server as
        current + 1. Two operators publishing concurrently would otherwise both choose the
        same number, and the difference between "the second is rejected" and "the second
        silently overwrites the first" is the difference between a conflict and lost data.
        The database's unique index on `(id_unit, version)` rejects the loser, which surfaces
        as 409.

        Any numeric field may be omitted or sent as `null`, and **null means unknown, not
        zero.** The source data carries no submerged speed for any of the four submarines;
        treating a missing value as zero would freeze the vessel, and as unbounded would let
        it outrun a frigate. A client must decline to compute movement from a value it does
        not have, and say so — the generated clients enforce this by making the field a
        pointer.

        If `turn_rate_max_deg_s` is omitted, the class's `default_turn_rate_max_deg_s` is
        used and `turn_rate_is_derived` is set true, marking it as an estimate the CMS can
        flag. Supplying a value sets it false, recording that a person asserted it.
      operationId: createUnitSpecification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitSpecificationCreateRequest'
      responses:
        '201':
          description: Published. The response carries the hull with the new current specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Another version was published for this hull concurrently. Re-read the hull and
            retry; do not retry blindly with the same payload, or one of the two versions is lost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-classes:
    get:
      tags: [master-data]
      summary: List classes
      description: |
        A class is where classification lives. Every hull of a class shares its type, and
        therefore its category, so classification is applied at the class level rather
        than restated on each hull.
      operationId: listUnitClasses
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: id_unit_type
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name]
            default: name
      responses:
        '200':
          description: A page of classes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClassListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Create a unit class
      description: |
        Requires the `create` action on `/system/unit-classes`.

        `name` is unique among live classes, case-insensitively. Retiring a class releases
        its name — the indexes are partial on `deleted_at IS NULL`.

        A class belongs to exactly one `unit_type`, so creating one is also the act of
        classifying it: every hull of the class inherits that type and its category. This is
        what stops a class claiming "frigate" while its type says otherwise.
      operationId: createUnitClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitClassCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClassEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /unit-classes/{id}:
    # Declared at path-item level, not inside `get`, so that the patch and the retirement post
    # inherit it.
    parameters:
      - $ref: '#/components/parameters/UnitClassID'
    get:
      tags: [master-data]
      summary: Get a class
      operationId: getUnitClass
      responses:
        '200':
          description: The class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClassEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [master-data]
      summary: Update a class
      description: |
        Requires the `update` action on `/system/unit-classes`.

        Changing `id_unit_type` reclassifies every live hull of the class, including the
        category that classification resolves to. That is intended — the class is the single
        place classification is stated — but it is a wide-reaching edit, so the response
        carries the new type for confirmation.
      operationId: updateUnitClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitClassUpdateRequest'
      responses:
        '200':
          description: Updated class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClassEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Retire a class, and every hull in it
      description: |
        Requires the `retire` action on `/system/unit-classes`.

        Withdraws the class and every live hull in it, in one transaction. See `RetirementBlocked` for
        the one case that refuses this, and `TaxonomyRetirement` for what comes back.

        **THIS ONE CHANGES BEHAVIOUR RATHER THAN ONLY RENAMING THE VERB.** `DELETE /unit-classes/{id}`
        used to REFUSE while live hulls remained, and reported the count inside the prose of the
        refusal — the class service's own comment said this was "rather than cascading", because
        silently retiring eighteen frigates did not read as a reasonable interpretation of the request.
        The scope update reverses that: a cascade under a retired parent is the intent, the client owns
        the confirmation, and the same count now comes back as a NUMBER so a client can act on it
        instead of parsing English. That also closes the inconsistency recorded as B2.

        **A HULL DEPLOYED IN A RUNNING EXERCISE REFUSES THIS** — see `RetirementBlocked`. Planning and
        closure are not refused.
      operationId: retireUnitClass
      responses:
        '200':
          description: Retired, with everything that went with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyRetirementEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RetirementBlocked'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # Unit class images — the asset bundle
  #
  # The CMS manages ONE picture per vessel class, and the Rust command centre pulls them
  # all in a single request rather than one per class.
  # ===========================================================================
  /assets/unit-class-images:
    get:
      tags: [master-data]
      summary: Download every class picture as one archive
      description: |
        Requires the `read` action on `/system/unit-classes`. The pictures ARE unit-class
        data, so they share its permission rather than having one of their own — a separate
        object would let the two drift into "you may edit a class but not its picture",
        which reads as a CMS bug rather than as a policy decision.

        **This is the one response in the document that is NOT the standard envelope.**
        It is a binary zip: a client either saves it or unzips it, and neither can do
        anything with a `data` wrapper around a zip.

        The archive holds `manifest.json` FIRST — so it can be read from a stream without
        buffering the whole archive or seeking to its end — followed by one entry per class
        that has a picture.

        ## Caching

        The `ETag` changes when, and only when, the CONTENT changes. Send it back as
        `If-None-Match` and the usual answer is `304 Not Modified`, costing no image bytes
        at all. Prefer `GET /assets/unit-class-images/manifest` for the check itself: it
        carries the same ETag and weighs a few kilobytes.

        Compare the tag, not the clock. HTTP `Date` has one-second resolution, so a
        refresh landing in the same second as the previous one would appear unchanged.
      operationId: getUnitClassImageBundle
      responses:
        '200':
          description: The archive.
          headers:
            ETag:
              description: |
                Changes only when the content changes. Deliberately excludes the
                manifest's `generated_at` — a timestamp that moved on every call would
                make every conditional request a miss, which is a cache that never hits.
              schema: {type: string}
            Content-Disposition:
              description: Offers the filename `unit-class-images.zip`.
              schema: {type: string}
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /assets/unit-class-images/manifest:
    get:
      tags: [master-data]
      summary: What the archive contains, without the pictures
      description: |
        Requires the `read` action on `/system/unit-classes`.

        The cheap half of the pair. Call this first, compare the `ETag` against the copy
        already held, and download the archive only when something changed — so the common
        case is a 304 and no image bytes cross the wire at all.

        Its `data` is the same value as the `manifest.json` embedded in the archive, built
        once and used by both. They therefore cannot disagree about what was shipped, which
        they could if each endpoint assembled its own.

        `classes_without_image` lists the live classes that still need a picture. It is
        present so that "this class has no picture" is something the client is TOLD, rather
        than something it infers from an absence it cannot distinguish from a failed
        download.
      operationId: getUnitClassImageManifest
      responses:
        '200':
          description: The manifest.
          headers:
            ETag:
              description: The same value carried in the body, so a client that cached the body can compare without reading headers.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetBundleManifestEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /assets/unit-class-images/{id}:
    # Reuses the UnitClassID parameter: the id in the path IS a unit class id, because a
    # picture is a field of a class rather than a resource with an identity of its own.
    parameters:
      - $ref: '#/components/parameters/UnitClassID'
    put:
      tags: [master-data]
      summary: Set a class picture
      description: |
        Requires the `update` action on `/system/unit-classes`. A picture is a FIELD of a
        class, so setting one and clearing one are the same capability — see DELETE below.

        Send `multipart/form-data` with the picture in a part named **`file`**.

        ## What is accepted

        PNG and JPEG, up to **5 MiB**. The limit is a blast-radius control rather than a
        storage one: every client downloads the whole archive, so one oversized picture is
        a cost paid by every desktop in the fleet.

        The declared `Content-Type` is **not trusted**. The format recorded is the one the
        server's decoder identified, because a decoder's answer is a fact and the request's
        is a claim. Bytes that are not a readable image are refused whatever the header
        said.

        Pixel dimensions are checked BEFORE the image is expanded, and it is refused if
        either side exceeds 10000 px or the total exceeds 40 megapixels. A few hundred
        kilobytes of PNG can declare sixty thousand pixels a side, and decoding that would
        exhaust the server's memory — so the bounds are applied to the header, not after a
        decode that has already happened.

        ## Replacing

        An upload replaces the previous picture. The new object is written BEFORE the old
        one is removed, so a failure at any point leaves the class on a working picture
        rather than on none.
      operationId: setUnitClassImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The picture. PNG or JPEG, at most 5 MiB.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitClassImageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [master-data]
      summary: Remove a class picture
      description: |
        Requires the `update` action on `/system/unit-classes` — NOT `delete`.

        Clearing a field is not the same act as retiring the class. Keying this on `delete`
        would mean an operator who may set a picture may not take it away, which is a
        distinction nobody intended. The `delete` action still governs retiring the class
        itself, which is a different act with a different consequence.

        A class that has no picture is a **404**, not a cheerful 204: the resource being
        addressed is the picture, and there is not one.
      operationId: deleteUnitClassImage
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # Games — slice 2
  # ===========================================================================
  /games:
    get:
      tags: [games]
      summary: List games
      description: |
        Requires the `read` action on `/system/games`.

        Does NOT require being a participant. An operator schedules and reviews games they are
        not running, and the CMS's game list is how they find one.

        Only the summary shape is returned, so nothing that is withheld from participants can
        leak through a list endpoint. That is deliberate: field hiding implemented on the detail
        route but not here is how a withheld field escapes.
      operationId: listGames
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Matches the game name and description, case-insensitively.
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameState'
          description: Filter by lifecycle state. A running game is `execution`.
        - name: mode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameMode'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, created_at, -created_at]
            default: -created_at
          description: A leading `-` sorts descending. Defaults to newest first.
      responses:
        '200':
          description: A page of games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Create a game
      description: |
        Requires the `create` action on `/system/games`.

        The game is created in `planning` and nothing else about it exists yet. The concept
        describes Planning as one act — "Create Game (Along with the Core Concepts)" — but the
        core concepts are separate resources here: participants, hierarchy, units and scenario
        roles are added to the game rather than posted in one payload. A client that had to send
        a whole exercise in one request could not save partial work, and would have to resolve
        every participant and hull id before it could create anything at all.

        The game is therefore assembled across several endpoints, all of them usable while the
        game is in `planning`.
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreateRequest'
      responses:
        '201':
          description: Created, in `planning`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}:
    # Declared at path-item level, not inside `get`, so patch and delete inherit it.
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: Get a game
      description: |
        **Reached by authentication alone — no application permission.** Two kinds of caller arrive
        here, and the service decides between them IN THIS ORDER:

        1. a **participant** — anyone holding a place in this game. They see it through the rules
           below, which means `area` and `map_tag` are withheld until the exercise starts.
        2. **staff** — a caller holding `read` on `/system/games`, who sees all of it. An operator
           reviewing a plan is not a participant, and withholding the area from them during
           Preparation would withhold it precisely when the Game Master is placing units against it.

        A caller who is neither is refused with **403** — not 404, because the game plainly exists
        and they may have seen it in a list a moment ago.

        The participant check runs FIRST, and the order is a security decision rather than a
        preference: an administrator who is also playing a Commando is treated as the participant
        they are, so the area stays withheld during Preparation and the game is refused at Closure.

        The response depends on WHO is asking and WHICH state the game is in. Two fields are
        withheld from participants rather than being absent from the schema:

        * `area` and `map_tag` are returned to the Game Master and Judges at every state, and to
          Commandos and unit personnel only from `execution` onward. The concept is explicit:
          personnel "does not know where the 'Game Area' is until it is Executed".

        They are OMITTED, not nulled, which is why both are optional in the schema. A participant
        during Preparation still needs the name and state to render "waiting for readiness", so
        refusing the whole resource would deny them information they are entitled to.

        In `closure` this endpoint is refused to participants entirely — 403. That is a different
        mechanism from withholding: the concept ejects personnel from Closure, so there is
        nothing in that state they may see.

        There is no mode-conditional exception here any more. The note that used to sit at this
        point concerned Operational, where withholding the area bought nothing because a Commando
        was physically inside it — and Operational is no longer a game mode at all. The rule now
        applies to every game there is, so it needs no exception.
      operationId: getGame
      responses:
        '200':
          description: The game, as this caller may see it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [games]
      summary: Update a game
      description: |
        Requires the `update` action on `/system/games`, and the game must still be in
        `planning`.

        Once a game leaves Planning its terms are fixed. The area a unit was placed against,
        the assumed start time a track was laid out on, and the mode that decided how positions
        would be produced are all things other records were built on — changing them afterwards
        would not correct the record, it would make the record describe a different exercise than
        the one that was run. A 409 says so rather than silently accepting the edit.

        Every field is optional; only those present are changed. Empty string clears an optional
        text field — see the note on PATCH and nullable fields at the top of this document.
      operationId: updateGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUpdateRequest'
      responses:
        '200':
          description: Updated game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The game is no longer in `planning`, so its terms are fixed and cannot be edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Discard a game
      description: |
        Requires the `delete` action on `/system/games`, and the game must still be in
        `planning`.

        A soft delete, and it exists for exactly one situation: a game created in error. Once a
        game has been prepared or run it is a record of an exercise, and the concept asks for
        game HISTORY — so it is retired, not erased. 409 while the game is past `planning`.

        Because Planning is where everything else is attached, a game can only be discarded while
        nothing depends on it. That is the same rule the unit taxonomy uses when it refuses to
        retire a class that still holds live hulls, for the same reason: a cascade here would be
        invisible in the audit trail.
      operationId: deleteGame
      responses:
        '204':
          description: Discarded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The game has left `planning` and is part of the exercise history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/transitions:
    # Declared at path-item level for consistency with /games/{id}.
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [games]
      summary: Move a game to another state
      description: |
        Authorised by being **this game's Game Master**, not by an application permission.

        The route itself carries no permission middleware, so any authenticated caller can REACH it
        and only the game's own Game Master is obeyed. That is a widening of who may ask and a
        narrowing of who is answered: before participants existed, an administrator was the only
        caller who could get here, and any administrator could run any game.

        That distinction is the whole reason this is not a `PATCH` on the game. Creating a game is
        an application capability — an operator holds `create` on `/system/games` — while running
        one is in-game authority, which comes from a participant assignment and is scoped to a
        single game. A Casbin object cannot express "the Game Master of THIS game", so the check
        is an instance comparison in the service, and a failure is **403, not 404**.

        Forward-only, one step at a time:

        | From | To | Precondition |
        |------|----|--------------|
        | `planning` | `preparation` | none — the Game Master decides planning is done |
        | `preparation` | `execution` | at least one unit assigned, at least one participant on the exercise side, and every one of them ready |
        | `execution` | `closure` | none — the Game Master ends the exercise |

        Judges are excluded from the readiness precondition, which is also what makes B5's
        "more lenient readiness gate" for Static a statement about a baseline rather than a new
        mechanism.

        **The gate has three parts, and the last two are the ones that are easy to leave out.** An
        exercise that is READY but has no hulls assigned has nothing to manoeuvre, nothing to give an
        order to, and no unit for a Commando to lead. And a roster of nothing but Judges satisfies
        "everyone is ready" vacuously. The refusal names every missing ingredient at once, under
        `data.errors`, rather than the first one found — a freshly created game is missing two of
        them, and reporting one per attempt would make the Game Master press Advance twice to learn
        two things.

        Note also that a **role change clears readiness**, so a game can be refused by a declaration
        the caller did not withdraw.

        A skipped step, a step backwards, or a step out of a game already in `closure`, is
        **409**. Reporting it as a 400 would suggest the request was malformed; it was well-formed
        and refused.
      operationId: transitionGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTransitionRequest'
      responses:
        '200':
          description: The game in its new state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The transition is not permitted from the game's current state. When the reason is
            unmet readiness, `data.errors` names how many participants are still outstanding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # =========================================================================
  # live feed
  # =========================================================================
  /live-feed/fixes:
    post:
      tags: [live-feed]
      summary: Report a batch of positions
      description: |
        Accepts up to 60 fixes from one vessel's beacon. This is the endpoint the mobile app calls.

        **Authorised by being this vessel's current commander — not by a permission.** A Casbin
        object names a resource family and carries no instance id, so "may this user report for
        THIS ship" is not expressible as a policy. The check is an instance comparison in the
        service, and the same reasoning applies to `GET /live-feed/me`.

        A refusal is **403, not 404**: the vessel exists and the caller may have listed it a moment
        earlier, so reporting a blocked report as "not found" would hide it from the audit trail.
        Only a vessel that genuinely does not exist is a 404.

        ## What the server does with `recorded_at`

        The client sends when it *believes* it observed each fix; the server decides whether that
        is a live report or a backlog.

        | Gap from the server's clock | Treatment |
        |---|---|
        | within ±60 s | **live** — `recorded_at` is re-stamped with the server's time |
        | older than 60 s, within 30 days | **backfill** — the device's `recorded_at` is kept |
        | older than 30 days | **refused**, counted in `rejected` |

        Re-stamping a live fix is not tidiness. A `recorded_at` in the future would become the
        vessel's latest position, and the guard that discards out-of-order fixes would then discard
        every honest fix until real time caught up — a ship reporting steadily that never moves on
        the map. A device clock more than a minute ahead is therefore treated as live, re-stamped,
        and logged as a warning.

        Keeping a backfill's own timestamp is the mirror of the same argument: a backlog's whole
        value is *where the vessel was when it could not report*, and re-stamping it to now would
        draw a straight line the ship never sailed.

        ## Rejections

        Age is the only per-fix refusal, and it is permanent — an out-of-retention fix cannot be
        made valid by sending it again. The response therefore carries **counts**, not a list of
        complaints with nothing to act on. A batch in which every fix was refused is still a
        **200**: the request was understood and each fix was examined, and the counts are the
        answer.

        ## Ordering

        Fixes may arrive in any order, and the vessel's latest position is taken from the **newest
        fix in the batch by `recorded_at`** — not the last one sent. A backlog flushed after a
        reconnect interleaves old points among new ones, so the last one sent is frequently not the
        newest one observed.
      operationId: ingestFixes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedIngestRequest'
      responses:
        '200':
          description: |
            How the batch was handled. Every response to a well-formed batch is 200, including one
            in which nothing was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedIngestEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not this vessel's current commander, or the vessel has no commander. The
            service logs which of the two, because the remedies differ: a vessel with nobody
            assigned is a handset that has not been set up yet, while a vessel with another
            commander is a device reporting for the wrong ship.

            Both are 403 rather than 404 — see the operation description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /live-feed/me:
    get:
      tags: [live-feed]
      summary: Which vessels the caller commands
      description: |
        Lets a freshly installed app discover which vessel it is aboard.

        Without this the unit id would have to be told to the device out of band — read off a
        whiteboard and typed in — which is a step that is wrong exactly once and then silently
        wrong forever.

        Returns a **list**, because a user may command more than one vessel even though the concept
        says they command one. An uncommanded caller receives `{"units": []}` with a **200**, not a
        403: they are permitted to ask, and the answer is that there is nothing. A 403 would report
        "you may not read this", which is false, and would force the app to render two different
        messages for the one situation an operator has to act on — that this handset has not been
        told which ship it is aboard.
      operationId: getFeedIdentity
      responses:
        '200':
          description: The vessels the caller currently commands, newest assignment first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedIdentityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /live-feed/positions:
    get:
      tags: [live-feed]
      summary: The standing position picture
      description: |
        Every live vessel and its last known position. This is what the desktop command centre
        renders.

        **Vessels that have never reported are included, with no `position` key.** A map that omits
        a silent ship is showing one on which silence and non-existence look identical — and telling
        those apart is the whole reason a fix carries an `age_seconds`. A client decides what counts
        as stale; it must not be forced to guess whether a ship is absent or merely quiet.

        **Not paginated, deliberately.** A page of a standing picture is an incomplete picture, and
        an incomplete map is a wrong one. The set is bounded by the navy's vessel count, and every
        caller who may read it may read all of it.

        `age_seconds` is measured against one reading of the server's clock for the whole response,
        so ages within a single reply are comparable with each other.
      operationId: listFeedPositions
      responses:
        '200':
          description: Every live vessel, ordered by id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPositionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /live-feed/positions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The unit's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [live-feed]
      summary: One vessel's last known position
      description: |
        A **404** means the vessel does not exist; a **200 with no `position`** means it exists and
        has never reported. An operator investigating a track that stopped needs to tell those
        apart, so the two are kept distinct rather than both reported as missing.
      operationId: getFeedPosition
      responses:
        '200':
          description: The vessel, with its latest position when it has one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPositionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /units/{id}/commander:
    parameters:
      - name: id
        in: path
        required: true
        description: The unit's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [live-feed]
      summary: A vessel's command history
      description: |
        Newest first. The **current** commander is simply the entry with no `to_at`, so there is no
        separate "who commands this now" route — a second way to ask the same question would be
        free to disagree about ordering.

        A vessel that nobody has ever commanded returns an empty list, not a 404.
      operationId: getUnitCommanderHistory
      responses:
        '200':
          description: Every assignment, open and closed, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCommanderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [live-feed]
      summary: Hand a vessel to a user
      description: |
        Closes the vessel's current assignment and opens a new one **in a single transaction**.

        The two writes cannot be separated. Between them the vessel has no commander, and if the
        second failed it would be left uncommanded with nobody told — which is why there is one
        operation here rather than separate "clear" and "set" calls whose order a caller could get
        wrong.

        Gated on `/system/units` **update**, not on `/system/live-feed`. A commander is a field of a
        vessel, in the same way a class picture is a field of a unit class and is gated on
        `/system/unit-classes`. The feed object itself is read-only.

        An unknown `id_user` is a **400 naming the field**, not a 404: the resource in the path
        exists, and it is the body that names a user who does not.
      operationId: assignUnitCommander
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCommanderAssignRequest'
      responses:
        '200':
          description: The assignment now in force, with the server's `from_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCommanderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The vessel already has a commander and the hand-over could not be applied. Should not
            occur — `PUT` closes the current assignment in the same transaction — so a 409 here
            means something else opened one concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [live-feed]
      summary: Relieve a vessel's commander
      description: |
        Leaves the vessel uncommanded. That is a normal state — a vessel between watches, or one
        whose handset is being replaced — and it is what makes the feed honest: a vessel with nobody
        aboard reports nothing, which shows up as silence rather than as a stale position nobody is
        refreshing.

        Relieving a vessel that has **no** commander is **not** an error. The caller's intent is
        that the vessel should have no commander, and it already does, so the request is satisfied
        either way. Reporting a failure would be reporting that the world already matches.

        Gated on `/system/units` **update**, not the `delete` action: this clears a field of a unit
        rather than retiring the unit, and keying it on `delete` would let an operator who can
        assign a commander not remove one.
      operationId: relieveUnitCommander
      responses:
        '204':
          description: The vessel now has no commander. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/units:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: List a game's units
      description: |
        Requires `read` on `/system/games`, **or** a game role holding `read` on `/games/units` in
        this game — see the **games** tag for how in-game authorisation works. The order of battle: which hulls are in this exercise and
        who commands each one.

        **Staff-facing, like the roster, and for the same reason.** A Commando learns which hull THEY
        command from `POST /games/join`, not from here — a participant route returning the whole force
        would leak through the back door exactly what this route's permission refuses at the front.
        Knowing the other side's order of battle before the exercise starts is most of the exercise.

        Readable at every state, including after the force has closed: reading is not an edit.
      operationId: listGameUnits
      responses:
        '200':
          description: The game's pieces, ordered by commander then hull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Put a unit into a game
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/units` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        **`id_commander` IS REQUIRED**, and that is the rule rather than a convenience. Concept
        `[1.7]` defines a game piece as "the 'Game Piece' that will be commanded by the Commando
        assigned to it", so a hull with nobody to steer it is not a piece at all — there is no state
        in which a unit is in an exercise and nobody commands it. It is also why "a game needs at
        least 1 unit and 1 commando" is **one condition in the start gate, not two**.

        **The commander must be a participant of THIS game**, which the database enforces through a
        composite foreign key rather than trusting this endpoint to remember. 400 naming
        `id_commander` otherwise.

        **The judge side does not command units.** A Referee "Assesses performance and gives points"
        — they run the exercise, they do not take part in it. Refused rather than allowed quietly,
        because a piece commanded by a judge is a player wearing a referee's shirt.

        **A hull may be in several games at once.** A ship is a real vessel with one hull number; an
        exercise is a plan. Uniqueness is per game, so the same hull cannot be listed twice in one
        exercise and may appear in as many exercises as the scenario needs.

        **409 when that hull is already in this game.**
      operationId: assignGameUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUnitAssignRequest'
      responses:
        '201':
          description: The game's pieces after the assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The hull is already in this game. `data.errors` names `id_unit`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/units/{unit_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: unit_id
        in: path
        required: true
        description: The hull's id — the unit's own id, not a game_units row id.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [games]
      summary: Change who commands a unit
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/units` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        `id_commander` is required for the same reason it is on assignment: a piece always has one, so
        "change the commander" is the only edit that exists. Handing a hull over is clearing one
        commander and setting another in one request rather than in two, which matters because there
        is no state in between to be in.

        The new commander must be a participant of this game and not on the judge side — 400 naming
        `id_commander` otherwise.
      operationId: setGameUnitCommander
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUnitUpdateRequest'
      responses:
        '200':
          description: The game's pieces after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The force has closed; the game is in `execution` or `closure`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Take a unit out of a game
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/units` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        A HARD delete, like a participant's removal and for the same reason: the row is what the start
        gate COUNTS, so a hull that has been taken out has to stop counting.

        Removing a hull that is not in the game is **not** an error — the caller's intent is that it
        should not be there, and it is not.
      operationId: releaseGameUnit
      responses:
        '200':
          description: The game's pieces after the removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The force has closed; the game is in `execution` or `closure`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # Below this line: everything a PARTICIPANT can reach without holding any application permission,
  # and the roster routes that staff use to fill the cast in. The two are deliberately adjacent,
  # because the difference between them is the whole authorisation story of a game.
  /games/join:
    post:
      tags: [games]
      summary: Enter a game room with its key
      description: |
        The room key is the ONLY input: the client does not know the game id yet, which is exactly
        what this call is for. It answers with the game AND the caller's own participant row, so a
        freshly installed app learns in one request what it has entered, what it may do there, and
        whether it has already declared readiness.

        **Authentication only.** What authorises the call is holding a place in the game the key
        belongs to — an instance fact, which a Casbin object cannot express because objects name
        resource families and carry no instance id.

        **A wrong key is 404** — the same 404 a discarded game produces, so the endpoint cannot be
        used to tell a key that never existed from one whose exercise was cancelled.

        **A valid key held by a non-participant is 403.** Not 404: they hold a real key, so the room
        plainly exists, and telling them otherwise would send them hunting for a typo in a key that
        is correct. The remedy is to ask the Game Master for a place, and only a 403 says that. It
        leaks nothing — a guessed key is never the valid one, so somebody guessing only ever sees
        the 404.

        **Refused at `closure`** for a participant the rules eject from it, on the same terms as
        `GET /games/{id}`. Both refusals exist because one is not enough: a participant who cannot
        READ a game must not be able to enter it through the other door either.

        The key is stored unhashed, unlike every other secret in this API, because it is
        TRANSCRIBED — read aloud or copied off a board and typed into a handset — and a hash cannot
        be read out. Migration 000017 records that as a decision rather than an oversight.
      operationId: joinGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameJoinRequest'
      responses:
        '200':
          description: The game, and the caller's place in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameJoinEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The key is valid and the caller holds no place in that game, or the caller has been
            ejected from it at closure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/readiness:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [games]
      summary: Declare yourself ready
      description: |
        Concept [2.1]: each Personnel excluding the Judges "are required to 'State' that they are
        ready to perform (Via 'Ready Button' or something)".

        **SELF-SERVICE, and there is no `id_user` in the request.** The button is pressed by a
        participant about themselves, so the only question is whether they hold a place in this game
        — an instance check, not a permission. A body field that must always equal the token's
        subject is a field that should not exist.

        **409 in two cases**, each with its own reason under `data.errors`:

        * the caller's role is on the **judge side**, which the gate exempts. Refused rather than
          accepted-and-ignored: a Referee who pressed Ready, got a 200, and then watched the game
          refuse to advance would reasonably believe the blockage was theirs.
        * the game is **not in `preparation`**. Readiness declared while the roster can still change
          under it is premature, and after the gate has been passed it means nothing.

        A role change CLEARS readiness — see `PATCH /games/{id}/participants/{user_id}` — so a
        client that re-reads its participant row will see `is_ready: false` without having asked.

        **403** when the caller holds no place in the game.
      operationId: declareReadiness
      responses:
        '200':
          description: The game, and the caller's place in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameJoinEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The caller's role is exempt from the readiness gate, or the game is not in
            `preparation`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Withdraw your readiness
      description: |
        The same operation as `PUT`, in the other direction: a participant who is not ready yet may
        say so, and one who has already declared may take it back.

        Both columns move together, which the schema enforces — `is_ready` and `ready_at` are one
        fact and a row where they disagree is a contradiction rather than a partial record.

        The same 409s and the same 403 apply as for `PUT`.
      operationId: withdrawReadiness
      responses:
        '200':
          description: The game, and the caller's place in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameJoinEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The caller's role is exempt from the readiness gate, or the game is not in
            `preparation`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/participants:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: List a game's roster
      description: |
        Requires `read` on `/system/games`, **or** a game role holding `read` on
        `/games/participants` in this game — see the **games** tag. No game role holds it today, so
        this is staff-only in practice until the matrix grants it.

        A Commando has no route to this, deliberately: the roster names the Judges, and the concept
        gives personnel no reason to know who is assessing them.

        **Readable at every state**, including after the roster has closed. Reading is not an edit,
        and `closure` is where the concept puts the analysis — a Game Master reviewing who took part
        needs the roster then more than at any other time.

        The roster-OPEN rule is on the writes below, and it spans `planning` **and** `preparation`.
        That is wider than the window for the game's own terms, because what Preparation is for is
        people arriving in a room and one of them not turning up: a roster nobody can correct while
        the cast assembles would make the readiness gate refuse a game for the absence of somebody
        who is not coming. It closes at `execution`, where the cast is fixed and the record of who
        was in it is what closure reads.
      operationId: listGameParticipants
      responses:
        '200':
          description: The roster, exercise side first, then the judge side, each by role then user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameParticipantListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Add somebody to a game
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/participants` in this game — see the **games** tag. The game must be in `planning`
        or `preparation`.

        Every roster write uses `update` rather than `create` or `delete`: adding or removing one
        participant edits the GAME's roster, which is a single capability. Keying removal on `delete`
        would let an operator who can add a participant not remove one — the same call the class
        pictures make, and the reason is the same.

        **ONE ROLE PER PERSON PER GAME**, enforced by the schema. It sounds restrictive and the
        alternative is worse: `is_judge_side` decides whether a holder is asked to press Ready, so
        somebody holding both a Commando and a Referee role would be on both sides of that rule at
        once and the gate would have no answer for them. The concept never assigns one person two
        roles in one exercise. Holding different roles in different games is unaffected.

        **409 when the user is already in the game**, or when the role id does not resolve. Written
        as a 409 rather than a 400 because the request is well formed and the world is what refuses
        it.
      operationId: addGameParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameParticipantAddRequest'
      responses:
        '201':
          description: The roster after the addition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameParticipantListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The user already holds a place in this game, or the role does not exist. The offending
            field is named under `data.errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/participants/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: user_id
        in: path
        required: true
        description: The participant's user id.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [games]
      summary: Change a participant's role
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/participants` in this game — see the **games** tag. The game must be in `planning`
        or `preparation`.

        **CHANGING THE ROLE CLEARS READINESS**, and the clearing is the point rather than a side
        effect. Readiness is a declaration ABOUT the role held: a Commando saying "I am ready to
        command" is not the statement a Referee makes, and `is_judge_side` decides whether the gate
        asks them at all. Keeping the flag across a role change would let somebody declare readiness
        under one rule and have it counted under another — the cheapest possible way to start an
        exercise whose only participant on the exercise side never confirmed anything.

        The response carries the whole roster, so the cleared `is_ready` is visible without a second
        request.
      operationId: setGameParticipantRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameParticipantRoleRequest'
      responses:
        '200':
          description: The roster after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameParticipantListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The roster is closed, or the role does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Remove somebody from a game
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/participants` in this game — see the **games** tag. The game must be in `planning`
        or `preparation`.

        **A hard delete**, unlike every other entity in this API. The row is what the readiness gate
        COUNTS, so a departed participant has to stop counting — a soft-deleted row would have to be
        excluded from that count by a filter somebody would forget, and the failure is a game that
        can never start because somebody who left is still not ready.

        Removing somebody who is not in the game is **not** an error. The caller's intent is that
        this user should not be in the game, and they are not, so the request is already satisfied;
        reporting a failure would be reporting that the world matches what was asked for.
      operationId: removeGameParticipant
      responses:
        '200':
          description: The roster after the removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameParticipantListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The roster has closed; the game is in `execution` or `closure`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /hierarchy:
    get:
      tags: [master-data]
      summary: List the unit hierarchy levels
      description: |
        Requires `read` on `/system/hierarchy`. The ECHELON VOCABULARY — the ordered levels a task
        organisation is built from, seeded as Unsur, Satuan Tugas, Gugus and Operasi Gabungan.

        **GLOBAL MASTER DATA, NOT PER GAME.** One vocabulary is shared by every exercise, so two
        games cannot disagree about what a Gugus is. What a game owns is its own TREE, at
        `/games/{id}/hierarchy` — not the words the tree is built from.

        **READ THIS RATHER THAN `/helpers` WHEN THE ORDER MATTERS.** `/helpers` serves the shared
        lookup shape, which has no room for `echelon_rank`. A client inferring the order from the
        alphabet would get Unsur, Gugus, Operasi Gabungan — which is not the hierarchy.

        **RANKS MAY HAVE GAPS.** Removing a level leaves its position empty instead of renumbering
        the levels above it, because closing the gap would change rows nobody asked to change. Treat
        `echelon_rank` as an ORDER, never as an index into this array.
      operationId: listUnitHierarchies
      responses:
        '200':
          description: Every level, lowest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitHierarchyListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [master-data]
      summary: Add a level to the unit hierarchy
      description: |
        Requires `create` on `/system/hierarchy`.

        **THE INTERESTING CASE IS INSERTING IN THE MIDDLE.** A future Koarmada belongs between Gugus
        and Operasi Gabungan, and a level below Unsur is the same problem at the other end, so the
        request says WHERE the new level goes rather than what number it gets. The server renumbers.

        `insert_after_id` names the level the new one ranks **directly above**, so one field covers
        all three positions:

        | `insert_after_id` | result |
        |---|---|
        | omitted | the new level becomes the LOWEST, below everything |
        | any id | the new level sits immediately above that level |
        | the highest level's id | the new level becomes the HIGHEST, above everything |

        "After" reads against this list as a client displays it — lowest first — so the new level
        appears immediately after the named one. Sending a raw `echelon_rank` instead would put the
        dense numbering and the renumbering it needs in the caller's hands.

        **400 if `insert_after_id` names a level that does not exist.** There is deliberately no
        fallback to the top or the bottom: a client holding a stale list would otherwise renumber
        every level in the system while the operator watched for a reason they could not see.

        **409 if the name is already in use.** Names are unique across the vocabulary.

        **THE NEW LEVEL IS NEVER A SYSTEM ROW**, so the CMS may offer to remove it. The four seeded
        levels carry `is_system`, which stops the default hierarchy being deleted and leaving a
        system whose vocabulary is a blank page.
      operationId: createUnitHierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitHierarchyCreateRequest'
      responses:
        '201':
          description: The whole vocabulary after the insert, because the levels above moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitHierarchyListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A level already uses that name. `data.errors` names `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /hierarchy/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The hierarchy level's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [master-data]
      summary: Rename a unit hierarchy level
      description: |
        Requires `update` on `/system/hierarchy`. Every field is optional; an absent one is left
        alone, and an explicit empty string clears it.

        **THE POSITION CANNOT BE CHANGED HERE.** Renaming a level cannot invalidate an existing task
        organisation; MOVING one can, by leaving a node whose parent now ranks below it. Growing the
        vocabulary is supported through the insert position; reordering it is not exposed, because
        the server would have to re-check every game's tree first.
      operationId: updateUnitHierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitHierarchyUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UnitHierarchyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UnitHierarchyNameTaken'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [master-data]
      summary: Remove a unit hierarchy level
      description: |
        Requires `delete` on `/system/hierarchy`.

        **REFUSED WHILE ANY GAME'S TASK ORGANISATION USES THIS LEVEL** — 409, from the foreign key
        rather than a check the endpoint remembers to make. A level in use is not a typo, and
        cascading would silently reshape every exercise built on it: the trees would keep their nodes
        and the nodes would stop meaning what they said.

        **THE REMAINING RANKS ARE LEFT AS THEY ARE**, so a gap appears where the level was — after
        removing rank 4 the vocabulary reads 1, 2, 3, 5. Closing the gap would renumber levels nobody
        asked to change and would buy nothing, since rank is a position in an order and not an index.

        `is_system` marks the levels the migration seeded. The CMS should not offer to delete those.
      operationId: deleteUnitHierarchy
      responses:
        '200':
          $ref: '#/components/responses/UnitHierarchyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            At least one game's task organisation still uses this level. `data.errors` names
            `_request`, since the id is in the path rather than the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/hierarchy:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: Read a game's task organisation
      description: |
        Requires `read` on `/system/games`, **or** a game role holding `read` on `/games/hierarchy`
        in this game — see the **games** tag. The TREE of nodes this exercise's force is organised
        into, nested.

        **A NESTED TREE, NOT A FLAT LIST.** The command centre draws one icon per node and collapses
        a node's descendants into it as the operator zooms out, so what it needs is the shape.
        Handing it a flat list would make every client rebuild the same structure and disagree about
        the ordering while doing it.

        **A GAME MAY HAVE SEVERAL ROOTS.** Concept `[3.2]` says "even in other Hierarchy" — the
        friendly task groups and the opposing force are separate trees in the same exercise — so the
        response is a FOREST and a client must not assume `data[0]` is the whole exercise.

        `echelon_name` and `echelon_rank` come from the shared vocabulary at
        `/hierarchy`. `icon` is a symbol name from a tactical palette rather than an uploaded image,
        because the clients have to agree on what a symbol MEANS, not on what it looks like.

        **`children` is always an array**, empty for a leaf, so no client needs a nil check.

        Readable at every state, including after the force has closed: reading is not an edit.
      operationId: getGameHierarchy
      responses:
        '200':
          description: The game's task organisation, highest level first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Add a node to a game's task organisation
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation` —
        the tree IS the plan, and the plan is fixed when execution begins.

        **A PARENT MUST SIT AT A HIGHER LEVEL THAN ITS CHILD**, and that rule is enforced here rather
        than by the database: a CHECK cannot compare two rows of another table. 400 naming
        `id_unit_hierarchy` when it does not hold.

        **A parent must be in the SAME GAME**, which the database does enforce through a composite
        foreign key. 400 naming `parent_id` if the node does not exist.

        `parent_id` is absent for a ROOT, and that is a complete statement rather than an incomplete
        one — a game may hold several trees, so a node with no parent is a normal way to start one.
      operationId: createGameHierarchyNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameHierarchyNodeCreateRequest'
      responses:
        '201':
          description: The whole tree after the insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/hierarchy/{node_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: node_id
        in: path
        required: true
        description: The node's id, scoped to this game.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [games]
      summary: Rename a node, or change its icon
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        Every field is optional, and an explicit empty string CLEARS it — `{"icon": ""}` removes the
        symbol and omitting the key leaves it as it was.

        **THERE IS NO PARENT HERE.** Re-parenting is structural while this is cosmetic, and it
        carries validations this request has no room for — the rank rule and the cycle check. It has
        its own route so neither act can be performed by accident while doing the other.
      operationId: updateGameHierarchyNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameHierarchyNodeUpdateRequest'
      responses:
        '200':
          description: The whole tree after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Remove a node from a game's task organisation
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        **REFUSED WHILE THE NODE STILL HAS CHILDREN** — 409, from the self-referencing foreign key
        rather than a check this endpoint remembers to make. Cascading would delete a whole task
        group because somebody removed its top level; re-level the children first.

        **HULLS PLACED AT THE NODE STAY IN THE GAME.** They come out of the tree and remain in the
        exercise, which is what makes a re-organisation recoverable: re-organising the force should
        not withdraw it. A piece's `id_hierarchy_node` simply stops being present.
      operationId: deleteGameHierarchyNode
      responses:
        '200':
          description: The whole tree after the removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The node still has children, or the game's roster has closed. `data.errors` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/hierarchy/{node_id}/parent:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: node_id
        in: path
        required: true
        description: The node being moved, or detached.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [games]
      summary: Re-parent a node
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        A route of its own rather than a field on the rename, because a nil `parent_id` would be
        ambiguous: "make this a root" and "do not touch the parent" would be the same request. That
        is what `DELETE` on this path is for.

        **400 IN THREE DIFFERENT WAYS**, and the message says which:

        - the new parent is at or below the node's own level — the tree would be upside down
        - the new parent is inside the node's OWN SUBTREE — the tree would contain a ring, which no
          read could finish. The database refuses only the single-node case (`parent_id <> id`),
          because a deeper cycle needs a trigger or a materialised path, so this check is the only
          thing standing between the schema and an unreadable tree
        - the named parent is not in this game
      operationId: moveGameHierarchyNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameHierarchyNodeMoveRequest'
      responses:
        '200':
          description: The whole tree after the move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Lift a node to the top level
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        The node becomes a root and keeps its subtree. A game may hold several trees, so this is a
        normal thing to do rather than a way of clearing a mistake — the friendly task groups and the
        opposing force are separate trees in one exercise.
      operationId: detachGameHierarchyNode
      responses:
        '200':
          description: The whole tree after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHierarchyTreeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/units/{unit_id}/hierarchy:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: unit_id
        in: path
        required: true
        description: The hull's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [games]
      summary: Place a unit in the task organisation
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.
        Concept `[1.13]` Hierarchy Assignment.

        **PLACEMENT IS NOT ASSIGNMENT.** Putting a hull in the exercise (`POST /games/{id}/units`)
        is a statement about the exercise; saying where it sits is a statement about the plan. A hull
        may be in a game and unplaced, which is why `id_hierarchy_node` is absent rather than zero on
        an unplaced piece — and why neither act implies the other.

        The node must be in **this** game, which the database enforces through a composite foreign
        key as well as the check here. 400 naming `id_hierarchy_node` otherwise.

        On the UNIT's path rather than the node's, because the column is on the piece: `[1.13]` says
        the assignment relates to the value assigned in `(10)`, so the hull carries its place.
      operationId: placeGameUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUnitPlaceRequest'
      responses:
        '200':
          description: The game's pieces, with the placement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such piece in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Take a unit out of the task organisation
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on
        `/games/hierarchy` in this game — see the **games** tag. The game must be in `planning` or
        `preparation`.

        **THE HULL STAYS IN THE EXERCISE.** This is a DELETE on the PLACEMENT, not on the unit — to
        remove the piece from the game entirely, use `DELETE /games/{id}/units/{unit_id}`. The two
        are separate resources for exactly that reason.

        Idempotent in a way the unit removal is not: a piece that is already unplaced is left
        unplaced, which is what the caller asked for either way.
      operationId: unplaceGameUnit
      responses:
        '200':
          description: The game's pieces, with the placement cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameUnitListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such piece in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/placements:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: Where the force has been placed
      description: |
        Requires `read` on `/system/games`, **or** a game role holding `read` on `/games/units` in
        this game — see the **games** tag. The setup view: where each hull has been put on the map,
        and how much of the force is still to come.

        **THIS IS NOT A LIVE POSITION, AND THE DIFFERENCE MATTERS.** A placement is where a hull
        STARTS. Once a game enters `execution` the hull's position at any instant is derived from its
        fix chain, and the first leg of that chain is the placement — frozen, and no longer editable.
        So after the game has begun this endpoint reads as the record of where the force started,
        which is what an after-action review needs, and a client drawing the CURRENT picture asks
        the movement endpoints instead.

        **`placed` AND `unplaced` ARE THE GATE'S ARITHMETIC.** `unplaced` counts the FORCE that has no
        position rather than subtracting the list, because a hull released from the exercise takes
        its placement with it — the two numbers together are worth more than either alone, and
        `ready` is the placement half of the condition on leaving `preparation`. It says nothing
        about the other three conditions (a force, participants, and everyone ready), so a client
        must not treat it as "the game can start".

        Readable at every state, including after closure: reading is not an edit.
      operationId: listGameUnitPlacements
      responses:
        '200':
          description: The placements, ordered by hull, with the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlacementListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/units/{unit_id}/placement:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: unit_id
        in: path
        required: true
        description: The hull's id — the unit's own id, not a game_units row id.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [games]
      summary: Set a unit's starting position
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on `/games/units`
        in this game — see the **games** tag. The game must be in `planning` or `preparation`.

        **THE THIRD THING A PIECE HAS**, after being in the exercise and sitting in the task
        organisation. All three are independent: a hull may be assigned, in the tree, and have no
        position — and the start gate refuses until every piece has one.

        **THIS IS THE ONLY EDITABLE WRITE OF THE MOVEMENT MODEL.** Everything downstream is
        append-only: on the transition into `execution` every placement is materialised into the
        first leg of that hull's fix chain, stamped at the game's assumed start, and a leg cannot be
        amended. Sending another position is therefore the last chance to correct one — after the
        game begins, moving a hull means giving it an order, which is a new leg rather than an edit.

        **409 once play has begun**, including at closure. The chain holds the position and this
        endpoint can no longer change what it means.

        **BOTH COORDINATES ARE REQUIRED AND BOTH MAY BE ZERO.** An absent coordinate is an error
        rather than a position of 0 — the equator and the prime meridian are real places, and the
        Natuna Sea exercises sit close to latitude 0. Ranges are ±90 and ±180.
      operationId: setGameUnitPlacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUnitPlacementRequest'
      responses:
        '200':
          description: The setup view after the position was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlacementListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such piece in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Clear a unit's starting position
      description: |
        Requires `update` on `/system/games`, **or** a game role holding `update` on `/games/units`
        in this game — see the **games** tag. The game must be in `planning` or `preparation`.

        **NOT THE SAME ACT AS `DELETE /games/{id}/units/{unit_id}/hierarchy`.** That one takes the
        hull out of the TASK ORGANISATION; this one takes it off the MAP. A hull may be in either
        state without the other, and neither call implies the other.

        The hull stays in the exercise and keeps its tree placement.

        Idempotent: a hull with no position is left with none, and there is no "not placed" error,
        because there is no state the caller could have wanted that is not now true. The response is
        the whole setup view rather than a 204, so the count the Game Master is watching arrives
        with the answer to their own request.
      operationId: clearGameUnitPlacement
      responses:
        '200':
          description: The setup view after the position was withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlacementListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such piece in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/RosterClosed'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [games]
      summary: Pause the scenario clock
      description: |
        Authentication only, with the authority check in the service: the caller must be able to
        **run this exercise** — the same rule as `POST /games/{id}/transitions`, and refused with 403
        rather than 404 so a blocked pause stays visible in the audit trail.

        The game must be in `execution`. **409 otherwise**, including at `closure`: a game under
        analysis has no timeline running.

        **A PAUSE IS A RATE, NOT A STATE.** It appends a segment of the rate series at factor zero and
        closes the exercise to orders; the game stays in `execution`. There is no `paused` state, no
        flag on the timeline, and **no catch-up on resume** — the paused wall-clock time is simply
        never added to the assumed timeline, so a twenty-minute pause leaves the exercise twenty
        minutes of scenario time behind where it would otherwise have been.

        **TWO WRITES IN ONE TRANSACTION.** A clock stopped with the doors open accepts an order into a
        frozen exercise; doors closed with the clock running means every hull keeps moving while
        nobody can correct them. The segment is written first, so a failure to close the doors rolls
        the stopped clock back with it.

        **IDEMPOTENT IN EFFECT.** A second pause appends a second zero-rate segment, and zero either
        side of zero is still zero. It does add a history row, because the history records what the
        Game Master did and it did happen twice.

        The response is the whole clock, so a client drawing a timeline needs no second call.
      operationId: pauseGame
      responses:
        '200':
          description: The clock, stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameClockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The game is not in `execution`, so it has no clock to pause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [games]
      summary: Resume the scenario clock
      description: |
        Authentication only, with the authority check in the service — see `POST /games/{id}/pause`.
        The game must be in `execution`.

        **THE RATE COMES FROM THE GAME, NOT FROM THE REQUEST**, and that is what makes `time_factor`
        worth keeping while paused: a Game Master may move the slider during a pause, and the value
        they leave is the rate the exercise resumes at. A resume that took a rate would make that
        adjustment meaningless and would need the client to send a number it may not have.

        **THERE IS NO CATCH-UP.** The assumed clock does not advance to make up for the paused real
        time; the paused interval is never added. A paused interval is a zero-rate segment, so
        resuming is the same arithmetic as any other rate change — nothing has to remember that a
        pause happened.

        Appends a segment sourced `resume` and reopens the exercise to orders, in one transaction and
        in that order.
      operationId: resumeGame
      responses:
        '200':
          description: The clock, running again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameClockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GameNotRunning'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/time-factor:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [games]
      summary: Change how fast the scenario clock runs
      description: |
        Authentication only, with the authority check in the service — see `POST /games/{id}/pause`.
        The game must be in `execution`.

        **WHETHER A SEGMENT IS APPENDED DEPENDS ON THE DOORS.** While the exercise is accepting
        orders the change takes effect at once and a segment records it. While it is paused or
        blacked out, **only the game's column is written**: the rate in force is zero and must stay
        zero until somebody resumes, because a slider that could restart a stopped clock would make
        the pause unrecoverable — the Game Master would have no way to know that moving it had
        started the exercise again.

        **THE COLUMN IS WRITTEN EITHER WAY**, which is what lets a Game Master adjust the pacing
        during a pause and have the exercise resume at the new rate.

        The new rate is `gt=0`. Zero is not a rate — it is a pause, and a pause is its own endpoint
        with its own history entry. There is **no upper bound**: the concept lets a Game Master
        compress an exercise as far as they like.

        **THE HISTORY RECORDS THE ACT, NOT THE VALUE.** Setting 6x when it was already 6x still
        appends a segment, because "the rate was checked before a decisive phase" is something a
        reviewer may need to see, and suppressing it would make the series a record of the rate rather
        than of what the Game Master did.
      operationId: setGameTimeFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTimeFactorRequest'
      responses:
        '200':
          description: The clock, with the new rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameClockEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GameNotRunning'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/units/{unit_id}/order:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: unit_id
        in: path
        required: true
        description: The hull's id — the unit's own id, not a game_units row id.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [games]
      summary: Order a unit to steer
      description: |
        Authentication only, with the authority check in the service: **the caller must be this
        hull's commander**. That is an instance comparison over a row — an in-game fact, not an
        application permission — so no Casbin object appears here, following
        `POST /live-feed/fixes`'s shape. The refusal is **403**, not 404, so a blocked order stays
        visible in the audit trail.

        **A COMMANDO CAN ONLY STEER THEIR OWN HULL.** The hull is in the path because it is the
        resource being ordered, but the caller's authority is implied by it: nobody may order a hull
        they do not command, and the Game Master who runs the exercise commands no ship in it.

        The game must be in `execution`, and must be **accepting actions**. The two are separate
        refusals: a game in `planning` has not begun, while a paused one has begun and been stopped.

        **AN ORDER IS CLAMPED, NOT REFUSED.** The speed is reduced to the hull's maximum for the
        movement domain it is in, and what the caller asked for is returned as `requested_speed_kn`
        with `clamped: true`. A client with a slider is not trusted, but an operator whose slider sat
        one notch high should lose the excess speed rather than the whole order — the heading is
        applied either way.

        **A HULL WHOSE SPEED CANNOT BE BOUNDED IS REFUSED**, with 409 rather than an unclamped order.
        That happens for a hull in `Air` or `Land` (there is no speed column for either), and for a
        hull with no published maximum in the domain it moves in. **In the current fleet this means a
        submarine cannot be ordered to move submerged**, because the imported specifications give
        submarines a surfaced maximum only — a data gap surfacing as a refusal rather than as an
        unbounded boat.

        **POSITION AND TIME ARE THE SERVER'S.** The position is derived from the hull's previous leg
        and the elapsed assumed time; the instant comes from the scenario clock. Neither is accepted
        from the client, which is what stops a Commando placing their ship wherever they liked and
        stamping it whenever they liked. A leg is a **straight rhumb line** from that point, on the
        ordered heading — see the README's §2.
      operationId: orderGameUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameOrderRequest'
      responses:
        '201':
          description: The leg that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameFixRecordEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller does not command this hull. Refused before the game's state is examined, so the
            response says nothing about whether the exercise has started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such piece in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            One of four things, and `data.errors._request` says which: the game is not in `execution`;
            the game is not accepting actions (paused or blacked out — the order was **not** queued);
            the hull's speed cannot be bounded; or a leg for this hull already exists at this instant,
            which means the client double-sent and should try again once the clock has moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/positions:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: at
        in: query
        required: false
        description: |
          An instant on the **SCENARIO** clock, RFC 3339. Omitted, it means the scenario `now`,
          computed by the server.

          **THIS IS NOT THE WALL CLOCK.** Assumed time is a piecewise integral over the game's rate
          changes, so it is routinely hours or days away from real time — a client that sent
          `Date.now()` would be asking where the fleet was on a different day. This is also the
          closure-playback parameter: pass an instant during the exercise and the answer is where every
          hull was then, because each leg is a closed-form function of its own row.
        schema:
          type: string
          format: date-time
      - name: from_unit
        in: query
        required: false
        description: |
          The hull to measure every position FROM. When given, each position also carries
          `distance_m`, `bearing_deg` and `relative_bearing_deg`.

          **A MEASURE IS A QUERY, NOT A PROPERTY** — the README's §4 — because it depends on where
          the question is asked from: the bearing from A to B is not the reciprocal of the bearing from
          B to A, and the relative bearing depends on which way the observer happens to be pointing.
          This is a parameter on one read rather than an endpoint of its own so that a range can never
          contradict the plot it is displayed beside.

          The hull must have a **position at this instant**; before the exercise begins none do, so any
          value is refused. 400 naming the field rather than 404, because the parameter is not a path
          segment and the hull may well be in the game.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: Where the fleet is at an assumed instant
      description: |
        Authentication only, with **two ways in decided by the service**: the caller must be a
        **participant of this game**, or hold `read` on `/system/games`. Like `GET /games/{id}`, and for
        the same reason — Echo cannot express "this permission OR that participation" as a chain, and a
        participant holds no application permission at all. Neither way in gives a **403**.

        **A PARTICIPANT SEES THE WHOLE PLOT, INCLUDING THE OTHER SIDE AND THE JUDGES** (decided
        2026-09-21). That is deliberately the **opposite** of `GET /games/{id}/units`, which stays
        staff-facing so that a Commando does not learn the other side's order of battle — and the two
        coexist because **the plot does not exist until the game begins**: positions come from the fix
        chain, and the chain is empty until the transition into `execution` materialises an origin for
        every placed hull. A participant who reads this during `planning` or `preparation` gets an empty
        fleet at any instant they ask about, because no leg exists to answer with.

        One state where a participant IS refused: **`closure`**, and for the same reason
        `GET /games/{id}` refuses them there — the concept puts closure in the Game Master's and the
        judges' hands. A judge-side participant, or the Game Master, still sees it.

        **FOG OF WAR IS FUTURE WORK, deliberately not started.** When it arrives it belongs on this
        decision rather than in a middleware, because it will be a per-hull visibility rule rather than
        a yes/no.

        **DERIVED POSITIONS, NOT MEASUREMENTS.** These come from the fix chain — where hulls were
        ORDERED to be — and never from `unit_positions_latest`, which holds what a device reported. The
        two are deliberately different tables: an order is clamped to the hull's specification and a
        measurement is never clamped, so a vessel reporting 35 knots against a 30-knot specification is
        the most interesting fact in the exercise rather than a bug to correct. The live feed is where
        measured positions are read.

        **EACH HULL IS ADVANCED ALONG ITS LEG**, not reported at the coordinates it was ordered from:
        a hull two hours into a 12-knot leg is 24 nautical miles further on. A hull with no leg at or
        before the instant is **absent** from the list — before the exercise begins that is every hull,
        and the list is legitimately empty. The force itself is `GET /games/{id}/units`; this endpoint
        deliberately does not enumerate hulls it cannot place, because a client would be tempted to
        draw them at (0, 0), which is a real place in the Gulf of Guinea.

        **THE THREE MEASURES APPEAR ONLY WHEN `from_unit` IS GIVEN**, and they are computed against the
        observer's **live heading** — the heading of the leg in force at the instant asked about — so a
        client holding a stale heading cannot get the wrong side of the ship. Bearing is a
        **great-circle** bearing, not a rhumb one: §4 records that these are the measure queries, and
        "which compass number do I point at" is the great-circle question.

        **THE OBSERVER'S OWN ROW GETS A ZERO DISTANCE AND NO BEARING.** An azimuth between coincident
        points does not exist, and `atan2(0, 0)` returns 0 — which would report a ship as bearing due
        north of itself.
      operationId: listGamePositions
      responses:
        '200':
          description: Every hull that had a leg at or before the instant, ordered by hull.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePositionListEnvelope'
        '400':
          description: |
            `at` is not an RFC 3339 instant, or `from_unit` does not name a unit that has a position at
            this instant. `data.errors` names the offending field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is neither a participant of this game nor staff (`read` on `/system/games`), or
            is a non-judge participant at `closure`.

            **403 rather than an empty fleet.** An empty list would tell a stranger that the exercise is
            simply not under way, which is a fact about somebody else's game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The scenario clock is not anchored, so there is no assumed `now` to report. Returned only
            when `at` is omitted — a caller who names an instant is asking something an unanchored game
            can answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # =========================================================================
  # MESSAGING — concept §3 item 3, [6] and [7]
  # =========================================================================
  /games/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: The messages this caller may see
      description: |
        **THE FIRST GROUP OF ROUTES IN A GAME THAT THE PEOPLE BEING EXAMINED USE.** Everything else
        under `/games` is staff-facing; this is the conversation, and what authorises it is a game
        ROLE holding `read` on `/games/messages` — so the matrix decides which roles may correspond,
        and the service then decides whether this caller is in **this** game. Both checks run.

        **THE SET RETURNED IS A VISIBILITY ANSWER, NOT A FILTER.** A7 makes deletion asymmetric, so
        which messages are in scope depends on who is asking:

        | viewer | sees |
        |---|---|
        | the sender | everything they sent, **including what they withdrew** |
        | the Game Master and the Judges | everything, deleted or not (A8) |
        | an addressee | what was addressed to them and they have not hidden — but **not** if the sender withdrew it, because a withdrawal hides it from every recipient |
        | any participant | a **broadcast**, which A2 defines as a message with no `to` and no `cc` |

        There is no parameter to widen this. `only_mine` **narrows** an already-visible set.

        **ORDERED BY `created_at` AND NOT `assumed_at`** (A9). The two diverge whenever the scenario
        clock is paused: several messages then share one assumed instant, and ordering by it would
        shuffle messages whose real order the participants remember.
      operationId: listGameMessages
      parameters:
        - name: kind
          in: query
          required: false
          description: |
            One kind of message, or both when omitted. Omitted means both — the empty string is not a
            filter for "no kind".
          schema:
            $ref: '#/components/schemas/MessageKind'
        - name: only_mine
          in: query
          required: false
          description: |
            Narrows to messages where the caller is a **named recipient**, hiding broadcasts. It is
            the difference between "everything I can see" and "everything addressed to me", which is
            otherwise indistinguishable in a busy exercise.

            A message the caller sent but did not address to themselves disappears under this, which
            is correct: an inbox is what arrived, not what was written.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A page of the messages in scope, with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessageListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller holds no place in this game. **Participation and not `read` on `/system/games`**:
            an operator reviewing a game may watch it without being in it, and messaging is a
            conversation between the people in the exercise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Send a message
      description: |
        **SENDING IS A PARTICIPANT'S ACT, NOT A STAFF ONE.** A Commando sends Telegram messages — [6]
        has them passing "between Personnels or Actor" — so this asks for a place in the game and the
        `send_message` permission, not for the ability to run the exercise.

        **THE PHASE IS `execution`.** A message sent in `planning` has no scenario instant to sit on,
        and one sent in `closure` would have to be placed on a timeline nobody is advancing.

        **`[6.1]` IS ENFORCED, IN BOTH DIRECTIONS.** A Telegram message from the Game Master or a
        Judge **must** name `id_assumed_role`: the concept says that staff who want to send one "are
        required to 'Act' as some kind of a Commando", so a staff Telegram without one is the Game
        Master speaking as themselves into a channel the concept says they do not speak in. The
        converse is refused too — a **participant may not assume an identity**, because allowing it
        would make the concealment voluntary and anybody could send as anybody.

        **`[6.2]` IS ENFORCED IN THE SERVICE.** Administrative messages are "used between Judges and
        Game Master", so a participant on the exercise side sending `kind: administrative` is refused
        with 403 naming `kind`. It is checked there rather than by a permission because the permission
        cannot see the kind, and a permission per kind would put a grant in the matrix that the route
        then refuses.

        **AN UNADDRESSED MESSAGE IS A BROADCAST (A2), AND ONLY `TERBUKA` MAY BE ONE.** Omitting both
        `to` and `cc` makes the message visible to every participant; naming a recipient for a
        `TERBATAS` or `RAHASIA` message is required, because A1 gates those two on the recipient list
        and an unaddressed one would mean different things to its sender and to everybody else.

        **ONE PERSON IS ONE ROW.** A user in both `to` and `cc` is refused rather than silently
        collapsed: the two lists mean different things — [7.12.2] addresses, [7.12.3] copies — and a
        collapse would lose which one the sender meant while looking like success.
      operationId: sendGameMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameMessageRequest'
      responses:
        '201':
          description: |
            The message as a subsequent `GET` would return it. The server **re-reads** it rather than
            projecting what it was given, so the two cannot drift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessageEnvelope'
        '400':
          description: |
            A field the request cannot have. The `data.errors` key names it, and the cases are:

            | field | what went wrong |
            |---|---|
            | `id_assumed_role` | a staff Telegram without one, or a role this game never issued |
            | `id_degree` | missing or unknown — read the accepted values from `/helpers` under `message_degrees` |
            | `classification` | not one of the three in force, or an unaddressed message that is not `TERBUKA` |
            | `kind` | not `telegram` or `administrative` |
            | `to` | a recipient who is not a participant, a duplicate, or one person in both lists |
            | `id_reply_to` | a message the caller cannot see in this game |
            | `_request` | the game's own constraint refused the row; the message names the constraint |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            One of three different refusals, each naming why:

            | reason | when |
            |---|---|
            | the caller is not a participant | always |
            | `id_assumed_role` | a participant tried to send AS somebody |
            | `kind` | a participant tried to send an administrative message ([6.2]) |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The game is not in `execution`. The message names the state it is in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/messages/{message_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: message_id
        in: path
        required: true
        description: The message's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: One message this caller may see
      description: |
        **"NO SUCH MESSAGE" AND "NOT YOURS" ARE THE SAME ANSWER, ON PURPOSE.** Both are 404, because
        telling a caller that a message exists but is not theirs is itself a disclosure — and for a
        `RAHASIA` message it is the disclosure that matters.

        **WHAT THE CALLER IS TOLD ABOUT THE SENDER DEPENDS ON WHO THEY ARE.** With an assumed identity
        in play, `sender.assumed_role` is always present and `sender.author` is present only for the
        Game Master, the Judges, and the sender themselves — Q13 hides the author from ordinary
        participants and the answer to F5 reveals it to staff. When no identity was assumed there is
        nothing to conceal, so `author` is present for everybody: the alternative would make the field
        mean "the sender is not who they say" rather than "here is who really sent this", and a client
        could not tell those apart.
      operationId: getGameMessage
      responses:
        '200':
          description: The message, concealed as far as this caller is entitled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller holds no place in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No message with that id **that this caller may see**. A message the sender withdrew is
            404 for its addressees and 200 for its sender, the Game Master and the Judges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [games]
      summary: Withdraw or hide a message — whichever the caller is entitled to
      description: |
        **ONE ROUTE FOR BOTH OF A7'S DELETIONS, AND THE CALLER DOES NOT SAY WHICH.** The service infers
        it, so a client cannot ask for the wrong one and cannot delete a message that is not theirs by
        claiming the other verb.

        | caller | effect |
        |---|---|
        | the sender | withdrawn from **every recipient**; still visible to the sender, the Game Master and the Judges, marked with when it went |
        | an addressee | hidden from **that recipient alone**; the sender still sees it and is told they deleted it |
        | anybody else | **403** — a broadcast is visible to everyone and addressed to nobody, so there is no row to write |

        **NOTHING IS EVER HARD-DELETED.** A7 keeps the record for the Game Master and the Judges, and
        closure playback must render the visibility as it was **at that instant** — otherwise a Judge
        sees a message the personnel provably could not have seen.

        **A SENDER WHO ALSO ADDRESSED THEMSELVES GETS THE SENDER'S DELETION.** The tie is broken that
        way because the sender's act affects other people and is therefore the one they mean; breaking
        it the other way would silently make the button do nothing to anybody else.

        **IDEMPOTENT, AND THE FIRST INSTANT IS KEPT.** A second deletion succeeds without moving the
        timestamp, so the record answers "when did they withdraw it" rather than "when was this
        endpoint last called".
      operationId: deleteGameMessage
      responses:
        '200':
          description: |
            The message after the deletion, carrying the timestamp that was written. A sender sees
            `sender_deleted_at`; an addressee sees their own entry in `recipients` marked `deleted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is neither the sender nor an addressee. They could read it — so this is not a
            404 — but there is no deletion of theirs to apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/messages/{message_id}/read:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: message_id
        in: path
        required: true
        description: The message's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [games]
      summary: Record that the caller has read a message (A5)
      description: |
        **A FUNCTIONAL RECEIPT, NOT A DISPLAY-ONLY ONE.** The client's answer to A5 was explicit that
        the receipt matrix records **when each recipient read** the message, so this writes a real
        timestamp that the sender can then see.

        **`read_at` IS SET ONCE AND THE FIRST INSTANT IS KEPT.** The receipt answers "when did they
        see it", and a receipt that followed the latest read would make a repeatedly-opened message
        look like one nobody looked at for an hour. It also makes the write safe to repeat after a
        dropped response.

        **A BROADCAST HAS NO RECEIPT TO TAKE, AND THAT IS A 403 RATHER THAN A 404.** The message is
        visible to the caller — that is why they could ask at all — so "not found" would be a lie; the
        honest answer is that there is no row to mark, because a broadcast was addressed to nobody.
      operationId: markGameMessageRead
      responses:
        '200':
          description: The message with the receipt recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller was not addressed by this message — either a broadcast, or somebody who can see
            it without being a recipient of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}/scenario-roles:
    parameters:
      - name: id
        in: path
        required: true
        description: The game's id.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [games]
      summary: The identities this game has issued to send under
      description: |
        **READABLE BY EVERY PARTICIPANT, READ WITH `send_message` BY STAFF.** A message names the
        identity it was sent under, so a client that draws the message needs the list to resolve it —
        and a Commando who was addressed by "Panglima TNI" is entitled to know that this game issued
        that identity, without being able to create one.
      operationId: listGameScenarioRoles
      responses:
        '200':
          description: The identities, in name order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameScenarioRoleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller holds no place in this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [games]
      summary: Author an identity for staff to send under
      description: |
        **CONCEPT `[1.12]`: "Game Master can create Scenario Role (eg. Panglima TNI). This can be used
        to send Telegram Message while in Execution Phase".** They are **per game** and belong to it —
        the same peacetime name may be issued by two exercises without either knowing about the other —
        which is why they hang off the game rather than living with the application's role vocabulary.

        **STAFF ONLY.** A participant creating one would be minting a name to impersonate with, and the
        concealment Q13 exists to provide would become voluntary.

        **THIS IS WHAT MAKES A STAFF TELEGRAM POSSIBLE.** [6.1] requires the Game Master and the Judges
        to act as somebody, so a game with no scenario roles cannot produce a Telegram message from
        staff at all — the send is refused with 400 naming `id_assumed_role` until one exists.
      operationId: createGameScenarioRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameScenarioRoleRequest'
      responses:
        '201':
          description: The identity that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameScenarioRoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not the Game Master or a Judge — a participant, or somebody not in the game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            This game already has a live identity with that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token from `/auth/login`. A stateless token cannot be revoked,
        so its lifetime bounds how long a stolen token is useful — see
        `JWT_DURATION_SECONDS`.

  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
      description: |
        Rows per page. Optional here with a default of 25, which means
        `pagination.PaginationFilter` must relax its current `required` validation to
        match — as written, omitting it is a 400.
    PageNumber:
      name: page_number
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: The account's surrogate id. Never reused.
    UnitID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UnitClassID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UnitCategoryID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UnitTypeID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ServiceBranchID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: |
        The branch's id, from `/helpers` under `service_branches`. The vocabulary is closed at three
        branches and there is no route to add another.

  responses:
    RosterClosed:
      description: |
        The game has moved past `preparation`, so its roster, force and task organisation are fixed.
        Returned by every write that edits an exercise's setup.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            message: Conflict occurred
            data:
              errors:
                _request: This game's roster has closed.
    GameNotRunning:
      description: |
        The game is not in `execution`, so its scenario clock has nothing to change.

        A 409 rather than a 404, because the game exists and the caller is entitled to know it: the
        clock simply has no meaning before play begins — there is no assumed start to anchor it and no
        force to stop — and at `closure` the exercise is being analysed rather than run.

        Note that the OFFENDING THING here is not `accepting_actions`: that column defaults to true,
        so a game that has never started would otherwise accept a pause and report success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            message: Conflict occurred
            data:
              errors:
                _request: The scenario clock runs while a game is in `execution`. This one is in
                  `planning`.
    UnitHierarchyList:
      description: |
        The WHOLE vocabulary after the change, not the level that changed. Inserting a level renumbers
        the ones above it, so a response carrying only the newcomer would leave the client holding
        positions that are already wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnitHierarchyListEnvelope'
    UnitHierarchyNameTaken:
      description: A hierarchy level already uses that name. `data.errors` names `name`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            message: Conflict occurred
            data:
              errors:
                name: A hierarchy level already uses that name.
    NotModified:
      description: |
        The caller's cached copy is still current, so there is nothing to send. There is
        **no body**: a body on a 304 is invalid, and a client that treated one as the
        representation would replace good cached data with it.
      headers:
        ETag:
          description: The tag that matched, echoed so a client can confirm what it was compared against.
          schema: {type: string}
    BadRequest:
      description: |
        The request parsed, but one or more fields were unacceptable. `data.errors` maps
        the offending request field to a reason, keyed exactly as the client sent it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 400
            message: Bad request
            data:
              errors:
                name: This field is required.
                email: Invalid email format.
    Unauthorized:
      description: Missing, expired or invalid credentials. The same response is returned for an unknown account and a wrong password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 401
            message: Unauthorized
            data: null
    Forbidden:
      description: |
        Authenticated but not permitted. Also returned when the credentials are correct
        but the account is not `Active`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 403
            message: Forbidden
            data: null
    NotFound:
      description: The resource does not exist, or has been soft-deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 404
            message: Resource not found
            data: null
    Conflict:
      description: |
        A uniqueness constraint was violated. `data.errors` names the field, so the client
        can highlight it rather than showing a generic message — "username already taken"
        and "email already taken" are otherwise the same database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            message: Conflict occurred
            data:
              errors:
                username: This value is already in use.
    RetirementBlocked:
      description: |
        **A hull in the subtree is assigned to a game that is in `execution`, so nothing was written.**
        This is the ONE case that refuses a retirement, and it is deliberately narrow.

        `planning` and `closure` are NOT refused. Those are normal times to restructure a taxonomy, and
        refusing them would trap an operator behind an exercise nobody is using. `execution` is
        different in kind, because the damage is not to master data:

        - `game_units` is `ON DELETE NO ACTION`, and a retirement does not delete — so the assignment
          SURVIVES and nothing in the schema notices.
        - every list filters `deleted_at IS NULL`, so the hull disappears from the exercise's order of
          battle MID-EXERCISE while the command centre still holds a row nobody can see.

        The remedy is to close the exercise, which is an explicit act, rather than to unassign the hull —
        that would withdraw the very record the exercise depends on.

        **`data.units_in_execution` is the count, so the client does not have to read the sentence.**
        `data.errors._request` carries the same number as prose for display. This is the shape the
        hull-number conflict on `POST /units` already uses, and it is the answer to B2: a client that
        has to parse English to decide what to render is one translation away from rendering the wrong
        thing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetirementConflictResponse'
          example:
            status_code: 409
            message: Conflict occurred
            data:
              errors:
                _request: 3 hulls in this unit category belong to an exercise that is running. Close the exercise before retiring it.
              units_in_execution: 3
    UnprocessableEntity:
      description: The body could not be parsed at all — malformed JSON, or a field of the wrong type. Never a validation failure; that is 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 422
            message: Unprocessable entity
            data:
              errors:
                _request: The request could not be read. Check that the body is valid JSON and that every field has the expected type.
    TooManyRequests:
      description: Rate limited. Honour `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: |
        A defect on our side. The body carries no internal detail — no table or constraint
        names, no file paths, no host names. The correlation is the `X-Request-ID`
        response header, which appears in the server log for the same request.
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Quote this when reporting a failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 500
            message: General Error
            data: null

  schemas:
    # ---------------------------------------------------------------------
    # Envelope
    # ---------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [status_code, message]
      properties:
        status_code:
          type: integer
          format: int32
        message:
          type: string
          example: Bad request
        data:
          type: object
          nullable: true
          description: |
            `null` when the failure is not attributable to a named input — a 5xx, or a 404.
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
              description: Request field name to human-readable reason.
              example:
                username: This field is required.

    PaginationMetadata:
      type: object
      required: [total_records, total_pages, page_size, current_page, has_next_page, has_previous_page]
      properties:
        total_records: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
        page_size: {type: integer, minimum: 1}
        current_page: {type: integer, minimum: 1}
        has_next_page: {type: boolean}
        has_previous_page: {type: boolean}

    # ---------------------------------------------------------------------
    # Shared primitives
    # ---------------------------------------------------------------------
    Helper:
      type: object
      required: [id, name, id_name, is_system]
      description: |
        A lookup row. `name` is the English canonical value used in code and comparisons;
        `id_name` is the Indonesian label to display. `description_en` carries the long
        form where `name` is a code — the NATO hull symbols are why it exists, since
        `FFG` is the canonical identifier and there was otherwise nowhere to say
        "guided missile frigate".
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: FFG}
        id_name: {type: string, example: Fregat}
        description_en: {type: string, example: Guided missile frigate}
        is_system:
          type: boolean
          description: Seeded by a migration. Clients should disable editing and deleting for these rows.
        is_judge_side:
          type: boolean
          description: |
            Present on every lookup row and meaningful on exactly one table: `game_roles`.

            When it is `true`, a participant holding that role is EXCLUDED from the readiness
            gate at Preparation — the concept requires that "each Personnels (Excluding the
            Judges)" declare themselves ready before a game may be executed.

            It is a column rather than a fixed list of role names because lookup rows may be
            RENAMED, so a name-based rule would stop working the first time somebody renamed
            Wasit. It is exposed rather than hidden because a field that drives a rule has to be
            visible, or the CMS cannot explain why one participant is asked to press Ready and
            another is not.

            The server always sends it. It is not in `required` because adding to that list
            would tighten a schema two client teams have already generated against, and an added
            optional field is ignored by a client that does not know it.

    HelpersResponse:
      type: object
      required: [helpers]
      properties:
        helpers:
          type: object
          description: |
            Keyed by table name. A client reads the keys it knows about, so a new lookup
            reaches it without a release — and an unknown key must therefore be IGNORED rather
            than rejected, which is what makes that true.

            Served in this order: `service_branches`, `movement_domains`, `user_statuses`,
            `app_roles`, `unit_statuses`, `unit_categories`, `unit_types`, `game_roles`,
            `unit_hierarchies`, `deployment_statuses`.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Helper'
          example:
            user_statuses:
              - {id: 1, name: Active, id_name: Aktif, description_en: '', is_system: true}

    # ---------------------------------------------------------------------
    # Auth
    # ---------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: Username or email address. Case-insensitive.
          example: operator1
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          description: |
            Sent byte for byte to Argon2id. Never trimmed or normalised — a client that
            strips whitespace will lock its users out.
        return_refresh_token:
          type: boolean
          default: false
          description: |
            Ask for the refresh token in the response body as well as the cookie. Mobile
            and desktop clients have no cookie jar and must set this.

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Required when no refresh cookie accompanies the request.

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer], default: Bearer}
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 3600
        refresh_token:
          type: string
          nullable: true
          description: |
            Present only when the request asked for it. Browser clients receive it as an
            `HttpOnly`, `Secure`, `SameSite` cookie instead, which keeps it out of reach of
            JavaScript.

    # ---------------------------------------------------------------------
    # Users
    # ---------------------------------------------------------------------
    UserSummary:
      type: object
      required: [id, username, name, status, created_at]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        status:
          $ref: '#/components/schemas/Helper'
        nrp: {type: string, maxLength: 64}
        pangkat: {type: string, maxLength: 128}
        satuan: {type: string, maxLength: 255}
        jabatan: {type: string, maxLength: 255}
        id_service_branch:
          type: integer
          format: int64
          nullable: true
          description: |
            Matra — the service branch. Returned as an ID rather than a resolved object like
            `status`: resolving it would add two lookups per row to the account list, for a
            value the client gets in one cached call to `/helpers`.
        id_deployment_status:
          type: integer
          format: int64
          nullable: true
          description: |
            DEPLOYMENT state, and NOT the account status. `status` above answers "may this login
            be used"; this answers "where is this officer posted". Keeping them apart is why the
            lookup is a table of its own. Resolve it from `/helpers`.
        photo_url:
          type: string
          nullable: true
          description: |
            Time-limited presigned URL, not a permanent path. Do not cache it beyond its
            lifetime; re-fetch the account instead.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    UserDetail:
      type: object
      required: [id, username, name, status, roles, created_at]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        phone_number: {type: string}
        status:
          $ref: '#/components/schemas/Helper'
        nrp: {type: string, maxLength: 64}
        pangkat: {type: string, maxLength: 128}
        satuan: {type: string, maxLength: 255}
        jabatan: {type: string, maxLength: 255}
        id_service_branch:
          type: integer
          format: int64
          nullable: true
          description: |
            Matra — the service branch. Returned as an ID rather than a resolved object like
            `status`: resolving it would add two lookups per row to the account list, for a
            value the client gets in one cached call to `/helpers`.
        id_deployment_status:
          type: integer
          format: int64
          nullable: true
          description: |
            DEPLOYMENT state, and NOT the account status. `status` above answers "may this login
            be used"; this answers "where is this officer posted". Keeping them apart is why the
            lookup is a table of its own. Resolve it from `/helpers`.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Helper'
          description: Application roles — what the account may do in the CMS, distinct from the in-game role it may hold in a particular game.
        photo_url: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by: {type: integer, format: int64, nullable: true}
        updated_by: {type: integer, format: int64, nullable: true}

    UserCreateRequest:
      type: object
      required: [username, name, email, password, id_user_status]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Case-insensitive unique among active accounts.
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
        password:
          type: string
          minLength: 12
          maxLength: 256
          format: password
          description: |
            Minimum 12 rather than 8. This is an internal system holding military planning
            data, and Argon2id costs nothing to make longer passwords worthwhile.
        phone_number: {type: string, maxLength: 32}
        nrp:
          type: string
          maxLength: 64
          description: |
            Personnel number. Unique among ACTIVE accounts only, so an NRP freed by a deleted
            record can be re-issued. Leave empty for an account that has none — several
            legitimately do.
        pangkat: {type: string, maxLength: 128}
        satuan: {type: string, maxLength: 255}
        jabatan: {type: string, maxLength: 255}
        id_service_branch:
          type: integer
          format: int64
          description: Matra. Resolve it from `/helpers` rather than assuming an id.
        id_deployment_status:
          type: integer
          format: int64
          description: |
            Deployment state, NOT the account status — see `UserDetail.id_deployment_status`.
            Resolve it from `/helpers`.
        id_user_status:
          type: integer
          format: int64
          description: Normally the `Active` status. Resolve it from `/helpers`, not from a literal id.
        id_app_roles:
          type: array
          items: {type: integer, format: int64}
          description: Application roles to grant. An account with none can sign in and do nothing useful.

    UserSelfUpdateRequest:
      type: object
      description: |
        Contains no administrative fields, by construction. `id_user_status` and roles are
        deliberately absent and cannot be reached from this route.
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
        phone_number: {type: string, maxLength: 32}

    UserAdminUpdateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        email: {type: string, format: email, maxLength: 255}
        phone_number: {type: string, maxLength: 32}
        nrp:
          type: string
          maxLength: 64
          description: |
            Personnel number. Unique among ACTIVE accounts only, so an NRP freed by a deleted
            record can be re-issued. Leave empty for an account that has none — several
            legitimately do.
        pangkat: {type: string, maxLength: 128}
        satuan: {type: string, maxLength: 255}
        jabatan: {type: string, maxLength: 255}
        id_service_branch:
          type: integer
          format: int64
          description: Matra. Resolve it from `/helpers` rather than assuming an id.
        id_deployment_status:
          type: integer
          format: int64
          description: |
            Deployment state, NOT the account status — see `UserDetail.id_deployment_status`.
            Resolve it from `/helpers`.
        id_user_status:
          type: integer
          format: int64
          description: Use `PATCH /users/{id}/status` if you want the change recorded as a security action.

    UserStatusUpdateRequest:
      type: object
      required: [id_user_status]
      properties:
        id_user_status:
          type: integer
          format: int64
          description: The `Active` status activates; anything else deactivates.

    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, maxLength: 256, format: password}
        new_password:
          type: string
          minLength: 12
          maxLength: 256
          format: password
          description: Passed to Argon2id byte for byte, never normalised.

    PasswordResetRequest:
      type: object
      required: [new_password]
      properties:
        new_password: {type: string, minLength: 12, maxLength: 256, format: password}

    # ---------------------------------------------------------------------
    # Units
    # ---------------------------------------------------------------------
    UnitClassSummary:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Sigma}
        id_name: {type: string}
        unit_type:
          $ref: '#/components/schemas/Helper'
        default_turn_rate_max_deg_s:
          type: number
          nullable: true
          description: |
            NULL means "not yet established", which is different from zero. The simulation
            must refuse to turn a hull with no known rate rather than invent one.
        hull_count:
          type: integer
          minimum: 0
          description: Live hulls in this class.
        image_url:
          type: string
          description: |
            A presigned, time-limited URL for the class picture. ABSENT when the class has
            none — absent rather than null, matching `current_specification` and the game
            area, because a generated client handles an omitted field while `null` and `""`
            are both simply a broken image to an `<img>` tag.

            The lifetime is short (`AWS_PRESIGNED_URL_LIFETIME_SECONDS`, one minute by
            default), so re-read the class rather than storing the URL.

    UnitClassDetail:
      type: object
      required: [id, name, unit_type]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        id_name: {type: string}
        unit_type:
          $ref: '#/components/schemas/Helper'
        role_description: {type: string}
        default_turn_rate_max_deg_s: {type: number, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        image_url:
          type: string
          description: A presigned, time-limited URL for the class picture, or absent when the class has none. See `UnitClassSummary.image_url`.

    # ---------------------------------------------------------------------
    # Unit class images — the asset bundle
    #
    # The CMS manages one picture per class; the Rust command centre pulls them all in a
    # single request. See the /assets/unit-class-images paths.
    # ---------------------------------------------------------------------
    UnitClassImageMetadata:
      type: object
      description: |
        What the stored picture IS, as recorded when it was accepted — never what the
        client claimed. `content_type` comes from the server's decoder.
      required: [object_name, content_type, size_bytes]
      properties:
        object_name:
          type: string
          description: |
            The filename the client supplied, kept for the operator's benefit. The stored
            object is named by a uuid instead, so replacing a picture cannot leave the
            previous bytes reachable at the same URL.
        content_type: {type: string, enum: [image/jpeg, image/png]}
        size_bytes: {type: integer, format: int64}
        width_px: {type: integer, minimum: 0}
        height_px: {type: integer, minimum: 0}

    UnitClassImageResult:
      type: object
      required: [id_unit_class, image]
      properties:
        id_unit_class: {type: integer, format: int64}
        image_url:
          type: string
          description: |
            A presigned, time-limited URL, absent if it could not be generated. The object
            KEY is never returned: it is an internal address, and a client holding it would
            build links that break the moment the bucket or environment prefix changes.
        image:
          $ref: '#/components/schemas/UnitClassImageMetadata'
        updated_at: {type: string, format: date-time}

    UnitClassImageEnvelope:
      type: object
      required: [status_code, message]
      properties:
        status_code: {type: integer, example: 200}
        message: {type: string, example: Successfull}
        data:
          $ref: '#/components/schemas/UnitClassImageResult'

    AssetClassRef:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        id_name: {type: string}

    AssetBundleEntry:
      type: object
      required: [asset_kind, id_unit_class, file_name, content_type]
      properties:
        asset_kind:
          type: string
          enum: [unit_class_image]
          description: |
            What this file IS, not merely where it is. Present so a second kind of asset
            can join this archive later without a breaking change: a client reads the kind,
            ignores an entry it does not recognise, and keeps working.
        id_unit_class: {type: integer, format: int64}
        class_name: {type: string}
        class_id_name: {type: string}
        file_name:
          type: string
          description: |
            The entry's path INSIDE the archive. Built from the class id and the file
            extension, never from the class name: a name is operator-controlled free text,
            and `../` in one would produce an entry that escapes the extraction directory.
            The human-readable name travels in `class_name` instead.
        content_type: {type: string, enum: [image/jpeg, image/png]}
        size_bytes: {type: integer, format: int64}
        width_px: {type: integer, minimum: 0}
        height_px: {type: integer, minimum: 0}

    AssetBundleManifest:
      type: object
      required: [bundle_kind, manifest_name, etag, entry_count, entries]
      properties:
        bundle_kind: {type: string, enum: [unit-class-images]}
        manifest_name:
          type: string
          example: manifest.json
          description: Where this manifest sits inside the archive, so a client holding only the manifest knows what to look for.
        etag:
          type: string
          description: |
            The same value as the `ETag` header, repeated in the body so a client that
            cached the body can compare the two — and can tell whether the manifest it
            holds describes the archive it holds.
        generated_at:
          type: string
          format: date-time
          description: |
            When this manifest was produced. NOT part of `etag`, and therefore not a change
            signal: it differs on every call by design.
        content_changed_at:
          type: string
          format: date-time
          description: |
            The newest `updated_at` among the classes considered — the field that answers
            "when did this set of pictures actually last change". Unlike `generated_at`
            this DOES describe the content, so it is part of `etag`.
        entry_count: {type: integer, minimum: 0}
        entries:
          type: array
          description: Ordered by class id, so two manifests can be compared and a difference means a real change rather than a different iteration order.
          items:
            $ref: '#/components/schemas/AssetBundleEntry'
        classes_without_image:
          type: array
          description: Live classes that still need a picture, so the client can draw a deliberate fallback rather than an empty slot it cannot tell from a failed download.
          items:
            $ref: '#/components/schemas/AssetClassRef'

    AssetBundleManifestEnvelope:
      type: object
      required: [status_code, message]
      properties:
        status_code: {type: integer, example: 200}
        message: {type: string, example: Successfull}
        data:
          $ref: '#/components/schemas/AssetBundleManifest'

    UnitSummary:
      type: object
      required: [id, name, unit_class, unit_status]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: KRI Ahmad Yani}
        hull_number:
          type: string
          nullable: true
          description: |
            Nullable by necessity — KRI Dewaruci and KRI Bima Suci have no hull number in
            the source data.
        unit_class:
          $ref: '#/components/schemas/UnitClassSummary'
        unit_status:
          $ref: '#/components/schemas/Helper'
        service_branch:
          $ref: '#/components/schemas/Helper'
        movement_domain:
          $ref: '#/components/schemas/Helper'
        current_specification_version:
          type: integer
          nullable: true
          minimum: 1
          description: |
            The version of the specification IN FORCE, or absent when the hull has none published.

            **On the summary as well as the detail, because a list of hulls is where it is wanted** —
            a grid showing "KRI Ahmad Yani · spec v3" would otherwise make one detail call per row.
            It pairs with `GET /units/{id}?version=`, which serves any version, so a client can read
            this, display it, and link straight to the figures in force.

            **Absent rather than zero.** A hull may be created before its figures are known, and
            version numbering starts at 1 — so `0` cannot occur and would read as a version rather
            than as "nobody has published one". Same convention as `current_specification` below.

            On the detail it always equals `current_specification.version`: the same fact stated
            twice, once flat for a list and once nested for a client about to read the figures.

    UnitSpecification:
      type: object
      required: [version, is_current]
      description: |
        An immutable, append-only version. Editing a figure inserts a new version rather
        than changing an existing one, so a game judged in September still reports the
        numbers the judges saw when a figure is corrected in October.

        Every numeric field is nullable, and **null means unknown, not zero.** The source
        data carries no submerged speed for any submarine; treating a missing value as
        zero would freeze the vessel, and as unbounded would let it outrun a frigate. A
        client must decline to compute movement when the value it needs is null, and say so.
      properties:
        version: {type: integer, minimum: 1}
        is_current: {type: boolean}
        loa_m: {type: number, nullable: true, description: Length overall in metres.}
        beam_m: {type: number, nullable: true}
        draft_m: {type: number, nullable: true}
        displacement_standard_t: {type: number, nullable: true}
        displacement_full_t: {type: number, nullable: true}
        speed_max_surface_kn: {type: number, nullable: true}
        speed_max_submerged_kn: {type: number, nullable: true}
        speed_cruise_kn: {type: number, nullable: true}
        range_nm: {type: number, nullable: true}
        endurance_days: {type: integer, nullable: true}
        crew_personnel: {type: integer, nullable: true}
        embarked_personnel: {type: integer, nullable: true}
        turn_rate_max_deg_s: {type: number, nullable: true}
        turn_rate_is_derived:
          type: boolean
          description: True when the value was derived rather than supplied by an operator, so the CMS can mark it as an estimate.
        spec:
          type: object
          additionalProperties: true
          description: |
            Propulsion, weapons, sensors and aviation. An open object because its shape
            will change when the fire-simulation feature lands; `spec_schema_version`
            makes a later migration into typed columns mechanical.
        spec_schema_version: {type: integer, minimum: 1}

    UnitDetail:
      type: object
      required: [id, name, unit_class, unit_status]
      description: |
        `current_specification` is ABSENT when the hull has no published specification yet.
        A hull can be created before its figures are known, and the API does not invent a
        speed for it; publish the first version with
        `POST /units/{id}/specifications`.
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        hull_number: {type: string, nullable: true}
        unit_class:
          $ref: '#/components/schemas/UnitClassSummary'
        unit_status:
          $ref: '#/components/schemas/Helper'
        service_branch:
          $ref: '#/components/schemas/Helper'
        movement_domain:
          $ref: '#/components/schemas/Helper'
        role_description: {type: string}
        source_country: {type: string}
        source_yard: {type: string}
        commissioned_year_from:
          type: integer
          nullable: true
          description: |
            Commissioning is often known only as a range ("2011-2014") or a decade
            ("1980-an") because the source groups vessels by batch. `commissioning_precision`
            says which of these the years represent, so a single year is never implied when
            the source never claimed one.
        commissioned_year_to: {type: integer, nullable: true}
        commissioning_precision:
          type: string
          enum: [exact, year, range, decade, unknown]
        current_specification:
          $ref: '#/components/schemas/UnitSpecification'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    # ---------------------------------------------------------------------
    # Write requests (slice 1b)
    # ---------------------------------------------------------------------
    UnitCreateRequest:
      type: object
      required: [id_unit_class, id_service_branch, id_movement_domain, id_unit_status, name]
      properties:
        id_unit_class: {type: integer, format: int64}
        id_service_branch: {type: integer, format: int64}
        id_movement_domain: {type: integer, format: int64}
        id_unit_status: {type: integer, format: int64}
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: KRI Ahmad Yani
        hull_number:
          type: string
          nullable: true
          maxLength: 32
          description: Optional by necessity — KRI Dewaruci and KRI Bima Suci have none.
        role_description: {type: string, maxLength: 2000}
        source_country: {type: string, maxLength: 255}
        source_yard: {type: string, maxLength: 255}
        commissioned_year_from:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2200
        commissioned_year_to:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2200
        commissioning_precision:
          type: string
          enum: [exact, year, range, decade, unknown]
          default: unknown
          description: |
            Which of the two years actually means something. `range` requires both;
            `exact`, `year` and `decade` require `commissioned_year_from` and forbid
            `commissioned_year_to`. Recording `exact` for a batch whose source only said
            "1980-an" would invent a fact the source never claimed, which is why this field
            exists rather than a single year column.
        source_notes: {type: string, maxLength: 2000}
      description: |
        Provenance fields `source_row` and `source_revision` are **not accepted here.** They
        identify a row in the source workbook and belong to the importer. Allowing a hand
        edit to set them would make an operator's change indistinguishable from imported
        data, which is exactly the distinction that `source_revision` exists to preserve.

    UnitUpdateRequest:
      type: object
      description: |
        Every field is optional; only those present are changed.

        To **clear** a nullable text field, send an empty string — see the note on PATCH and
        nullable fields at the top of this document.
      properties:
        id_unit_class: {type: integer, format: int64}
        id_service_branch: {type: integer, format: int64}
        id_movement_domain: {type: integer, format: int64}
        id_unit_status: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 255}
        hull_number:
          type: string
          maxLength: 32
          description: Empty string clears it.
        role_description: {type: string, maxLength: 2000}
        source_country: {type: string, maxLength: 255}
        source_yard: {type: string, maxLength: 255}
        commissioned_year_from: {type: integer, nullable: true, minimum: 1900, maximum: 2200}
        commissioned_year_to: {type: integer, nullable: true, minimum: 1900, maximum: 2200}
        commissioning_precision:
          type: string
          enum: [exact, year, range, decade, unknown]
        source_notes: {type: string, maxLength: 2000}

    UnitClassCreateRequest:
      type: object
      required: [id_unit_type, name]
      properties:
        id_unit_type:
          type: integer
          format: int64
          description: Resolve from `/helpers` under `unit_types`. Never hardcode an id.
        name: {type: string, minLength: 1, maxLength: 255, example: Sigma}
        id_name:
          type: string
          maxLength: 255
          description: The Indonesian label, shown alongside the canonical English name.
        role_description: {type: string, maxLength: 2000}
        note: {type: string, maxLength: 2000}
        default_turn_rate_max_deg_s:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Fallback turn rate for the class, derived from length overall and intended to be
            corrected by an operator. NULL means "not yet established", which is different
            from zero — a hull with no known rate must not be turned, and the simulation
            refuses rather than inventing a value.

    UnitClassUpdateRequest:
      type: object
      properties:
        id_unit_type: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 255}
        id_name: {type: string, maxLength: 255}
        role_description: {type: string, maxLength: 2000}
        note: {type: string, maxLength: 2000}
        default_turn_rate_max_deg_s:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true

    UnitSpecificationCreateRequest:
      type: object
      description: |
        The simulator-relevant values for a new specification version.

        `version` is deliberately absent — it is assigned by the server. The descriptive
        material (propulsion, weapons, sensors, aviation) goes in `spec`, which is an open
        object because its shape will change when the fire-simulation feature lands.

        Every numeric field is nullable and **null means unknown, not zero.**
      properties:
        loa_m: {type: number, format: float, nullable: true, minimum: 0, exclusiveMinimum: true, description: Length overall in metres.}
        beam_m: {type: number, format: float, nullable: true, minimum: 0, exclusiveMinimum: true}
        draft_m: {type: number, format: float, nullable: true, minimum: 0, exclusiveMinimum: true}
        displacement_standard_t: {type: number, format: float, nullable: true, minimum: 0}
        displacement_full_t: {type: number, format: float, nullable: true, minimum: 0}
        speed_max_surface_kn: {type: number, format: float, nullable: true, minimum: 0}
        speed_max_submerged_kn:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: |
            Only meaningful for submarines, and unknown for all four in the source data. A
            hull capable of submerged movement with this value unknown must not be moved
            submerged.
        speed_cruise_kn: {type: number, format: float, nullable: true, minimum: 0}
        range_nm: {type: number, format: float, nullable: true, minimum: 0}
        endurance_days: {type: integer, nullable: true, minimum: 0}
        crew_personnel: {type: integer, nullable: true, minimum: 0}
        embarked_personnel: {type: integer, nullable: true, minimum: 0}
        turn_rate_max_deg_s:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Omit to inherit the class default and have `turn_rate_is_derived` set true.
            Supply a value to record that a person asserted it.
        spec:
          type: object
          additionalProperties: true
          default: {}
        spec_schema_version:
          type: integer
          minimum: 1
          default: 1
        spec_source_notes: {type: string, maxLength: 2000}

    # ---------------------------------------------------------------------
    # Envelopes — explicit per response, no allOf. See the header.
    # ---------------------------------------------------------------------
    AuthEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/TokenPair'

    UserRolesUpdateRequest:
      type: object
      description: |
        The COMPLETE set of application roles the account should hold — not a delta, matching
        `ServiceBranchCategoriesRequest`.

        **An empty array is valid and revokes every role**, which is how an operator records that an
        account may sign in and do nothing. An ABSENT field is refused with `400` instead, because
        "this account holds no roles" and "I forgot the field" must not arrive looking the same — a
        forgotten field would silently strip an administrator of everything they can do.

        Role ids come from `/helpers` under `app_roles`. An id that does not exist is refused with
        `400` naming this field, **before anything is written**.
      properties:
        id_app_roles:
          type: array
          description: |
            The roles the account should hold. Repeated ids are collapsed rather than refused — the
            set they mean is unambiguous.
          items:
            type: integer
            format: int64
            minimum: 1

    UserEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UserDetail'

    UserListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    HelpersEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/HelpersResponse'

    UnitTypeSummary:
      type: object
      description: |
        A unit type together with the category it belongs to and the size of the level beneath it.

        The `category` is the whole reason `GET /unit-types` exists: it is the only surface that
        exposes the type -> category link, so Kategori is reachable from Tipe and from Kelas.
      required: [id, name, category, class_count]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        id_name: {type: string}
        description_en: {type: string}
        is_system:
          type: boolean
          description: Seeded by a migration rather than authored by an operator.
        is_judge_side: {type: boolean}
        category:
          $ref: '#/components/schemas/Helper'
        class_count:
          type: integer
          format: int32
          description: |
            How many LIVE classes sit directly under this type — the number beside the TIPE row.

            It counts the level BELOW, like the KATEGORI column's `type_count`, so a drill-down adds
            up: the numbers beside the types of one category sum to that category's `type_count`.

            **`0` is a real answer and the field is always present**, not omitted. Most seeded types
            hold no classes, and the screen draws a number on every row.

            Soft-deleted classes are excluded, unlike `type_count`. That difference is deliberate: a
            class is retired by an operator through the API, so a tombstone would otherwise be
            counted here while being absent from the class list this number leads to.

    UnitTypesEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitTypeSummary'

    UnitCategoryCreateRequest:
      type: object
      required: [name]
      description: |
        **No `note` field.** `HelperPublic` omits `note` deliberately, so a note written through this
        endpoint could never be read back — a field a client can set but cannot verify is worse than
        one it cannot set at all.

        **No `is_system` either.** That flag records that a migration wrote a row, and it is what the
        CMS disables the delete affordance on; a client able to set it could make its own row
        undeletable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique across the taxonomy. Refused with `409` if a category already uses it.
        id_name:
          type: string
          maxLength: 255
          description: The Indonesian label. This is what the taxonomy screen draws.
        description_en:
          type: string
          maxLength: 2000
          description: A long English label, for where `name` is a code rather than a word.

    UnitCategoryUpdateRequest:
      type: object
      description: |
        Every field is optional; only those present are changed, so a PATCH naming one field cannot
        blank the others.

        `name` **cannot be cleared**: an empty value is refused, and the column is NOT NULL for the
        same reason — a category with no name is a row the screen cannot draw.
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        id_name: {type: string, maxLength: 255}
        description_en: {type: string, maxLength: 2000}

    UnitCategoryEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UnitCategorySummary'

    # ---------------------------------------------------------------------
    # Retirement — the four levels of the unit taxonomy
    #
    # One operation at four depths, so one set of shapes. The four
    # `POST /<resource>/{id}/retirement` operations share these components and
    # describe only their own level.
    # ---------------------------------------------------------------------
    TaxonomyRetirement:
      type: object
      required: [level, categories, types, classes, units]
      description: |
        What a retirement changed, one number per level.

        **THE COUNTS ARE THE RECORD.** A retirement is destructive and irreversible through the API —
        there is no un-retire endpoint, and recovering a withdrawn hull means SQL — so this response is
        the only account a caller gets of how far the cascade reached. The four DELETE operations this
        replaces answered `204 No Content`, which would have been exactly the wrong shape: a caller
        asking to retire one category may have withdrawn twenty-five ships, and a status code cannot
        say so.

        **ZERO IS ALWAYS SENT, and zero is an answer rather than a missing field.** The common case is
        a leaf: eighteen of the nineteen seeded types hold no class, so retiring one reports
        `{"types":1,"classes":0,"units":0}`. A client that had to tell "nothing was beneath it" from
        "the field was absent" could not do it without knowing which level it had called.

        **THESE ARE WHAT WAS TOMBSTONED, not what the guard saw.** The guard counts only the hulls that
        could refuse the request; these count what the cascade actually did.
      properties:
        level:
          type: string
          enum: [unit_category, unit_type, unit_class, unit]
          description: |
            The level of the row the request NAMED, not the deepest level it reached. A client retiring
            a category reads `unit_category` with `units: 25` and can say "the category, and with it 25
            hulls" without having to infer which number it asked for.
          example: unit_category
        categories:
          type: integer
          format: int64
          example: 1
        types:
          type: integer
          format: int64
          example: 4
        classes:
          type: integer
          format: int64
          example: 9
        units:
          type: integer
          format: int64
          example: 25

    TaxonomyRetirementEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/TaxonomyRetirement'

    RetirementConflictResponse:
      type: object
      required: [status_code, message]
      description: |
        The error envelope with one extra machine-readable field.

        **IT HAS ITS OWN SCHEMA RATHER THAN REUSING `ErrorResponse`**, because `units_in_execution`
        belongs to THIS failure and not to the shared error shape. Declaring it on `ErrorResponse`
        would tell every generated client that any `409` in the API might carry it, which is the kind of
        vague contract the per-resource envelopes exist to avoid.
      properties:
        status_code:
          type: integer
          format: int32
        message:
          type: string
          example: Conflict occurred
        data:
          type: object
          nullable: true
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
              description: Request field name to human-readable reason.
              example:
                _request: 3 hulls in this unit category belong to an exercise that is running.
            units_in_execution:
              type: integer
              format: int64
              description: |
                How many live hulls in the subtree being retired are assigned to a game in `execution`.
                Always at least 1 on this response, because reporting the refusal is the only reason it
                is sent.
              example: 3

    UnitTypeCreateRequest:
      type: object
      required: [id_unit_category, name]
      description: |
        No `is_system` and no `note` — see `UnitCategoryCreateRequest` for both reasons.
      properties:
        id_unit_category:
          type: integer
          format: int64
          minimum: 1
          description: |
            The parent category. Resolve it from `/unit-categories`; an unknown id is refused with
            `400` naming this field rather than by the foreign key.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique across the taxonomy. Refused with `409` if a type already uses it.
        id_name: {type: string, maxLength: 255}
        description_en:
          type: string
          maxLength: 2000
          description: The English long form. `name` holds the NATO symbol, so this is where its
            meaning goes — `FFG` becomes "Guided missile frigate".

    UnitTypeUpdateRequest:
      type: object
      description: |
        Every field is optional; only those present are changed.

        **`id_unit_category` is patchable, so a type can be MOVED.** Every class under it changes
        category with it, because the category is reached through the type. Existing hulls are not
        re-checked against the ownership rule — see `PATCH /unit-types/{id}`.
      properties:
        id_unit_category: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 255}
        id_name: {type: string, maxLength: 255}
        description_en: {type: string, maxLength: 2000}

    UnitTypeEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UnitTypeSummary'

    ServiceBranchCategoriesRequest:
      type: object
      description: |
        The COMPLETE set of categories the branch should own, not a delta. The response is the same
        payload `GET /unit-categories?id_service_branch=` returns.

        **An empty array is valid and clears the set.** An ABSENT field is refused with `400`, so
        "this branch operates nothing" and "I forgot the field" cannot arrive looking the same.
      properties:
        id_unit_categories:
          type: array
          description: |
            Category ids. Resolve them from `/unit-categories`. An unknown id is refused with `400`
            naming this field, before anything is written. Repeated ids are collapsed rather than
            refused.
          items:
            type: integer
            format: int64
            minimum: 1

    UnitCategorySummary:
      type: object
      description: |
        A unit category together with the number of types DIRECTLY under it.

        The `Helper` fields are inlined rather than nested under a `category` key, unlike
        `UnitTypeSummary`: a category summary IS the lookup row plus a count, so a wrapper would add
        a level with nothing in it.

        `required` mirrors the shared `Helper` schema rather than the Go struct's exact JSON, and
        omits `is_judge_side` on purpose — adding it would tighten a schema two client teams have
        already generated against. It is always false here anyway: a category is not a role anyone
        holds.
      required: [id, name, id_name, is_system, type_count]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Artileri & Roket}
        id_name: {type: string}
        description_en: {type: string}
        is_system:
          type: boolean
          description: Seeded by a migration rather than authored by an operator.
        is_judge_side:
          type: boolean
          description: Present for uniformity with every other lookup row. Always false on this table.
        type_count:
          type: integer
          minimum: 0
          description: |
            How many TYPES sit directly in this category.

            Zero is a real answer and is always sent — several of the seeded categories hold no
            types, and the CMS draws a row for each of them. It is never omitted, because an absent
            count would be indistinguishable from one the client had failed to read.
          example: 3
      example:
        id: 1
        name: Artileri & Roket
        id_name: Artileri & Roket
        description_en: ''
        is_system: true
        is_judge_side: false
        type_count: 3

    UnitCategoriesEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitCategorySummary'

    ServiceBranchSummary:
      type: object
      description: |
        A service branch together with the number of LIVE HULLS in it.

        The `Helper` fields are inlined rather than nested, matching `UnitCategorySummary` and for
        the same reason: this IS the lookup row plus a count, so a wrapper would add a level with
        nothing in it.

        `required` mirrors the shared `Helper` schema, omitting `is_judge_side` on purpose — adding
        it would tighten a schema two client teams have already generated against. It is always
        false here anyway: a branch is not a role anyone holds.
      required: [id, name, id_name, is_system, hull_count]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Navy}
        id_name: {type: string, example: TNI Angkatan Laut}
        description_en: {type: string}
        is_system:
          type: boolean
          description: Seeded by a migration rather than authored by an operator.
        is_judge_side:
          type: boolean
          description: Present for uniformity with every other lookup row. Always false on this table.
        hull_count:
          type: integer
          minimum: 0
          description: |
            Live hulls in this branch.

            Zero is a real answer and is always sent — a branch holding nothing still gets a tab,
            and an omitted count would be indistinguishable from one the client had failed to read.
            Retired hulls are never counted.
          example: 3
      example:
        id: 1
        name: Navy
        id_name: TNI Angkatan Laut
        description_en: ''
        is_system: true
        is_judge_side: false
        hull_count: 3

    ServiceBranchListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceBranchSummary'

    UnitEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UnitDetail'

    UnitListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitSummary'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    UnitClassEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UnitClassDetail'

    UnitClassListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitClassSummary'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    UnitSpecificationListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitSpecification'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    # ---------------------------------------------------------------------
    # Games (slice 2)
    # ---------------------------------------------------------------------
    GameMode:
      type: string
      enum: [maneuver]
      description: |
        How positions are produced. See `docs/game-modes.md` for the reasoning.

        * `maneuver` — the server integrates orders over assumed time; a Commando steers by
          heading and speed, the server clamps to the hull's maximum and turns at its max rate,
          and a silent unit continues on its last order.

        An ENUM rather than a lookup table, unlike `game_roles`. A mode is not a label: it changes
        behaviour the server must implement. An operator able to add a mode from the CMS would be
        adding a mode that nothing implements.

        ## Why this enum has one value

        `operational` was here, and has been REMOVED, because it was never a mode. Real vessels
        reporting their own positions is not a variation on an exercise: it has no game, no
        participants, no state machine and no orders, so a game in that mode would do nothing. It
        arrives as a separate live-feed resource instead — a change of SHAPE, not of scope.

        `static` — a dragged board with no movement model — is deferred, and is deliberately
        absent from this enum rather than accepted and ignored.
      example: maneuver

    GameState:
      type: string
      enum: [planning, preparation, execution, closure]
      description: |
        The four states of a game, in order, forward-only.

        An enum for the same reason as `game_mode`: each transition has preconditions the server
        enforces, so a state an operator invented would be a state with no rules attached to it.

        `closure` is open only to the Game Master and Judges — participants are ejected when a
        game reaches it.
      example: planning

    GameSummary:
      type: object
      required: [id, name, mode, state, created_at]
      description: |
        One row of the game list. Deliberately NOT the detail shape, and deliberately free of
        anything withheld: a list endpoint that returned the full record would leak the game area
        to every participant regardless of state.
      properties:
        id: {type: integer, format: int64}
        name:
          type: string
          maxLength: 255
          example: Operasi Batu Malang
          description: The operation's name, used as the heading of Telegram messages.
        mode:
          $ref: '#/components/schemas/GameMode'
        state:
          $ref: '#/components/schemas/GameState'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    GameDetail:
      type: object
      required: [id, name, mode, state, created_at]
      description: |
        A game as one particular caller may see it.

        `area` and `map_tag` are returned to the Game Master and Judges at every state, and to
        participants only from `execution` onward — the concept says personnel "does not know
        where the 'Game Area' is until it is Executed". They are ABSENT rather than null for a
        caller not entitled to them, which is why both are optional here.

        Absent and null mean different things throughout this API, and they mean different things
        here too — with one simplification, because a three-state field (set / unset / withheld)
        is a shape no generator renders comfortably. Omitted therefore means EITHER withheld OR
        unset, and a client can tell which without a flag: a Game Master is never withheld, so for
        them an absent `area` simply means it has no value; a participant receives it only from
        `execution` onward, so before that its absence is the withholding itself. The client knows
        its own role and the game's state, so nothing is lost by not saying it twice.
      properties:
        id: {type: integer, format: int64}
        name:
          type: string
          maxLength: 255
          example: Operasi Batu Malang
        description:
          type: string
          maxLength: 4000
          description: Free text, defined by the Game Master.
        mode:
          $ref: '#/components/schemas/GameMode'
        state:
          $ref: '#/components/schemas/GameState'
        purpose:
          type: string
          maxLength: 4000
          description: Why the exercise is being run.
        target:
          type: string
          maxLength: 4000
          description: What it is meant to achieve.
        area:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            The general area of the exercise, as prose. NOT a geofence: the concept is explicit
            that areas may overlap and only a general description is needed. It follows that
            "moved too far from the Game Area" is a human judgement, not a geometric test.

            Withheld from participants until `execution` — absent, not null.
        map_tag:
          type: string
          maxLength: 255
          nullable: true
          description: |
            A label drawn on the map, hidden outside `execution` per the concept.
            Withheld from participants until `execution` — absent, not null.
        actual_start:
          type: string
          format: date-time
          nullable: true
          description: |
            When the exercise really begins. Real time; never scaled.
        assumed_start:
          type: string
          format: date-time
          nullable: true
          description: |
            The fictional time that corresponds to `actual_start`.
        time_factor:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            How fast assumed time advances relative to real time. A change to it affects the
            ASSUMED time only — real time is never scaled — and is logged, because a track laid
            out on one factor does not line up with one laid out on another.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by:
          type: integer
          format: int64
          nullable: true
        updated_by:
          type: integer
          format: int64
          nullable: true

    GameCreateRequest:
      type: object
      required: [name, mode]
      description: |
        The core concepts that belong on the game itself. Participants, hierarchy, units and
        scenario roles are separate resources — see `POST /games`.

        The time base is optional here so a game can be drafted before its schedule is fixed, but
        it must be set before the game can reach `execution`: a movement model with no clock
        cannot run, and a track with no assumed time cannot be replayed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Operasi Batu Malang
        mode:
          $ref: '#/components/schemas/GameMode'
        description: {type: string, maxLength: 4000}
        purpose: {type: string, maxLength: 4000}
        target: {type: string, maxLength: 4000}
        area: {type: string, maxLength: 1000}
        map_tag: {type: string, maxLength: 255}
        actual_start:
          type: string
          format: date-time
          nullable: true
        assumed_start:
          type: string
          format: date-time
          nullable: true
        time_factor:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          example: 1

    GameUpdateRequest:
      type: object
      description: |
        Every field optional; only those present are changed. Accepted only while the game is in
        `planning`.

        To clear a nullable text field, send an empty string — see the note on PATCH and nullable
        fields at the top of this document.
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 4000}
        purpose: {type: string, maxLength: 4000}
        target: {type: string, maxLength: 4000}
        area: {type: string, maxLength: 1000}
        map_tag: {type: string, maxLength: 255}
        actual_start:
          type: string
          format: date-time
          nullable: true
        assumed_start:
          type: string
          format: date-time
          nullable: true
        time_factor:
          type: number
          format: float
          nullable: true
          minimum: 0
          exclusiveMinimum: true

    GameTransitionRequest:
      type: object
      required: [to]
      description: |
        The state to move to. It must be the NEXT state: skipping a step, moving backwards, or
        moving out of `closure` is refused with 409. The permitted transitions and their
        preconditions are documented on the operation rather than here, because they are a
        property of the state machine, not of this payload.
      properties:
        to:
          $ref: '#/components/schemas/GameState'

    GameEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameDetail'

    GameListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    # ---------------------------------------------------------------------
    # Live feed
    # ---------------------------------------------------------------------

    # The requested fix. Every coordinate is REQUIRED, and `latitude` being a required number is
    # why the server treats an absent coordinate as absent rather than as zero: latitude 0 is the
    # equator, a perfectly real place, so a payload that omitted both coordinates must be refused
    # rather than accepted as a confident position in the Gulf of Guinea.
    FeedFixRequest:
      type: object
      required: [recorded_at, latitude, longitude]
      properties:
        recorded_at:
          type: string
          format: date-time
          description: |
            When the device believes it observed this fix. Whether the server keeps it or replaces
            it depends on how far it is from the server's clock — see `POST /live-feed/fixes`.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        speed_kn:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: |
            Omitted or null when the receiver cannot produce a speed — a moored vessel, or one whose
            GPS has no fix yet. Not reported as 0, which would claim the ship is stationary rather
            than that nobody knows.
        course_deg:
          type: number
          format: double
          minimum: 0
          maximum: 360
          exclusiveMaximum: true
          nullable: true
          description: |
            True degrees, 0 to less than 360. Null when the vessel is not making way: a stopped ship
            has no heading that means anything, and 0 would read as due north.
        accuracy_m:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: The receiver's own reported accuracy, when it has one.

    FeedIngestRequest:
      type: object
      required: [id_unit, fixes]
      properties:
        id_unit:
          type: integer
          format: int64
          minimum: 1
          description: |
            The vessel this batch is about. Named explicitly rather than inferred from the caller's
            command, so that the endpoint can serve a user commanding two vessels and a replay of a
            backlog whose vessel has since been handed over. The app learns its own id from
            `GET /live-feed/me`.
        device_id:
          type: string
          maxLength: 128
          nullable: true
          description: |
            The handset. Per **request**, not per fix: one batch comes from one device, and letting
            it vary within a batch would let a single request describe two — which is exactly the
            continuity question this field exists to answer.
        fixes:
          type: array
          minItems: 1
          maxItems: 60
          description: |
            Oldest first or newest first, either is accepted — the server picks the newest by
            `recorded_at`. Capped at 60 because an unbounded batch is an unbounded transaction; at
            the one-second reporting ceiling a full batch is a minute of backlog.
          items:
            $ref: '#/components/schemas/FeedFixRequest'

    FeedIngestResult:
      type: object
      required: [accepted, rejected]
      properties:
        accepted:
          type: integer
          format: int32
          minimum: 0
          description: Fixes stored. Appended to the log, and the newest of them became the latest position.
        rejected:
          type: integer
          format: int32
          minimum: 0
          description: |
            Fixes refused. The only reason is age — beyond the retention window — and it is
            permanent, so there is nothing for the client to retry and no field for it to correct.

    FeedIngestEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/FeedIngestResult'

    # A fix as the server holds it. Two fields are DERIVED rather than stored, because a stored copy
    # of a computable value is a second source of truth that can disagree with what it describes.
    FeedFix:
      type: object
      required: [latitude, longitude, recorded_at, received_at, age_seconds, backfilled]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        speed_kn:
          type: number
          format: double
          nullable: true
        course_deg:
          type: number
          format: double
          nullable: true
        accuracy_m:
          type: number
          format: double
          nullable: true
        recorded_at:
          type: string
          format: date-time
          description: |
            Replaced with the server's clock when the report was live, kept as sent when it was a
            backfill.
        received_at:
          type: string
          format: date-time
          description: When the server accepted it. Always the server's clock.
        age_seconds:
          type: number
          format: double
          description: |
            How long ago the fix was recorded, measured against the server's clock at response time
            and never negative.

            Sent because the client cannot compute it reliably — it would have to trust its own
            clock against the server's timestamps, and on these machines those differ. The
            FRESHNESS THRESHOLD is still the client's decision: the server says how old the fix is
            and lets the renderer decide what counts as fresh.
        backfilled:
          type: boolean
          description: |
            Derived from the gap between `recorded_at` and `received_at`: true when the point was
            reconstructed from an offline backlog rather than received live. A live fix is never
            backfilled, because the server stamps it.

    FeedPosition:
      type: object
      required: [id_unit, name]
      properties:
        id_unit:
          type: integer
          format: int64
        name:
          type: string
        hull_number:
          type: string
          nullable: true
        # ABSENT when the vessel has never reported — absent rather than a zeroed position, because
        # latitude 0 longitude 0 is a real place and drawing every quiet ship there is worse than
        # drawing nothing. The vessel itself is still listed, because a ship missing from the list
        # is indistinguishable from one that does not exist.
        #
        # A plain $ref with no allOf wrapper: `position` is not in `required`, which is what makes
        # it omittable. An allOf exists only to attach siblings to a ref, and a generated client
        # types the two differently for no gain.
        position:
          $ref: '#/components/schemas/FeedFix'

    FeedPositionEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/FeedPosition'

    FeedPositionListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeedPosition'

    FeedIdentity:
      type: object
      required: [id_unit, name, since]
      properties:
        id_unit:
          type: integer
          format: int64
        name:
          type: string
        hull_number:
          type: string
          nullable: true
        since:
          type: string
          format: date-time
          description: When the caller's command of this vessel began.

    FeedIdentityResult:
      type: object
      required: [units]
      description: |
        An object rather than a bare array even though `units` is all of it today. Sent as `[]` the
        shape could never gain a sibling field without becoming an object, and that change would
        break every installed client at once — the update has to reach each handset before the
        server can move.

        `units` is `[]` for an uncommanded caller, never `null`, so a client never has to null-check
        a collection before iterating it.
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/FeedIdentity'

    FeedIdentityEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/FeedIdentityResult'

    UnitCommanderAssignRequest:
      type: object
      required: [id_user]
      properties:
        id_user:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
          maxLength: 2000
          description: |
            Free text and optional. A hand-over is how a discontinuity enters the track, so
            recording WHY is worth a field even when nobody is required to use it.

    UnitCommanderSummary:
      type: object
      required: [id_unit, id_user, user_name, from_at, assigned_by, note]
      properties:
        id_unit:
          type: integer
          format: int64
        id_user:
          type: integer
          format: int64
        user_name:
          type: string
        from_at:
          type: string
          format: date-time
        to_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Absent while the assignment is open. **The current commander is the entry with no
            `to_at`** — there is no separate "current" endpoint, so ordering and currency can never
            disagree.
        assigned_by:
          type: integer
          format: int64
          description: The user who made the assignment.
        note:
          type: string

    UnitCommanderEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/UnitCommanderSummary'

    UnitCommanderListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitCommanderSummary'

    # ---------------------------------------------------------------------
    # Game participants
    # ---------------------------------------------------------------------
    GameRoleCreateRequest:
      type: object
      required: [name]
      description: |
        The POST body for a game role.

        No `note`: it is never returned, so a field a client could set but not read back would be
        worse than one it cannot set at all.

        No `is_system`: the flag is ENFORCED on delete, so a client able to set it could author a row
        it could never remove.
      properties:
        name: {type: string, minLength: 1, maxLength: 255, example: Referee}
        id_name: {type: string, maxLength: 255, example: Wasit}
        description_en: {type: string, maxLength: 2000, example: Assesses performance and gives points}
        is_judge_side:
          type: boolean
          default: false
          description: |
            Whether a holder is EXCLUDED from the readiness gate at Preparation.

            The default is `false`, which means the role MUST declare itself ready — so a judge-side
            role has to say so explicitly. There is no way to infer it from the name: `Referee` reads
            like the judge side and `Assessor` does not, and both are.

    GameRoleUpdateRequest:
      type: object
      description: |
        The PATCH body. Every field is optional; absent means "leave it alone".

        `is_judge_side` is nullable so that "not mentioned" and "set to false" stay distinguishable —
        without that, a role could be promoted across the judge boundary but never demoted.
      properties:
        name: {type: string, nullable: true, minLength: 1, maxLength: 255}
        id_name: {type: string, nullable: true, maxLength: 255}
        description_en: {type: string, nullable: true, maxLength: 2000}
        is_judge_side:
          type: boolean
          nullable: true
          description: |
            `true` excludes the role's holders from the readiness gate; `false` requires them to
            declare ready. Omit to leave the current value alone.

    GameRolePermission:
      type: object
      required: [object, action]
      description: |
        One grant: what a game role may do, and to which resource family.

        **THE ENUMS BELOW ARE THE NAMESPACE, AND WHAT THE SERVER ACCEPTS IS A PAIR — NARROWER THAN
        EITHER.** Corrected 2026-09-22. This said "both enums are enforced" and "a grant that no route
        ever asks for is the failure this contract exists to prevent, not a harmless extra row". The
        second sentence was right and the enum did not obey it: six of the objects and seven of the
        actions below are asked for by no route, and a grant naming one of them was ACCEPTED and then
        governed nothing.

        The accepted pairs are these, and nothing else:

        | object | actions |
        |---|---|
        | `/games/participants` | `read`, `update` |
        | `/games/units` | `read`, `update` |
        | `/games/hierarchy` | `read`, `update` |
        | `/games/transitions` | `transition` |

        A pair outside that list is refused with `400` naming the offending field — including a pair
        whose two halves are individually valid, such as `read` on `/games/transitions`. **Offer only
        the pairs above.** The rest of the vocabulary belongs to Execution features that are not served
        yet (messaging, judgements, warnings, simulated events — concept §3) and to the closure phase.

        A pair constraint cannot be expressed by an enum on each field, which is why the rule is
        prose. Both enums remain wider than the accepted pairs on purpose: they describe what a game
        role's policy may ever NAME, which is what the reconciliation sweeps, and a client should read
        the table rather than the enums when deciding what to draw.
      properties:
        object:
          type: string
          enum:
            - /games/participants
            - /games/units
            - /games/hierarchy
            - /games/messages
            - /games/judgements
            - /games/timeline
            - /games/review
            - /games/control
            - /games/transitions
            - /games/*
          description: |
            A GAME resource. Anything outside `/games/` is refused: a game role's policies carry the
            wildcard domain, so the object is the only barrier between a game role and the
            application surface.

            `/games/hierarchy` was missing from this enum until 2026-09-22 while the server accepted
            it — `/games/hierarchy` became a grantable object on 2026-09-21 (see B14) and this list
            was not updated, so a client generated from this document refused a grant the server
            takes. The table above is the authority on what is accepted.

            `/games/*` covers every resource inside a game at once, for a supervisor role.
        action:
          type: string
          enum: [read, update, order, judge, send_message, pause, change_factor, warn, own, transition]
          description: |
            `create` and `delete` are absent deliberately — a participant is added to a game by
            UPDATING its roster, so neither would ever be checked.

            `order` (steer a unit) and `judge` (score one) are separate verbs rather than `update`,
            because a Judge who may assess an exercise must not therefore be able to steer a ship in
            it.

            Of these ten, only `read`, `update` and `transition` appear in an accepted pair today.
            The others are named by no route — `order`, `pause` and `change_factor` have routes that
            deliberately check the caller's INSTANCE authority in the service instead, because a
            Casbin object carries no unit or game id.

    GameRolePermissionsUpdateRequest:
      type: object
      description: |
        The PUT body: the role's WHOLE matrix, replacing whatever it held.
      properties:
        permissions:
          type: array
          description: |
            The complete set. Send `[]` to revoke every permission — a valid request, not an error.

            OMITTING the field is refused with `400`, so that "I forgot" cannot be read as "revoke
            everything".
          items:
            $ref: '#/components/schemas/GameRolePermission'

    GameRolePermissionsEnvelope:
      type: object
      properties:
        status_code: {type: integer, example: 200}
        message: {type: string, example: Successfull}
        data:
          $ref: '#/components/schemas/GameRolePermissions'

    GameRolePermissions:
      type: object
      required: [id_game_role, role, permissions]
      properties:
        id_game_role: {type: integer, format: int64}
        role:
          type: string
          description: The role's name, echoed so a client can label the screen without a second call.
        permissions:
          type: array
          description: Never null. An empty array is a role that may do nothing.
          items:
            $ref: '#/components/schemas/GameRolePermission'

    GameRoleEnvelope:
      type: object
      properties:
        status_code: {type: integer, example: 200}
        message: {type: string, example: Successfull}
        data:
          $ref: '#/components/schemas/Helper'

    GameRolesEnvelope:
      type: object
      properties:
        status_code: {type: integer, example: 200}
        message: {type: string, example: Successfull}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Helper'

    GameParticipantAddRequest:
      type: object
      required: [id_user, id_game_role]
      properties:
        id_user:
          type: integer
          format: int64
          minimum: 1
        id_game_role:
          type: integer
          format: int64
          minimum: 1
          description: |
            An id from the `game_roles` lookup, which is the authority on `is_judge_side` — and
            that flag decides whether the holder is asked to press Ready, so it is not a display
            concern the client can be trusted to derive from a name.

            An ID rather than a name: a name that resolved to nothing would have to be refused at
            the point where the client believed it had said something valid.

    GameParticipantRoleRequest:
      type: object
      required: [id_game_role]
      description: |
        A new role for an existing participant. Changing it CLEARS readiness — the declaration is
        about the role held, and a Commando's "I am ready to command" is not what a Referee says.
      properties:
        id_game_role:
          type: integer
          format: int64
          minimum: 1

    GameJoinRequest:
      type: object
      required: [room_key]
      properties:
        room_key:
          type: string
          minLength: 16
          maxLength: 64
          description: |
            The only field. The client does not know the game id yet — finding it is what this call
            is for — so requiring one would make joining impossible for the one client that needs
            it.

            Case-sensitive, and any separators a client chooses to DISPLAY are presentation only:
            the value that works is exactly the 24 uppercase hexadecimal characters the server
            issued. A key sent with punctuation in it is told the room does not exist, rather than
            silently matching a different one.

    GameParticipantSummary:
      type: object
      required: [id_user, user_name, id_game_role, role_name, is_judge_side, is_ready]
      properties:
        id_user:
          type: integer
          format: int64
        user_name:
          type: string
        id_game_role:
          type: integer
          format: int64
        role_name:
          type: string
          example: Referee
          description: |
            The canonical English value from the lookup. Display `id_name` from `/helpers` for the
            Indonesian label — the two are not interchangeable, and this is the one used in
            comparisons.
        is_judge_side:
          type: boolean
          description: |
            Whether this participant is EXEMPT from the readiness gate — and sent as a flag rather
            than left for the client to infer from `role_name`.

            A client comparing `role_name` against a literal would break the first time an operator
            renamed Wasit, and it would break silently: the Ready button would simply stop
            appearing for the people who need it. The flag is stored on the lookup row precisely so
            that a rename cannot change behaviour, and it is exposed here because a rule the client
            renders has to be visible to it.
        is_ready:
          type: boolean
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the participant declared readiness. Present exactly when `is_ready` is true — the
            two are one fact and the database refuses a row where they disagree.
        joined_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the participant presented the room key, or ABSENT if they are assigned but have
            not entered the room yet.

            Absent rather than a zero timestamp, because year 1 sorts before the exercise and a
            client rendering it would show somebody arriving in the year zero. That absence is the
            one an operator is looking for when a game will not advance.

            A participant who joins twice keeps the FIRST moment: the field answers "when did they
            arrive", and answering it with a reconnection would erase the fact that they were late.

    GameJoinResult:
      type: object
      required: [game, participant, commanded_units]
      description: |
        Both halves, because a client needs both to draw anything: the game says what it has
        entered, and the participant row says what it may DO there — its role, whether the gate
        applies to it, and whether it has already declared.
      properties:
        game:
          $ref: '#/components/schemas/GameDetail'
        participant:
          $ref: '#/components/schemas/GameParticipantSummary'
        commanded_units:
          type: array
          description: |
            What the caller may STEER — their own pieces, and nobody else's.

            The reason this call carries them at all is that otherwise a Commando has no way to learn
            which hull they command. The roster route is staff-only, and the unit id would have to be
            told to the handset out of band — read off a whiteboard and typed in, which is a step that
            is wrong exactly once and then silently wrong forever. One request now answers "which game
            am I in", "what am I here", and "what can I move".

            ONLY the caller's own, not the force: `GET /games/{id}/units` is the staff view of the
            whole order of battle, and returning it here would leak through the back door exactly what
            that route's permission refuses at the front. Knowing the other side's order of battle
            before the exercise starts is most of the exercise.

            `[]` rather than `null` for a participant who commands nothing, so no client has to
            null-check before iterating.
          items:
            $ref: '#/components/schemas/GameUnitSummary'

    GameUnitAssignRequest:
      type: object
      required: [id_unit, id_commander]
      properties:
        id_unit:
          type: integer
          format: int64
          minimum: 1
          description: The hull, from the fleet register.
        id_commander:
          type: integer
          format: int64
          minimum: 1
          description: |
            REQUIRED, and that is the rule rather than a convenience: concept `[1.7]` defines a game
            piece as one "commanded by the Commando assigned to it", so a hull with nobody to steer it
            is not a piece and there is no state in which it is in a game uncommanded.

            The user must already hold a place in this game, and must not be on the judge side.
        note:
          type: string
          maxLength: 2000
          description: Free text. Why THIS hull is in THIS exercise is worth a field.

    GameUnitUpdateRequest:
      type: object
      required: [id_commander]
      properties:
        id_commander:
          type: integer
          format: int64
          minimum: 1
          description: |
            Required, because a piece always has a commander — so "change the commander" is the only
            edit that exists. A hand-over is one request rather than a clear and a set, because there
            is no state in between to be in.
        note:
          type: string
          maxLength: 2000

    GameUnitSummary:
      type: object
      required: [id_unit, unit_name, unit_class_name, id_commander, commander_name, note]
      description: One hull in one exercise.
      properties:
        id_unit:
          type: integer
          format: int64
          description: The hull's own id. The path for changing or removing a piece uses this.
        unit_name:
          type: string
          example: KRI Ahmad Yani
        hull_number:
          type: string
          nullable: true
          description: Absent for the hulls the source register lists without one.
        unit_class_name:
          type: string
          example: Ahmad Yani / Van Speijk
        id_commander:
          type: integer
          format: int64
        commander_name:
          type: string
        id_hierarchy_node:
          type: integer
          format: int64
          description: |
            Where this hull sits in the game's task organisation, or ABSENT when it is in the exercise
            but not yet placed. The two are separable acts: putting a hull in the game is a statement
            about the exercise, and saying where it sits is a statement about the plan.

            This is the field a client groups icons by, and the only thing tying a hull to a node in
            `GET /games/{id}/hierarchy`.
        note:
          type: string

    GameUnitListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameUnitSummary'

    GameUnitPlacementRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: |
            Degrees north of the equator; negative is south.

            **REQUIRED EVEN THOUGH 0 IS VALID.** JSON Schema's `required` means the property must be
            PRESENT, which is exactly the distinction that matters here: an absent latitude is an
            error, while a latitude of 0 is a real place. Indonesia straddles the equator, so the
            difference is not academic.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: |
            Degrees east of Greenwich; negative is west. Required for the same reason, and 0 — the
            prime meridian — is likewise a real place rather than an absence.

    GameUnitPlacement:
      type: object
      required: [id_unit, latitude, longitude, updated_at, updated_by]
      properties:
        id_unit: {type: integer, format: int64}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        updated_at: {type: string, format: date-time}
        updated_by:
          type: integer
          format: int64
          description: |
            Who placed this hull. Carried because the interesting position is the wrong one, and
            "wrong" is a question about a person and a moment.

    GamePlacementList:
      type: object
      required: [placements, placed, unplaced, ready]
      properties:
        placements:
          type: array
          description: |
            Ordered by hull. **No unit name**, deliberately: the pieces list is the authority on which
            hulls are in the exercise and what they are called, and a second name here would be a
            second source for one fact. Join on `id_unit`.
          items:
            $ref: '#/components/schemas/GameUnitPlacement'
        placed:
          type: integer
          description: How many hulls have a position — the length of `placements`.
        unplaced:
          type: integer
          format: int64
          description: |
            How many hulls in the exercise have none. Counted over the FORCE, not subtracted from the
            list: a hull released from the exercise takes its placement with it, so the two agree only
            when every hull is accounted for.
        ready:
          type: boolean
          description: |
            Whether every piece has a position — the placement half of the condition on leaving
            `preparation`. **Not** "the game can start": the gate also requires a non-empty force, at
            least one participant on the exercise side, and everyone on it declared ready.

    GamePlacementListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GamePlacementList'

    GameTimeFactorRequest:
      type: object
      required: [time_factor]
      properties:
        time_factor:
          type: number
          format: double
          exclusiveMinimum: 0
          description: |
            The rate the scenario clock runs at, as a multiple of real time. Must be greater than
            zero: **zero is not a rate, it is a pause**, and a pause is its own endpoint with its own
            history entry. There is no upper bound.

    GameClockSegment:
      type: object
      required: [factor, effective_from, source]
      properties:
        factor:
          type: number
          format: double
          description: |
            The EFFECTIVE rate in force from `effective_from` — zero while paused. Not a delta, and
            not the rate the Game Master typed: `source` is what tells the two apart.
        effective_from:
          type: string
          format: date-time
          description: |
            An ACTUAL-time instant, not an assumed one. It bounds a term of the integral that
            computes assumed time, and that integral is taken over real elapsed time.
        source:
          type: string
          enum: [start, gm, pause, resume]
          description: |
            `start` is the opening segment the transition writes, `gm` a rate the Game Master chose,
            and `pause`/`resume` the pair a pause produces. The distinction is what stops the history
            overstating how often the factor was changed — a pause writes a segment nobody typed.

    GameClock:
      type: object
      required: [state, time_factor, accepting_actions, running, segments]
      properties:
        state: {type: string, enum: [planning, preparation, execution, closure]}
        actual_start:
          type: string
          format: date-time
          nullable: true
          description: The real instant the assault clock was pinned to the assumed one.
        assumed_start:
          type: string
          format: date-time
          nullable: true
          description: The scenario instant that corresponded to `actual_start`.
        assumed_now:
          type: string
          format: date-time
          nullable: true
          description: |
            The scenario instant corresponding to the moment this response was built.

            **COMPUTED ON THE SERVER, and that is the main reason this endpoint exists.** It is a
            piecewise integral over `segments`, so a client recomputing it would need every segment
            plus the anchor plus an agreement about truncation — three chances to disagree with the
            server about what time it is in the exercise. The figure a handset shows and the figure
            the server stamps on a fix have to be the same figure.

            Absent for a game whose clock is not anchored. Absent rather than null-or-zero: the zero
            instant is a real moment in the assumed timeline, and drawing a clock face at it would
            be inventing one.
        time_factor:
          type: number
          format: double
          description: |
            The rate the Game Master has chosen. **While paused this is the rate the exercise will
            RESUME at, not the rate in force** — see `running`.
        accepting_actions:
          type: boolean
          description: |
            Whether an ORDER will be applied at all. Not the same as `running`: a communications
            blackout is a game that is running with this false, and that state is deliberate — time
            passes while nobody may steer.
        running:
          type: boolean
          description: |
            Whether the scenario clock is advancing — the last segment's rate being non-zero.

            Deliberately separate from `accepting_actions`, because they can differ and the
            difference is meaningful. A series with no segments reports false, which is the honest
            answer for a clock whose rate has never been recorded.
        segments:
          type: array
          description: The rate history, oldest first — the order the integral requires.
          items:
            $ref: '#/components/schemas/GameClockSegment'

    GameClockEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameClock'

    GameOrderRequest:
      type: object
      required: [heading_deg, speed_kn]
      properties:
        heading_deg:
          type: number
          format: double
          minimum: 0
          exclusiveMaximum: 360
          description: |
            Degrees clockwise from true north. **Required even though 0 is valid**: 0 is due north,
            which is the most likely heading in any exercise, and an absent field must not be
            silently steam-north.
        speed_kn:
          type: number
          format: double
          minimum: 0
          description: |
            The speed asked for, in knots. Zero is an order to stop, not an absence of one.

            **This is what the caller WANTS, not what the hull will do** — the recorded
            `speed_kn` may be lower, and `requested_speed_kn` on the response carries this value only
            when that happened.

    GameFixRecord:
      type: object
      required: [id_unit, assumed_time, latitude, longitude, heading_deg, speed_kn, clamped]
      properties:
        id_unit: {type: integer, format: int64}
        assumed_time:
          type: string
          format: date-time
          description: |
            The SCENARIO instant the leg begins — never the wall clock, and routinely hours or days
            away from it.
        latitude:
          type: number
          format: double
          description: |
            Where the hull HAD GOT TO when the order arrived, derived from the previous leg and the
            elapsed assumed time. Returned so the Commando can see the point their ship had reached,
            which is the only confirmation that the order landed where the clock actually was.
        longitude: {type: number, format: double}
        heading_deg:
          type: number
          format: double
          description: What the hull will do from `assumed_time` until the next order.
        speed_kn:
          type: number
          format: double
          description: The speed that will actually be run — the requested speed, or the hull's maximum if it had to be reduced.
        requested_speed_kn:
          type: number
          format: double
          nullable: true
          description: |
            Present **only** when the order was reduced, and then it carries what was asked for. Its
            absence is the record that the order was honoured as given — there is no separate flag
            column, because the two values already answer the question.
        clamped:
          type: boolean
          description: The same fact as above, said in a form a client can branch on without testing a field for absence.
        created_at: {type: string, format: date-time}
        created_by:
          type: integer
          format: int64
          description: |
            The Commando who gave the order, or — for a materialised origin — the Game Master who
            placed the hull. One column, because both mean "who authored this leg".

    GameFixRecordEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameFixRecord'

    GameHullPosition:
      type: object
      required: [id_unit, latitude, longitude, heading_deg, speed_kn, assumed_time]
      properties:
        id_unit: {type: integer, format: int64}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        heading_deg:
          type: number
          format: double
          description: |
            The heading of the leg IN FORCE at the instant asked about — what the hull was ordered to
            do, not what it is measured to be doing.
        speed_kn:
          type: number
          format: double
          description: The speed of the leg in force, which is the clamped speed rather than the one the Commando asked for.
        assumed_time:
          type: string
          format: date-time
          description: |
            The stamp of the leg in force, **not** the instant asked about. The two differ whenever
            the hull is between orders, which is nearly always — and the leg's own age cannot be
            recovered from the query instant alone.
        distance_m:
          type: number
          format: double
          nullable: true
          description: |
            Great-circle distance from the observer, in **metres** — the canonical unit. The client
            formats into nm, yards or km as its display needs (`1 nm = 1852 m` exactly).

            Present only when `from_unit` was given. Zero for the observer itself.
        bearing_deg:
          type: number
          format: double
          nullable: true
          description: |
            Initial true bearing from the observer, in [0, 360).

            **GREAT-CIRCLE, NOT RHUMB** — this is "which compass number do I point at", and the two
            differ everywhere except on a meridian or the equator. It is also **not symmetric**: the
            bearing back is not this plus 180, because meridians converge.

            **ABSENT for the observer itself** and for any hull at exactly the same coordinates: an
            azimuth between coincident points does not exist, and reporting 0 would say "due north" — a
            fabrication that looks like a reading.

            A great circle between two points at the same latitude bulges toward the pole of the
            hemisphere they are in, so an eastbound bearing at 6 S comes out just OVER 90 and at 6 N
            just UNDER it.
        relative_bearing_deg:
          type: number
          format: double
          nullable: true
          description: |
            `bearing_deg` measured from the observer's own heading — the heading of the leg in force,
            not anything the client supplies. Positive is starboard (`Kanan`), negative is port
            (`Kiri`), in **[-180, 180)** — dead astern is -180.

            Absent wherever `bearing_deg` is, and for the same reason.

    GamePositionList:
      type: object
      required: [assumed_time, positions]
      properties:
        assumed_time:
          type: string
          format: date-time
          description: |
            The instant the answer is FOR, echoed back. This is the one thing a client cannot
            reconstruct: when `at` is omitted it did not know what `now` was on the scenario clock, and
            a timeline needs to be labelled.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/GameHullPosition'
        from_unit:
          type: integer
          format: int64
          nullable: true
          description: |
            Echoes the observer whose measures are on every position, absent for a plain position read.
            Echoed so a response is self-describing: the same list means different things depending on
            whether the measures are present or simply not asked for.

    GamePositionListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GamePositionList'

    GameParticipantListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameParticipantSummary'

    GameJoinEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameJoinResult'

    UnitHierarchySummary:
      type: object
      required: [id, name, id_name, echelon_rank, is_system, note]
      description: One echelon — one level of task organisation, in order.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Gugus
          description: |
            The Indonesian term, because there is no English equivalent to translate to. Code compares
            `echelon_rank` and never this string, so a label an operator corrects cannot break a rule.
        id_name:
          type: string
        description_en:
          type: string
        echelon_rank:
          type: integer
          description: |
            The level's POSITION, lowest being 1. Not an index into the array: deleting a level leaves
            its position empty rather than renumbering the levels above it, so ranks may be
            1, 2, 3, 5.
        is_system:
          type: boolean
          description: |
            True for the levels the migration seeded, which the CMS should not offer to delete.
            Removing them would leave a system whose vocabulary is a blank page.
        note:
          type: string

    UnitHierarchyListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnitHierarchySummary'

    UnitHierarchyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        id_name:
          type: string
          maxLength: 255
        description_en:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
        insert_after_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            The level the new one ranks DIRECTLY ABOVE, so one field expresses every position:

            | value | result |
            |---|---|
            | omitted | the new level becomes the LOWEST, below everything |
            | any id | the new level sits immediately above that level |
            | the highest level's id | the new level becomes the HIGHEST |

            400 if it names a level that does not exist — there is deliberately no fallback, because
            a client holding a stale list would otherwise renumber the whole vocabulary by accident.

    UnitHierarchyUpdateRequest:
      type: object
      description: |
        Every field optional; an absent one is left alone and an explicit empty string clears it.
        The POSITION is deliberately absent — renaming cannot invalidate a task organisation, and
        moving a level within the vocabulary can.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        id_name:
          type: string
          maxLength: 255
        description_en:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000

    GameHierarchyNodeSummary:
      type: object
      required: [id, id_unit_hierarchy, echelon_name, echelon_rank, name, icon, note, children]
      description: |
        One node of a game's task organisation. RECURSIVE — `children` holds nodes of this same shape,
        so the response for a game is a FOREST of these, one entry per root.
      properties:
        id:
          type: integer
          format: int64
        id_unit_hierarchy:
          type: integer
          format: int64
          description: The echelon this node sits at, from `/hierarchy`.
        echelon_name:
          type: string
          example: Gugus
        echelon_rank:
          type: integer
          description: |
            The echelon's position, lowest being 1 — which way is up. It is also what the server
            compares when refusing a parent that ranks below its child, so a client that receives a
            tree can see that the rule held.
        parent_id:
          type: integer
          format: int64
          description: |
            Absent for a root. Its presence is what tells a client the node is nested — a game may
            hold several trees, so a root is a normal way to start one rather than a node whose
            parent is missing.
        name:
          type: string
        icon:
          type: string
          description: |
            A symbol name from a tactical palette, or empty when none was chosen. NOT a URL and not an
            upload: the Flutter handset and the Rust command centre both draw it, so what they have to
            agree on is what a symbol MEANS. This is the field the zoom-grouping is for — a collapsed
            node is drawn with the icon of the level the operator has climbed to.
        note:
          type: string
        children:
          type: array
          description: |
            ALWAYS an array, empty for a leaf. A null would make every client write the same nil
            check, and the failure of forgetting it is a crash on exactly the nodes that cannot have
            children.
          items:
            $ref: '#/components/schemas/GameHierarchyNodeSummary'

    GameHierarchyTreeEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          description: |
            The ROOTS of the game's forest, highest level first, each with its subtree nested. More
            than one entry is normal: concept `[3.2]` puts the friendly task groups and the opposing
            force in separate trees of the same exercise.
          items:
            $ref: '#/components/schemas/GameHierarchyNodeSummary'

    GameHierarchyNodeCreateRequest:
      type: object
      required: [id_unit_hierarchy, name]
      properties:
        id_unit_hierarchy:
          type: integer
          format: int64
          minimum: 1
          description: |
            The echelon, from `/hierarchy`. Must rank BELOW the parent's echelon — a parent sits at a
            higher level than its child — which is checked here because a CHECK constraint cannot
            compare two rows of another table. 400 otherwise.
        parent_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            The node this one reports to, or absent for a root. The parent must be in THIS game; the
            database enforces that through a composite foreign key as well as the check here.
        name:
          type: string
          minLength: 1
          maxLength: 255
        icon:
          type: string
          maxLength: 64
          description: A symbol name from a tactical palette. Empty means none was chosen.
        note:
          type: string
          maxLength: 2000

    GameHierarchyNodeUpdateRequest:
      type: object
      description: |
        Cosmetic only — a rename, an icon, a note. Every field optional, and an empty string clears.
        Re-parenting is a different act with validations this request has no room for, and it has its
        own routes so neither can happen by accident while doing the other.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        icon:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 2000

    GameHierarchyNodeMoveRequest:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Required. Making a node a ROOT is a different intent from moving it under something, and
            that is the DELETE on this node's `/parent` path.

            400 in three ways, and the message says which: a parent at or below the node's own level;
            a parent inside the node's OWN subtree, which would make a ring no read could finish; and
            a parent that is not in this game.
          example: 12

    GameUnitPlaceRequest:
      type: object
      required: [id_hierarchy_node]
      properties:
        id_hierarchy_node:
          type: integer
          format: int64
          minimum: 1
          description: |
            The node, from `GET /games/{id}/hierarchy`. It must be in THIS game — the database
            enforces that through a composite foreign key as well as the check here — and 400 names
            this field otherwise.

    # ---------------------------------------------------------------------
    # Messaging (concept §3 item 3, [6] and [7])
    # ---------------------------------------------------------------------
    MessageKind:
      type: string
      enum: [telegram, administrative]
      description: |
        Concept `[6]`'s two kinds of message, and there are exactly two.

        | kind | what it is | who sends it |
        |---|---|---|
        | `telegram` | `[6.1]` — "used to sent News between Personnels or Actor" | any participant; the Game Master and the Judges only **as a scenario role** |
        | `administrative` | `[6.2]` — "used between Judges and Game Master" | the Game Master and the Judges only |

        **A CLOSED SET RATHER THAN A LOOKUP TABLE**, unlike `Jenis` and `Derajat` below. These two are
        in the concept, not in the client's data, and neither can be renamed without changing what the
        concept says — which is the test for whether vocabulary belongs in the product or in a lookup.

    MessageClassificationValue:
      type: string
      enum: [TERBUKA, TERBATAS, RAHASIA]
      description: |
        The markings in force, and the gate on who may read a message.

        | value | readable by |
        |---|---|
        | `TERBUKA` | every game participant, when `to` and `cc` are both omitted (A2) |
        | `TERBATAS` | the addressed recipients only |
        | `RAHASIA` | the addressed recipients only (A1) |

        **`SANGAT_RAHASIA` IS DELIBERATELY ABSENT.** The client held it back for a future update on
        2026-09-22, so this enum has three values and the database has three values. Shipping a fourth
        would mean a border colour determined by nothing — see `border_color` — and a client drawing a
        marking whose rule has not been decided. Adding it later is a migration that also decides its
        colour.

        **THIS IS NOT THE UNIT TAXONOMY'S "CLASSIFICATION"** (`/system/classifications`, the hull's
        category). The two only share a word.

    GameMessageClassification:
      type: object
      required: [code, label, border_color]
      description: |
        The marking **and the colour to draw it in**, because `[7.12]` requires the message content to
        be "encased in a border that changes color depending on the Classification. Red for Classifed
        (Rahasia) and Black for the other".

        **THE SERVER OWNS THE COLOUR AND THE CLIENT DOES NOT**, which the client asked for on
        2026-09-22 after Flutter reported that it does not render the border. The requirement has one
        right answer and two consumers: with the mapping in each client, the command centre and the
        handset can disagree about the same message, and a Judge looking at a black border beside a
        Commando's red one has no way to tell which is correct. Serving it also means a rule nobody
        implemented cannot be silently skipped.

        **APPLY `border_color` AS GIVEN. DO NOT PARSE IT, AND DO NOT DERIVE ONE FROM `code`.**
      properties:
        code:
          $ref: '#/components/schemas/MessageClassificationValue'
        label:
          type: string
          example: Rahasia
          description: |
            The printed name of the marking. `code` is the machine value and this is what a form
            displays; they are the same word in different case today, which is exactly why they are
            separate fields — the day the marking needs a translated or abbreviated form, a client
            printing `code` is wrong on screen and right in the audit trail.
        border_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#FF0000'
          description: |
            A six-digit hex colour to draw the message content's border in. `RAHASIA` is `#FF0000` and
            the other two are `#000000`, which is the literal reading of `[7.12]`.

            **NAMED FOR WHAT IT DECORATES** rather than for the colour itself, so a client cannot
            mistake it for the message's text colour or for a map marker.

    GameMessageAuthor:
      type: object
      required: [id, username, name]
      description: |
        The person who actually wrote a message. Present only for a caller entitled to it — see
        `GameMessageSender`.
      properties:
        id: {type: integer, format: int64}
        username: {type: string, example: superuser}
        name: {type: string, example: Rehearsal Game Master}

    GameMessageAssumedRole:
      type: object
      required: [id, name]
      description: |
        The identity a message was sent under — concept `[1.12]`'s Scenario Role, "eg. Panglima TNI".

        **NOT A `Helper`.** A scenario role is not a row of a lookup table, and marshalling it as one
        would emit `id_name`, `is_system` and `is_judge_side`, three fields that are meaningless here
        and that a client would reasonably try to render.
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Panglima TNI}

    GameMessageSender:
      type: object
      description: |
        Who a message appears to come from, and — for some callers — who it really came from.

        | caller | `assumed_role` | `author` |
        |---|---|---|
        | an ordinary recipient, when an identity was assumed | present | **omitted** (Q13) |
        | the Game Master and the Judges, when an identity was assumed | present | present (F5) |
        | the sender themselves | present | present |
        | anybody, when **no** identity was assumed | omitted | present |

        **`author` IS OMITTED RATHER THAN BLANKED.** An empty object reads as "somebody with no name"
        and invites a client to render one.

        **WHEN NO IDENTITY WAS ASSUMED THERE IS NOTHING TO CONCEAL**, so the author is sent to
        everybody. The alternative — hiding it whenever the reader is not staff — would make the field
        mean "the sender is not who they say" rather than "here is who really sent this", and a client
        could not tell those apart.
      properties:
        assumed_role:
          $ref: '#/components/schemas/GameMessageAssumedRole'
        author:
          $ref: '#/components/schemas/GameMessageAuthor'

    GameMessageRecipient:
      type: object
      required: [id_user, kind, deleted]
      description: |
        One addressee, with their own receipt and their own deletion.
      properties:
        id_user:
          type: integer
          format: int64
          description: The participant's **user** id, not a participant row's id.
        kind:
          type: string
          enum: [to, cc]
          description: |
            `[7.12.2]` To versus `[7.12.3]` CC. The concept keeps the two lists distinct on the form,
            so collapsing them into one list of names would lose something the form shows.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: |
            A5's read receipt: when this recipient read the message, or `null` until they do. It is
            written once and the **first** instant is kept — see `POST .../read`.
        deleted:
          type: boolean
          description: |
            Whether this recipient has hidden the message from themselves. Present and `false` rather
            than omitted, because its absence would be indistinguishable from a client that did not
            parse it — and **the sender's whole reason for reading this payload is that badge**.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: When they hid it. Visible to the sender, who A7 entitles to know.

    GameMessage:
      type: object
      required:
        - id
        - id_game
        - kind
        - classification
        - sender
        - recipients
        - broadcast
        - degree
        - content
        - created_at
        - assumed_at
      properties:
        id: {type: integer, format: int64}
        id_game: {type: integer, format: int64}
        kind:
          $ref: '#/components/schemas/MessageKind'
        classification:
          $ref: '#/components/schemas/GameMessageClassification'
        sender:
          $ref: '#/components/schemas/GameMessageSender'
        recipients:
          type: array
          description: |
            Every addressee, **including those who hid their copy** — the sender is entitled to see
            that they did, and filtering them out here would remove the evidence and make the badge
            silently never appear.
          items:
            $ref: '#/components/schemas/GameMessageRecipient'
        broadcast:
          type: boolean
          description: |
            True when no recipient was named, which A2 defines as "visible to all game participants".

            **DERIVED FROM `recipients`, NOT STORED.** A flag beside the recipient rows would be two
            sources for one fact with a way to disagree — a flagged broadcast that also has recipients,
            or an unaddressed message that is not flagged. `recipients: []` already means exactly one
            thing, and it is also the right answer for closure playback, where the question is what the
            addressees were **at that instant**.
        id_reply_to:
          type: integer
          format: int64
          nullable: true
          description: |
            A6: a reply creates a **thread**, so this is the message this one answers. `null` for a
            message that starts one.
        degree:
          $ref: '#/components/schemas/Helper'
          description: |
            `[7.7]` Derajat — the grade, resolved from `message_degrees` in `/helpers`.

            **A LABEL WITH NOTHING ATTACHED TO IT**, which is the client's decision of 2026-09-22. The
            concept marks it undecided twice (`[7.7]` "Manual Input or Dropdown (TBD)", `[7.12.8]`
            "Degree - `?`"), so there is no behaviour to implement and **no code reads this to decide
            anything**. The deferred reading — a grade as a handling-time precedence, with the receipt
            above measured against a target — is recorded in `docs/backlog.md` B21, and the reason
            deferring costs nothing is that the target would be a column on that lookup and the
            receipts are being recorded anyway.
        type:
          $ref: '#/components/schemas/Helper'
          description: |
            `[7.5]` Jenis. **ALWAYS ABSENT TODAY, AND THAT IS DELIBERATE.** The concept gives `Jenis`
            no values at all and the client has not supplied them, so `message_types` exists with no
            rows and this field is never populated. Seeding a plausible set would present an invented
            vocabulary as a requirement.

            The column is nullable so a message is expressible before the values arrive, and the table
            is **not** served through `/helpers` — a lookup with no rows has no business being served,
            and the project's own test asserts that every lookup named there has rows.
        content:
          type: string
          description: '`[7.12.5]` "Telegram New Content — Manual Input Box by the User".'
        callsign:
          type: string
          description: '`[7.4]` Panggilan (Petunjuk PAHUB). The concept marks it "`?`".'
        sending_note:
          type: string
          description: '`[7.8]` Instr. Mengirim. The concept marks it "`?`".'
        group_name:
          type: string
          description: '`[7.11]` Grup. The concept marks it "`?`".'
        per:
          type: string
          description: '`[7.14]` Per. The concept marks it "`?`"; A4 settles the meaning as "via / on behalf of".'
        registration_number:
          type: string
          description: |
            `[7.2]` Number. The concept leaves "Manual Input or System Generated" as TBD, so it is
            **free text the operator fills in** rather than a generated sequence.
        created_at:
          type: string
          format: date-time
          description: |
            **`[7.12.6]` Waktu Pembikinan, AND THE AUTHORITATIVE TIMESTAMP** (A9). It orders the
            record, and the inbox is sorted by it.
        assumed_at:
          type: string
          format: date-time
          description: |
            Where the message sits on the **reconstructed scenario clock**.

            **THIS IS NOT `created_at` AND THE TWO DIVERGE WHENEVER THE CLOCK IS PAUSED.** Several
            messages sent during a pause share one assumed instant while keeping their real order, so
            ordering by this would shuffle them. `created_at` orders the record; this places it on the
            timeline a Judge replays.
        sender_deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the **sender withdrew** the message from its recipients (A7). Named for who deleted
            rather than for what happened: a bare `deleted_at` here would read as "the row is gone",
            and it is not — the sender, the Game Master and the Judges still see it.

    GameMessageRequest:
      type: object
      required: [kind, classification, content, id_degree]
      properties:
        kind:
          $ref: '#/components/schemas/MessageKind'
        classification:
          $ref: '#/components/schemas/MessageClassificationValue'
        content:
          type: string
          minLength: 1
          maxLength: 8000
        to:
          type: array
          description: |
            `[7.12.2]` To — the participants the message **addresses**. More than one is allowed
            ("Can be > 1"). Omitting **both** `to` and `cc` makes the message a broadcast, which only
            `TERBUKA` may be.
          items: {type: integer, format: int64}
        cc:
          type: array
          description: |
            `[7.12.3]` Tembusan — the participants it **copies**. Also more than one.

            A person may appear in `to` or in `cc`, never both and never twice: the two lists mean
            different things and a silent collapse would lose which one the sender meant.
          items: {type: integer, format: int64}
        id_assumed_role:
          type: integer
          format: int64
          nullable: true
          description: |
            The scenario role to send **AS**. `[6.1]` makes it **required** for a Telegram message
            from the Game Master or a Judge, and **forbidden** for anybody else — a participant sending
            as an identity would make Q13's concealment voluntary.
        id_reply_to:
          type: integer
          format: int64
          nullable: true
          description: The message this one answers, making it a thread (A6). It must be one the caller can see in this game.
        id_degree:
          type: integer
          format: int64
          description: '`[7.7]` Derajat. The accepted ids come from `GET /helpers` under `message_degrees`.'
        id_type:
          type: integer
          format: int64
          nullable: true
          description: |
            `[7.5]` Jenis. **There is nothing to send today**: the vocabulary is empty, so any id here
            is refused by the database as an unknown reference. The field exists so a client built from
            this document does not have to change when the values arrive.
        callsign: {type: string, maxLength: 255}
        sending_note: {type: string, maxLength: 1000}
        group_name: {type: string, maxLength: 255}
        per: {type: string, maxLength: 255}
        registration_number: {type: string, maxLength: 255}

    GameScenarioRole:
      type: object
      required: [id, id_game, name, created_at]
      properties:
        id: {type: integer, format: int64}
        id_game: {type: integer, format: int64}
        name: {type: string, example: Panglima TNI}
        created_at: {type: string, format: date-time}

    GameScenarioRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The identity to author, as it will appear as the FROM of a message. Unique among this
            game's **live** roles — a rename is allowed, and the uniqueness is partial so that a role
            that has sent a message can be renamed rather than only duplicated.

            A role that has sent a message **cannot be removed**, because the message would lose the
            identity it was sent under and the concealment would silently become a disclosure.
          example: Panglima TNI

    GameMessageEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameMessage'

    GameMessageListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameMessage'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    GameScenarioRoleEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/GameScenarioRole'

    GameScenarioRoleListEnvelope:
      type: object
      required: [status_code, message, data]
      properties:
        status_code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: array
          items:
            $ref: '#/components/schemas/GameScenarioRole'

